services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-mland}_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-sa123123}
      MYSQL_DATABASE: ${DB_NAME:-ppswbs_dev}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./ppswbs_backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-mland}_backend
    restart: unless-stopped
    mem_limit: 2048m
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./ppswbs_backend/.env
        required: false
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseG1GC -Xms512m -Xmx1536m -Duser.timezone=Asia/Ho_Chi_Minh}
      JDBC_URL: jdbc:mysql://db:3306/${DB_NAME:-ppswbs_dev}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      JDBC_USER: ${DB_USER:-root}
      JDBC_PASSWORD: ${DB_PASSWORD:-sa123123}
      FIREBASE_ADMIN_CREDENTIALS_PATH: firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://localhost:3000,https://mland-operations-hub-git-develop-mland-team.vercel.app}
      MEMBER_AUTH_ALLOWED_ORIGINS: ${MEMBER_AUTH_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,https://mland-operations-hub-git-develop-mland-team.vercel.app}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./ppswbs_backend/logs:/app/logs

  frontend:
    build:
      context: ./ppswbs_frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-mland}_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - path: ./ppswbs_frontend/.env
        required: false
    environment:
      USE_POLLING: "true"
      VITE_PROXY_BACKEND_DEFAULT: "http://backend:8080"
    ports:
      - "${HOST_FE_PORT:-5173}:5173"
    volumes:
      - ./ppswbs_frontend:/app
      - /app/node_modules

volumes:
  db_data:
