<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline customer-journey prototype for a ring workshop." />
    <title>Artisanal Atelier · Prototype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a id="skip-link" class="skip-link" href="#app">Đi tới nội dung</a>
    <header class="site-header">
      <button class="brand" type="button" data-action="home" aria-label="Artisanal Atelier home"><span class="brand-mark">◌</span><span>Artisanal Atelier</span></button>
      <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
        <button type="button" data-action="booking">Workshop</button>
        <button type="button" data-action="shop">Ready rings</button>
        <button type="button" data-action="tracking">Tra cứu</button>
      </nav>
      <div class="header-actions">
        <button id="member-action" class="text-button" type="button" data-action="auth"></button>
        <button id="language-toggle" class="language-toggle" type="button" aria-label="Switch language">EN</button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer"><p id="footer-copy"></p><button class="text-button" type="button" data-action="reset">Xoá trạng thái demo</button></footer>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
