openapi: 3.0.3
info:
  title: AI Chatbox Analysis and Suggestion API
  version: 1.0.0-draft
  description: >-
    Draft contract for basic AI support, Member booking-design analysis and
    Manager advisory package/product price suggestions. AI responses never
    directly mutate Mland business state.
servers:
  - url: /api/v1
paths:
  /ai-support/messages:
    post:
      summary: Ask basic AI support
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSupportRequest'
      responses:
        '200':
          description: Validated support response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSupportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /design-requests:
    post:
      summary: Submit a Member booking-design request
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DesignRequestMultipart'
      responses:
        '202':
          description: Analysis request accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignRequestView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /design-requests/{designRequestId}:
    get:
      summary: Read an authorized design request projection
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/DesignRequestId'
      responses:
        '200':
          description: Authorized request projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignRequestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /design-review-requests:
    get:
      summary: List requests within Staff or Manager review scope
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Scoped review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DesignRequestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /design-review-requests/{reviewRequestId}/decisions:
    post:
      summary: Record a human review decision
      security:
        - firebaseBearer: []
      parameters:
        - name: reviewRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignRequestView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /price-proposals/{proposalId}/ai-suggestions:
    post:
      summary: Request an advisory package/product price suggestion
      security:
        - firebaseBearer: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Advisory suggestion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceSuggestionView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase-ID-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    DesignRequestId:
      name: designRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AiSupportRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
    AiSupportResponse:
      type: object
      required: [message, scope]
      properties:
        message:
          type: string
        scope:
          type: string
          enum: [PRODUCT, WORKSHOP, STORE, FAQ, OUT_OF_SCOPE]
        providerCorrelationId:
          type: string
    DesignRequestMultipart:
      type: object
      required: [bookingCode, consentVersion, designVersion, image]
      properties:
        bookingCode:
          type: string
        consentVersion:
          type: string
        designVersion:
          type: integer
          minimum: 1
        image:
          type: string
          format: binary
    DesignRequestView:
      type: object
      required: [id, analysisStatus, reviewStatus, designVersion]
      properties:
        id:
          type: string
          format: uuid
        designVersion:
          type: integer
        analysisStatus:
          type: string
          enum: [PENDING, PROCESSING, SUCCEEDED, FAILED]
        reviewStatus:
          type: string
          enum: [NEED_REVIEW, ACCEPTED, REJECTED, CLARIFICATION_REQUIRED]
        nextAction:
          type: string
        safeFailureCode:
          type: string
          nullable: true
        candidateFeatures:
          type: object
          additionalProperties: true
          nullable: true
    ReviewDecisionRequest:
      type: object
      required: [decision, designVersion, reason]
      properties:
        decision:
          type: string
          enum: [ACCEPTED, REJECTED, CLARIFICATION_REQUIRED]
        designVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    PriceSuggestionView:
      type: object
      required: [proposalId, advisory, suggestionStatus]
      properties:
        proposalId:
          type: string
          format: uuid
        advisory:
          type: boolean
          enum: [true]
        suggestionStatus:
          type: string
          enum: [SUCCEEDED, INVALID, FAILED]
        suggestedPrice:
          type: number
          format: double
          nullable: true
        explanation:
          type: string
          nullable: true
        providerCorrelationId:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request or input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Firebase identity
    Forbidden:
      description: Authenticated actor lacks the required Mland permission
    NotFound:
      description: Resource is not visible to the actor
    Conflict:
      description: Idempotency, stale version or review state conflict
    RateLimited:
      description: Configured request limit exceeded
    ProviderUnavailable:
      description: AI provider unavailable or timed out
