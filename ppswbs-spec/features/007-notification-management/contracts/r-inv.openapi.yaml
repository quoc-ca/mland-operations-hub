openapi: 3.1.0
info:
  title: FE-007 R-INV manual invitation response
  version: 1.0.0-r-inv
  description: Proposed ADMIN-only manual content operation; pending scoped Tech Lead approval.
paths:
  /api/v1/admin/notification-requests/{requestId}/manual-invitation:
    get:
      operationId: getFailedInvitationManualContent
      summary: Retrieve current pinned invitation email after two definite SMTP failures
      security: [{ bearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Transient secret-bearing email content for the active ADMIN only; FE-007 state stays FAILED.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Pragma: { schema: { type: string, const: no-cache } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualInvitationContent' }
        '403': { $ref: '#/components/responses/SafeError' }
        '404': { $ref: '#/components/responses/SafeError' }
        '409': { $ref: '#/components/responses/SafeError' }
        '410': { $ref: '#/components/responses/SafeError' }
        '503': { $ref: '#/components/responses/SafeError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: Firebase-ID-Token }
  responses:
    SafeError:
      description: Typed safe error with correlation ID; no URL or message content.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SafeError' }
  schemas:
    SafeError:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
    ManualInvitationContent:
      type: object
      required: [requestId, invitationVersion, subject, html, plainText, expiresAt, serverNow]
      properties:
        requestId: { type: integer, format: int64 }
        invitationVersion: { type: integer, minimum: 1 }
        subject: { type: string }
        html: { type: string, description: Copy-only email HTML; never execute in ADMIN UI }
        plainText: { type: string }
        expiresAt: { type: string, format: date-time }
        serverNow: { type: string, format: date-time }
