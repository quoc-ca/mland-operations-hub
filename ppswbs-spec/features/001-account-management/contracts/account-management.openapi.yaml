openapi: 3.1.0
info:
  title: Mland Account Management API
  version: 1.0.0
  x-r-inv-path-contract: r-inv.openapi.yaml
  description: >
    Production REST transport contract for FE-001 Account Management.
    Bearer-only credential transport using Firebase ID tokens.
    Firebase proves identity; Mland backend determines Account role, status, and authority.
    R-INV path items below reference the adjacent pending-final-review contract. Role-catalogue
    endpoints are removed from this proposed revision. Current code may lag this target.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot Backend
paths:
  /api/v1/admin/accounts/email-collisions:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1admin~1accounts~1email-collisions'
  /api/v1/admin/accounts/{accountId}/replacement-review:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1admin~1accounts~1{accountId}~1replacement-review'
  /api/v1/admin/accounts/{accountId}/replacement-export:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1admin~1accounts~1{accountId}~1replacement-export'
  /api/v1/admin/accounts/{accountId}/retire-for-replacement:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1admin~1accounts~1{accountId}~1retire-for-replacement'
  /api/v1/admin/firebase-identities/email-collisions/delete:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1admin~1firebase-identities~1email-collisions~1delete'
  /api/v1/internal-account-invitations/exchanges:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1internal-account-invitations~1exchanges'
  /api/v1/internal-account-invitations/completions:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1internal-account-invitations~1completions'
  /api/v1/admin/accounts/{accountId}/setup-invitations/current:
    $ref: './r-inv.openapi.yaml#/paths/~1api~1v1~1admin~1accounts~1{accountId}~1setup-invitations~1current'
  /api/v1/accounts/me:
    put:
      summary: Bootstrap current Account
      description: >
        Resolves or creates the caller's Account from the verified Firebase identity.
        If unknown with a valid email, creates one MEMBER/ACTIVE Account atomically with initial profile.
        A reserved PENDING_SETUP internal email/UID is rejected before MEMBER bootstrap;
        it must complete the R-INV invitation flow. Idempotent on repeated eligible calls.
      operationId: bootstrapOwnAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Account bootstrapped or resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      summary: Get current Account
      description: Returns current Account facts for the authenticated caller.
      operationId: getOwnAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current account facts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/accounts/me/profile:
    get:
      summary: Get current Account owner profile
      description: Returns profile details (full name, phone) for the authenticated account owner.
      operationId: getOwnProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Own profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      summary: Update current Account owner profile
      description: >
        Replaces own full name and optional phone.
        Requires verified email per FR-007 / WF-08.
        Last-successful-commit wins (no version conflict on own profile).
      operationId: updateOwnProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/accounts/me/email:
    put:
      summary: Synchronize verified Firebase identity email
      description: >
        Bodyless route. Server verifies current Firebase ID token and updates login_email
        and email_verified_at snapshot if token has verified email.
        Does not accept browser-supplied email, verification flag, or action code.
      operationId: syncOwnEmail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Email and verification snapshot synchronized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/accounts:
    get:
      summary: List accounts (Admin search/filter; Manager Staff picker)
      description: >-
        Paginated search and filtering of accounts. Excludes credentials and provider UIDs.
        FR-054: a Manager must send role=STAFF and status=ACTIVE (otherwise 403); q is ignored
        and loginEmail and revocationStatus are omitted from the Manager response.
      operationId: listAccounts
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search term matching email or full name
          required: false
          schema:
            type: string
        - name: role
          in: query
          description: Filter by fixed role
          required: false
          schema:
            $ref: '#/components/schemas/AccountRole'
        - name: status
          in: query
          description: Filter by lifecycle status
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: page
          in: query
          description: Zero-based page index
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of records per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Paginated accounts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccountSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/admin/accounts:
    get:
      summary: List accounts (Admin alias)
      description: Alias to GET /api/v1/accounts.
      operationId: listAccountsAdminAlias
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountRole'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Paginated accounts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccountSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/accounts/{id}:
    get:
      summary: Get account detail (Admin)
      description: Returns full account detail including profile and location assignments.
      operationId: getAccountDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/accounts/{id}:
    get:
      summary: Get account detail (Admin alias)
      description: Alias to GET /api/v1/accounts/{id}.
      operationId: getAccountDetailAdminAlias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Account detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/internal-accounts:
    post:
      summary: Create internal Staff, Manager, or CARRIER account
      description: >
        Admin creates a Staff or Manager account with required email in PENDING_SETUP state
        and mandatory FE-007 invitation, or an ACTIVE
        CARRIER account with a Firebase email/password identity. CARRIER requires
        email, password, fullName and phone, and must omit locationIds; it receives
        no invitation. The password is write-only and is never returned.
        Staff/Manager must not send password. Requires an Idempotency-Key header; a
        changed payload with the same key returns 409. Email collision must first be
        resolved by the R-INV flow. Invitation creation starts the 48-hour setup window.
        Validates workshopLocationId(s) against authoritative Workshop Location facade.
      operationId: createInternalAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalAccountCreateRequest'
      responses:
        '200':
          description: Internal account created or preserved idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAccountSummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/admin/accounts/internal:
    post:
      summary: Create internal account (Admin alias)
      description: Alias to POST /api/v1/internal-accounts.
      operationId: createInternalAccountAdminAlias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalAccountCreateRequest'
      responses:
        '200':
          description: Internal account created or preserved idempotent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAccountSummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/accounts/{id}/setup-invitations:
    post:
      summary: Resend invitation for pending internal account
      description: >
        ADMIN-only for a PENDING_SETUP Staff/Manager Account. Enforces a five-minute
        cooldown, invalidates the prior invitation and creates a new delivery intent.
        New 48-hour validity starts at invitation creation. UNKNOWN_OUTCOME
        requires provider/operator reconciliation before resend. Response never includes
        a raw setup link or token.
      operationId: resendInvitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Setup invitation resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAccountSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/admin/accounts/{id}/invitations:
    post:
      summary: Resend invitation (Admin alias)
      description: Alias to POST /api/v1/accounts/{id}/setup-invitations with identical R-INV restrictions.
      operationId: resendInvitationAdminAlias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Setup invitation resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAccountSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/accounts/{id}/profile:
    put:
      summary: Admin update internal account profile
      description: Updates full name and phone for a Staff, Manager, or CARRIER account. Requires optimistic lock version.
      operationId: updateAccountProfileAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/admin/accounts/{id}/profile:
    put:
      summary: Admin update internal account profile (alias)
      description: Alias to PUT /api/v1/accounts/{id}/profile.
      operationId: updateAccountProfileAdminAlias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/accounts/{id}/role-assignment:
    put:
      summary: Assign role and workshop locations
      description: >
        Admin updates role (STAFF or MANAGER) and location assignments.
        Staff requires exactly 1 location; Manager requires 1 or more.
        Requires optimistic lock version.
      operationId: assignRoleAndLocation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleLocationAssignRequest'
      responses:
        '200':
          description: Role and locations assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/admin/accounts/{id}/role-location:
    put:
      summary: Assign role and workshop locations (alias)
      description: Alias to PUT /api/v1/accounts/{id}/role-assignment.
      operationId: assignRoleAndLocationAlias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleLocationAssignRequest'
      responses:
        '200':
          description: Role and locations assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/accounts/{id}/status:
    put:
      summary: Update account status (suspend or restore)
      description: >
        Admin updates status via operation enum: SUSPEND (requires non-empty reason) or UNSUSPEND.
        Protected access is revoked immediately upon suspension.
        Restoration requires prior session revocation to be confirmed.
      operationId: updateAccountStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusCommandRequest'
      responses:
        '200':
          description: Account status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/admin/accounts/{id}/suspend:
    post:
      summary: Suspend account
      description: Dedicated POST endpoint to suspend an account with a mandatory reason.
      operationId: suspendAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSuspendRequest'
      responses:
        '200':
          description: Account suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/admin/accounts/{id}/restore:
    post:
      summary: Restore account
      description: Dedicated POST endpoint to restore a suspended account after revocation completes.
      operationId: restoreAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountIdPathParam'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Account restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummaryResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/accounts/me/addresses:
    get:
      summary: List current Member shipping addresses
      description: Returns up to 10 shipping addresses owned by the authenticated Member, ordered with default address first.
      operationId: getOwnAddresses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List of member shipping addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    post:
      summary: Add new shipping address
      description: Adds a new shipping address. Validates phone number to 10-digit VN format, enforces max 10 addresses quota. Auto-sets default if first address.
      operationId: createOwnAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          description: Shipping address created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/accounts/me/addresses/default:
    get:
      summary: Get default shipping address
      description: Returns the default shipping address for the authenticated Member, or 404 if no address is configured.
      operationId: getDefaultAddress
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Default shipping address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/accounts/me/addresses/{addressId}:
    put:
      summary: Update shipping address
      description: Updates an existing shipping address owned by the authenticated Member.
      operationId: updateOwnAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateRequest'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete shipping address
      description: Physically removes a shipping address. Rejects deletion if address is default and other addresses exist.
      operationId: deleteOwnAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Address deleted successfully
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /api/v1/accounts/me/addresses/{addressId}/default:
    patch:
      summary: Set address as default
      description: Designates the address as default and unsets the previous default address atomically.
      operationId: setDefaultAddress
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Default address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/administrative-divisions/provinces:
    get:
      summary: List provinces in the active administrative directory
      description: Authenticated Member lookup for Province/City selection.
      operationId: listProvinces
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List of provinces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdministrativeDivisionResponse'

  /api/v1/administrative-divisions/provinces/{provinceCode}/communes:
    get:
      summary: List communes for an active-directory province
      description: Returns all Ward, Commune and Special Zone entries for the selected Province/City. The client may filter this bounded province list locally.
      operationId: listCommunesForProvince
      security:
        - bearerAuth: []
      parameters:
        - name: provinceCode
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: List of communes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdministrativeDivisionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
      description: Firebase ID token passed in the Authorization header as `Bearer <token>`.

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional client-supplied tracing correlation identifier. Generated by backend if absent.
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key (UUID or opaque string) for safe retries of account creation.
      schema:
        type: string

    AccountIdPathParam:
      name: id
      in: path
      required: true
      description: Canonical opaque positive integer account identifier.
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    AccountRole:
      type: string
      enum:
        - MEMBER
        - STAFF
        - MANAGER
        - CARRIER
        - ADMIN
      description: Canonical fixed business roles. Exactly one per account.

    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - PENDING_SETUP
        - SUSPENDED
      description: Account lifecycle status.

    RevocationStatus:
      type: string
      enum:
        - NOT_APPLICABLE
        - PENDING
        - CONFIRMED
      description: External identity session revocation progress tracking.

    InternalProvisioningStatus:
      type: string
      enum:
        - PENDING_SETUP
        - INVITATION_SENT
        - ACTIVATED
      description: Internal account provisioning lifecycle state.

    LocationRefResponse:
      type: object
      required:
        - locationId
        - name
      properties:
        locationId:
          type: string
          description: Canonical workshop location identifier string.
        name:
          type: string
          description: Human-readable location display name.

    LocationAssignmentResponse:
      type: object
      required:
        - locationId
        - assignedAt
        - active
      properties:
        locationId:
          type: integer
          format: int64
        assignedAt:
          type: string
          format: date-time
        active:
          type: boolean

    AccountResponse:
      type: object
      required:
        - id
        - email
        - emailVerified
        - role
        - status
        - locations
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Canonical positive integer account identifier as an opaque string.
          example: "42"
        email:
          type: string
          format: email
          maxLength: 254
          description: Normalized Account login email.
        emailVerified:
          type: boolean
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationRefResponse'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/AccountResponse'
        - type: object
          properties:
            fullName:
              type: string
              nullable: true
              maxLength: 100
              example: "Nguyen Van A"
            phone:
              type: string
              nullable: true
              maxLength: 30
              example: "0901234567"

    AccountProfileResponse:
      type: object
      properties:
        fullName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true

    AccountSummaryResponse:
      type: object
      description: loginEmail and revocationStatus are always present for Admin and omitted for Manager (FR-054).
      required:
        - accountId
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        accountId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        loginEmail:
          type: string
          format: email
        revocationStatus:
          $ref: '#/components/schemas/RevocationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccountDetailResponse:
      type: object
      required:
        - accountId
        - role
        - status
        - loginEmail
        - revocationStatus
        - createdAt
        - updatedAt
        - locationAssignments
        - version
      properties:
        accountId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        loginEmail:
          type: string
          format: email
        revocationStatus:
          $ref: '#/components/schemas/RevocationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/AccountProfileResponse'
        locationAssignments:
          type: array
          items:
            $ref: '#/components/schemas/LocationAssignmentResponse'
        version:
          type: integer
          format: int64

    InternalAccountSummaryResponse:
      type: object
      required:
        - accountId
        - role
        - status
        - loginEmail
        - revocationStatus
        - createdAt
        - updatedAt
      properties:
        accountId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        loginEmail:
          type: string
          format: email
        revocationStatus:
          $ref: '#/components/schemas/RevocationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        provisioningStatus:
          $ref: '#/components/schemas/InternalProvisioningStatus'
        invitationLastSentAt:
          type: string
          format: date-time
          nullable: true
        invitationCreatedAt:
          type: string
          format: date-time
          description: Present for pending STAFF/MANAGER invitation only.
        invitationExpiresAt:
          type: string
          format: date-time
          description: Exactly 48 hours after invitation creation; independent of SMTP state.
        serverNow:
          type: string
          format: date-time
          description: Response time for clock-skew-safe ADMIN countdown.
        invitationDeliveryState:
          type: string
          enum: [QUEUED, PENDING, RETRY_SCHEDULED, SENT, FAILED, UNKNOWN_OUTCOME, CANCELLED]
        manualContentEligible:
          type: boolean
          description: True only after two definite failed attempts while current link is unexpired.
        notificationRequestId:
          type: integer
          format: int64
          description: Present once FE-007 consumes the invitation event.

    PagedAccountSummaryResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummaryResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ProfileUpdateRequest:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          description: Required full name. Whitespace-trimmed, no ISO control chars.
        phone:
          type: string
          maxLength: 30
          nullable: true
          description: Optional phone number (7-30 chars).

    InternalAccountCreateRequest:
      type: object
      required:
        - role
        - email
        - fullName
      properties:
        role:
          $ref: '#/components/schemas/AccountRole'
          description: Must be STAFF, MANAGER, or CARRIER. CARRIER requires email, password, fullName, and phone, and must omit locationIds. STAFF/MANAGER retain their existing location requirement.
        email:
          type: string
          format: email
          maxLength: 254
          description: Required normalized login/invitation email for STAFF, MANAGER and CARRIER.
        password:
          type: string
          format: password
          minLength: 6
          writeOnly: true
          description: Required only for CARRIER; forbidden for STAFF/MANAGER. Write-only; never returned, persisted, logged, or audited.
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          maxLength: 30
          nullable: true
        locationIds:
          type: array
          items:
            type: integer
            format: int64
          description: "Required: exactly 1 location for STAFF; 1 or more for MANAGER. Must be omitted for CARRIER."

    InternalProfileUpdateRequest:
      type: object
      required:
        - version
        - fullName
      properties:
        version:
          type: integer
          format: int64
          description: Optimistic concurrency control version.
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          maxLength: 30
          nullable: true

    RoleLocationAssignRequest:
      type: object
      required:
        - version
        - role
        - locationIds
      properties:
        version:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/AccountRole'
        locationIds:
          type: array
          items:
            type: integer
            format: int64

    StatusCommandRequest:
      type: object
      required:
        - operation
      properties:
        version:
          type: integer
          format: int64
          nullable: true
        operation:
          type: string
          enum:
            - SUSPEND
            - UNSUSPEND
        reason:
          type: string
          nullable: true
          description: Mandatory non-empty string when operation is SUSPEND.

    AccountSuspendRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          description: Non-empty operational justification for account suspension.

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - correlationId
        - timestamp
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Full name is required"
        correlationId:
          type: string
          example: "c84b15da-1b9a-4c28-971a-297ebce5a782"
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldErrorDetail'

    FieldErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    AddressType:
      type: string
      enum:
        - HOME
        - OFFICE
      description: Shipping address classification label (Shopee model)

    AddressResponse:
      type: object
      required:
        - id
        - recipientName
        - phoneNumber
        - provinceCode
        - communeCode
        - provinceName
        - communeName
        - communeType
        - detailAddress
        - directoryVersion
        - addressType
        - isDefault
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        recipientName:
          type: string
          example: Nguyen Van A
        phoneNumber:
          type: string
          pattern: '^0[35789]\d{8}$'
          example: '0901234567'
        provinceCode:
          type: string
          example: '<official-province-code>'
        provinceName:
          type: string
          example: Thành phố Hồ Chí Minh
        communeCode:
          type: string
          example: '<official-commune-code>'
        communeName:
          type: string
          example: Phường Sài Gòn
        communeType:
          type: string
          enum: [WARD, COMMUNE, SPECIAL_ZONE]
        detailAddress:
          type: string
          example: 123 Đường Lê Duẩn
        directoryVersion:
          type: string
        addressType:
          $ref: '#/components/schemas/AddressType'
        isDefault:
          type: boolean
          example: true
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
          example: '2026-11-03T22:30:00+07:00'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-03T22:30:00+07:00'

    AddressCreateRequest:
      type: object
      required:
        - recipientName
        - phoneNumber
        - provinceCode
        - communeCode
        - detailAddress
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          description: Vietnamese mobile phone number (normalized to 10 digits)
          example: '0901234567'
        provinceCode:
          type: string
        communeCode:
          type: string
        detailAddress:
          type: string
          minLength: 1
          maxLength: 255
        addressType:
          $ref: '#/components/schemas/AddressType'
          default: HOME
        isDefault:
          type: boolean
          default: false

    AddressUpdateRequest:
      type: object
      required:
        - recipientName
        - phoneNumber
        - provinceCode
        - communeCode
        - detailAddress
        - version
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 255
        phoneNumber:
          type: string
          example: '0901234567'
        provinceCode:
          type: string
        communeCode:
          type: string
        detailAddress:
          type: string
          minLength: 1
          maxLength: 255
        addressType:
          $ref: '#/components/schemas/AddressType'
        isDefault:
          type: boolean
        version:
          type: integer
          format: int64

    AdministrativeDivisionResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: 'HCM'
        name:
          type: string
          example: Thành phố Hồ Chí Minh
        code:
          type: string
          nullable: true

  responses:
    ValidationError:
      description: Bad request / validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedError:
      description: Authentication failure (missing, expired, or invalid bearer token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ForbiddenError:
      description: Authorization failure (suspended account, unverified email, or insufficient role)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Requested account or resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ConflictError:
      description: Conflict (stale optimistic lock version, idempotency digest mismatch, active cooldown, or pending revocation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailableError:
      description: Transient dependency failure (Workshop Location facade or identity provider unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
