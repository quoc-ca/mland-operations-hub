openapi: 3.0.3
info:
  title: Mland Workshop Settlement API
  version: 1.0.0-draft
  description: >-
    Direct-Mland workshop settlement contract. Internal facades between 003.1,
    003.2 and 003.3 are not HTTP APIs. Shared VNPay ingress is documented in
    ../../contracts/vnpay-payment-ingress.openapi.yaml. Browser return URLs never
    settle payment.
paths:
  /api/v1/workshop-settlement-cases:
    get:
      summary: List settlement cases for Manager operations
      description: >-
        Returns safe settlement-case projections ordered newest first. This
        central operations view is Manager-only because settlement cases do not
        carry a location scope. Optional filters are exact caseType/status;
        limit defaults to 100 and is capped at 100.
      security: [{bearerAuth: []}]
      parameters:
        - name: caseType
          in: query
          required: false
          schema: {type: string}
        - name: status
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: Safe settlement-case projections
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SettlementCaseProjection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill:
    parameters:
      - $ref: '#/components/parameters/BookingCode'
      - $ref: '#/components/parameters/GuestContactEmail'
      - $ref: '#/components/parameters/GuestContactPhone'
    get:
      summary: Read the one customer-safe final bill for a booking
      description: >-
        An owning Member uses bearer authentication. A Guest supplies exactly one
        stored contact email or phone in addition to the booking code.
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      summary: Return the booking's existing direct folio (no longer creates it)
      description: >-
        Requires active in-scope Staff authority and Idempotency-Key. Owner
        decision D1 (2026-11-05): the direct-booking folio is created by
        Settlement at deposit confirmation, so this command no longer creates a
        bill; it returns the existing folio (OPEN, FINALIZED or CLOSED). The
        201 response is retained for compatibility until 003.3 T087 realigns
        the implementation; a booking without a folio is a 409.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/operator:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    get:
      summary: Read the booking's folio as an operator
      description: >-
        Backfilled 2026-11-12 (9a5c877). Staff assigned to a session of the
        booking, or any active Manager, reads the folio. The customer route
        GET .../final-bill stays Member/Guest only and an operator never uses it.
        An unassigned Staff is refused with SESSION_ASSIGNMENT_REQUIRED.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/add-ons:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    get:
      summary: List catalogue add-ons an operator may add to the booking's OPEN folio
      description: >-
        Backfilled 2026-11-12 (9a5c877). Returns the active fixed-price add-ons of
        the booking's published package and active location, priced from the
        003.2 catalogue. Same operator authority as the operator read.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Sellable add-ons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [addOnReference, description, amountVnd]
                  properties:
                    addOnReference: {type: string}
                    description: {type: string}
                    amountVnd: {type: integer, format: int64, minimum: 0, description: Whole VND.}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/charges:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Record a Staff-confirmed catalogue add-on or variable charge
      description: >-
        Member/Guest routes are read-only and cannot create charges. An active
        Staff member in booking-location scope or any active Manager records the
        add-on after customer consent at the workshop. The server derives the
        catalogue price. A direct booking appends the line only to its OPEN
        folio; a FINALIZED direct folio rejects the add-on without mutation
        (correction only through the exceptional T040 flow). An OTA shop add-on
        is not recorded here: it uses the separate 003.4 /ota-addon-quotes bill
        and never mutates OTA facts.
        Variable charge uses description, amount and reason.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCommand'
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/payment-attempts:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Start or return the active final-balance payment attempt
      description: >-
        Active Staff in the booking location or any active Manager may start the
        attempt. The server calculates the exact outstanding VND balance; the
        caller supplies no amount or currency. The response contains a short-lived
        VNPay URL/QR value for the customer to pay at settlement. The URL expires
        10 minutes after creation. A pending or unknown attempt prevents another
        attempt; after expiry, QueryDR must confirm the prior attempt did not
        succeed before a new attempt may be created. The URL is not logged,
        audited, placed in an event, or stored in a notification snapshot.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/FinalPaymentAttempt'}
        '201': {$ref: '#/components/responses/FinalPaymentAttempt'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/folio-corrections:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a Manager-only post-FINALIZED folio correction (FR-004c, D7-D10)
      description: >-
        Only an active Manager (global scope) may open a folio correction for an
        overcharge on a FINALIZED direct folio, with a required reason. Staff, Member,
        and Guest are rejected (403). Folio OPEN, CLOSED, or OTA bookings are rejected
        (409/422). Overcharge amount is refunded by bank transfer (superseded 2026-11-12, FR-038, FR-039/FR-040,
        T098: earlier wording "via VNPay partial refund"; no VNPay refund or QueryDR is used): the amount is allocated
        oldest verified payment first, capped by each payment's unrefunded amount, and each allocation opens a
        bank refund request (reason OVERCHARGE_AFTER_FINALIZED) that a Manager confirms as REFUNDED. Superseded by
        POST /workshop-tickets/{ticketCode}/folio/corrections after T106.
        Undercharge is never collected. Idempotent on Idempotency-Key.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FolioCorrectionCommand'}
      responses:
        '201': {$ref: '#/components/responses/FolioCorrection'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/folio-corrections/{correctionReference}:
    parameters:
      - $ref: '#/components/parameters/BookingCode'
      - name: correctionReference
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/GuestContactEmail'
      - $ref: '#/components/parameters/GuestContactPhone'
    get:
      summary: Read a customer-safe folio correction projection
      description: >-
        An owning Member uses bearer authentication. A Guest supplies exactly one
        stored contact email or phone. Manager (global) or Staff in booking location
        scope may read. No provider secret, VNPay payload, or internal PII is exposed.
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/FolioCorrection'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/finalizations:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Finalize an eligible final bill
      description: >-
        Finalization is allowed only after valid signed payment evidence confirms
        the complete final balance. No role can waive or defer collection.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinalizationCommand'}
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/cancellation-cases:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a whole-booking customer cancellation case
      description: >-
        An owning Member sends no proof body. A Guest sends exactly one stored
        contact email or phone. Magic Link alone is not cancellation authority.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GuestContactProof'}
      responses:
        '201': {$ref: '#/components/responses/SettlementCase'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/required-session-change-cases:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a Manager-mediated complete required-session change case
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequiredSessionChangeCommand'}
      responses:
        '201': {$ref: '#/components/responses/SettlementCase'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/mland-cancellation-remedy-cases:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a Manager remedy for an Mland-caused cancellation
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MlandRemedyCommand'}
      responses:
        '201': {$ref: '#/components/responses/SettlementCase'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/cancellation-cases/{caseReference}:
    parameters: &settlementCaseReadParameters
      - $ref: '#/components/parameters/BookingCode'
      - $ref: '#/components/parameters/CaseReference'
      - $ref: '#/components/parameters/GuestContactEmail'
      - $ref: '#/components/parameters/GuestContactPhone'
    get: &settlementCaseReadGet
      summary: Read a customer-safe settlement case
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/SettlementCase'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/required-session-change-cases/{caseReference}:
    parameters: *settlementCaseReadParameters
    get: *settlementCaseReadGet
  /api/v1/workshop-bookings/{bookingCode}/mland-cancellation-remedy-cases/{caseReference}:
    parameters: *settlementCaseReadParameters
    get: *settlementCaseReadGet
  /api/v1/workshop-refund-policies:
    get:
      summary: Read central prospective refund-policy revision history
      description: Requires any active Manager globally.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Central policy revisions
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RefundPolicyRevision'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      summary: Create a prospective refund-policy revision
      description: Requires any active Manager globally; only future-effective values are accepted.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefundPolicyRevisionCommand'}}}
      responses:
        '201':
          description: Created policy revision
          content: {application/json: {schema: {$ref: '#/components/schemas/RefundPolicyRevision'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/ota-addon-bills/{billReference}:
    parameters:
      - name: billReference
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read OTA add-on bill details and latest payment attempt
      description: Requires in-scope Staff or any active Manager globally.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/OtaAddonBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/ota-addon-bills/{billReference}/payment-attempts:
    parameters:
      - name: billReference
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Create a short-lived VNPay payment checkout attempt for an OTA add-on bill (SHOP_ADDON)
      description: >-
        In-scope Staff or any active Manager may initiate checkout for an OPEN OTA add-on bill.
        Exact bill amount only. Only one active pending attempt per bill. Idempotent on Idempotency-Key.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {$ref: '#/components/responses/OtaAddonPaymentAttempt'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/ota-addon-bills/{billReference}/refunds:
    parameters:
      - name: billReference
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Manager-only overcharge refund for a paid OTA add-on bill (ADDON_REFUND)
      description: >-
        Only an active Manager (global scope) may open a refund for an overcharge on a PAID OTA add-on bill,
        with a required reason. Refund amount must be <= unrefunded verified SHOP_ADDON collections.
        Superseded 2026-11-12 (FR-038a, T104): no VNPay partial refund or QueryDR is used. The refund
        opens a bank refund request (reason OTA_ADDON_OVERCHARGE) that follows the FR-039/FR-040 lifecycle
        (PENDING_ACCOUNT, PENDING_APPROVAL, PENDING_TRANSFER, PENDING_RECONCILIATION, REFUNDED, CLOSED_UNREACHABLE)
        under /workshop-refund-requests; Staff may enter the account at the counter, and the case resolves only
        when a Manager confirms REFUNDED. (Earlier wording: executed via VNPay partial refund adapter and
        completed upon signed QueryDR verification.)
        Idempotent on Idempotency-Key.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtaAddonRefundCommand'}
      responses:
        '201': {$ref: '#/components/responses/OtaAddonRefund'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-token}
  parameters:
    BookingCode: {name: bookingCode, in: path, required: true, schema: {type: string}}
    CaseReference: {name: caseReference, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
    GuestContactEmail: {name: contactEmail, in: query, required: false, schema: {type: string, format: email}, description: Guest reads provide exactly one of contactEmail or contactPhone.}
    GuestContactPhone: {name: contactPhone, in: query, required: false, schema: {type: string}, description: Guest reads provide exactly one of contactEmail or contactPhone.}
  schemas:
    GuestContactProof:
      type: object
      oneOf:
        - required: [contactEmail]
        - required: [contactPhone]
      properties:
        contactEmail: {type: string, format: email}
        contactPhone: {type: string}
    ChargeCommand:
      oneOf:
        - type: object
          required: [catalogueAddOnReference]
          properties:
            catalogueAddOnReference: {type: string}
          description: >-
            Fixed catalogue add-on recorded by in-scope Staff or any active
            Manager after workshop consent (FR-004a/FR-004b). Member and Guest
            cannot call this command; no customer contact proof is accepted.
        - type: object
          required: [description, amount, reason]
          properties:
            description: {type: string}
            amount: {type: integer, format: int64, minimum: 1}
            reason: {type: string}
          description: Internal Staff/Manager variable charge only; currency is VND.
    RequiredSessionChangeCommand:
      type: object
      required: [targetRequiredSessionReferences, reason]
      properties:
        targetRequiredSessionReferences: {type: array, minItems: 1, items: {type: string}}
        reason: {type: string}
        cancellationHandoffReference: {type: string, description: Required when this is an Mland-caused replacement.}
    FinalizationCommand:
      type: object
      additionalProperties: false
      description: Empty command. Finalization has no unpaid-balance override.
    FolioCorrectionCommand:
      type: object
      additionalProperties: false
      required: [amountVnd, reason]
      properties:
        amountVnd: {type: integer, format: int64, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 255}
    FolioCorrectionProjection:
      type: object
      required: [correctionReference, bookingReference, billReference, amountVnd, currency, reason, lifecycleStatus, createdAt]
      properties:
        correctionReference: {type: string}
        bookingReference: {type: string}
        billReference: {type: string}
        amountVnd: {type: integer, format: int64, minimum: 1}
        currency: {type: string, enum: [VND]}
        reason: {type: string}
        lifecycleStatus: {type: string, enum: [OPEN, PENDING_PROVIDER, RESOLVED, REJECTED, FAILED]}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MlandRemedyCommand:
      type: object
      required: [reason, replacementOutcome, cancellationHandoffReference]
      properties:
        reason: {type: string}
        replacementOutcome: {type: string, enum: [UNAVAILABLE, DECLINED]}
        cancellationHandoffReference: {type: string}
    FinalBillProjection:
      type: object
      required: [bookingCode, status, currency, outstandingAmount]
      properties:
        bookingCode: {type: string}
        status:
          type: string
          description: >-
            Direct folio state per owner decision D4 (2026-11-05): OPEN,
            FINALIZED (checkout, zero balance) or CLOSED (ordinary
            cancellation/full no-show at the verified collected amount, or a
            verified Mland-caused remedy refund per D11).
        currency: {type: string, enum: [VND]}
        outstandingAmount: {type: integer, format: int64, minimum: 0}
        paidAmount: {type: integer, format: int64, minimum: 0}
        refundedAmount: {type: integer, format: int64, minimum: 0}
        charges: {type: array, items: {$ref: '#/components/schemas/CustomerVisibleCharge'}}
    FinalPaymentAttempt:
      type: object
      required: [attemptReference, merchantReference, amountVnd, currency, paymentUrl, expiresAt, status]
      properties:
        attemptReference: {type: string}
        merchantReference: {type: string}
        amountVnd: {type: integer, format: int64, minimum: 1}
        currency: {type: string, enum: [VND]}
        paymentUrl: {type: string, format: uri, nullable: true, description: Null after expiry or reconciliation; never log or persist in notification payloads.}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, UNKNOWN, EXPIRED, VERIFIED_PAID, VERIFIED_UNPAID]}
    CustomerVisibleCharge:
      type: object
      required: [description, amount]
      properties:
        description: {type: string, nullable: true, description: Null only for a legacy charge created before descriptions were retained.}
        amount: {type: integer, format: int64, minimum: 0}
    SettlementCaseProjection:
      type: object
      required: [caseReference, caseType, status, bookingCode, correlationReference]
      properties:
        caseReference: {type: string}
        caseType: {type: string}
        status: {type: string, enum: [OPEN, PENDING_PROVIDER, RESOLVED, REJECTED, FAILED]}
        bookingCode: {type: string}
        correlationReference: {type: string}
        policyOrAmountOutcome: {type: string, description: Present only when authorized for that outcome.}
    RefundPolicyRevisionCommand:
      type: object
      required: [effectiveAt, wholeBookingRefundPercent]
      properties:
        effectiveAt: {type: string, format: date-time}
        wholeBookingRefundPercent: {type: integer, minimum: 0, maximum: 100}
    RefundPolicyRevision:
      allOf:
        - $ref: '#/components/schemas/RefundPolicyRevisionCommand'
        - type: object
          required: [policyReference]
          properties: {policyReference: {type: string}}
    OtaAddonPaymentAttemptResponse:
      type: object
      required: [attemptReference, billReference, merchantReference, amountVnd, currency, expiresAt, status]
      properties:
        attemptReference: {type: string}
        billReference: {type: string}
        merchantReference: {type: string}
        amountVnd: {type: integer, format: int64, minimum: 1}
        currency: {type: string}
        paymentUrl: {type: string, nullable: true}
        expiresAt: {type: string, format: date-time}
        status: {type: string}
    OtaAddonRefundCommand:
      type: object
      required: [amountVnd, reason]
      properties:
        amountVnd: {type: integer, format: int64, minimum: 1}
        reason: {type: string}
    OtaAddonRefundProjection:
      type: object
      required: [refundReference, caseReference, billReference, channelBookingReference, amountVnd, currency, reason, lifecycleStatus, createdAt, updatedAt]
      properties:
        refundReference: {type: string}
        caseReference: {type: string}
        billReference: {type: string}
        channelBookingReference: {type: string}
        amountVnd: {type: integer, format: int64, minimum: 1}
        currency: {type: string}
        reason: {type: string}
        lifecycleStatus: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OtaAddonBillProjection:
      type: object
      required: [billReference, channelBookingReference, quoteReference, itemCode, itemDescription, amountVnd, currency, lifecycleStatus, locationId, createdAt, refunds]
      properties:
        billReference: {type: string}
        channelBookingReference: {type: string}
        quoteReference: {type: string}
        itemCode: {type: string}
        itemDescription: {type: string}
        amountVnd: {type: integer, format: int64, minimum: 1}
        currency: {type: string}
        lifecycleStatus: {type: string}
        locationId: {type: string}
        createdAt: {type: string, format: date-time}
        latestPaymentAttempt: {$ref: '#/components/schemas/OtaAddonPaymentAttemptResponse'}
        refunds:
          type: array
          items: {$ref: '#/components/schemas/OtaAddonRefundProjection'}
    Problem:
      type: object
      required: [code, correlationReference]
      properties:
        code: {type: string}
        correlationReference: {type: string}
        fieldErrors:
          type: array
          description: Safe validation metadata; never includes rejected values.
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    FinalBill:
      description: Customer-safe final bill projection
      content: {application/json: {schema: {$ref: '#/components/schemas/FinalBillProjection'}}}
    FinalPaymentAttempt:
      description: Short-lived final-payment checkout attempt
      content: {application/json: {schema: {$ref: '#/components/schemas/FinalPaymentAttempt'}}}
    FolioCorrection:
      description: Customer-safe folio correction projection
      content: {application/json: {schema: {$ref: '#/components/schemas/FolioCorrectionProjection'}}}
    SettlementCase:
      description: Safe settlement case projection
      content: {application/json: {schema: {$ref: '#/components/schemas/SettlementCaseProjection'}}}
    OtaAddonBill:
      description: OTA add-on bill projection
      content: {application/json: {schema: {$ref: '#/components/schemas/OtaAddonBillProjection'}}}
    OtaAddonPaymentAttempt:
      description: Short-lived payment checkout attempt for OTA add-on bill
      content: {application/json: {schema: {$ref: '#/components/schemas/OtaAddonPaymentAttemptResponse'}}}
    OtaAddonRefund:
      description: Overcharge refund projection for OTA add-on bill
      content: {application/json: {schema: {$ref: '#/components/schemas/OtaAddonRefundProjection'}}}
    Problem:
      description: Safe typed error
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
