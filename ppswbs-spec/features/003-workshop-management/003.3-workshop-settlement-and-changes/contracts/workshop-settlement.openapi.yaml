openapi: 3.0.3
info:
  title: Mland Workshop Settlement API
  version: 1.0.0-draft
  description: |
    No public REST contract is approved for Workshop Settlement and Changes yet.
    Legacy workshop-item bill paths were retired: V1 uses one final bill for one
    booking/package, and no clarified source approves replacement HTTP paths,
    request/response DTOs, or errors.

    Boundaries with Booking, Operations, Account Management, VNPay and
    Notification are semantic internal facades, not public HTTP APIs. A later
    transport decision must update this document before implementation relies on it.
paths: {}
