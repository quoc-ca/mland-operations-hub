openapi: 3.0.3
info:
  title: Mland Workshop Settlement API
  version: 1.0.0-draft
  description: >-
    Direct-Mland workshop settlement contract. Internal facades between 003.1,
    003.2 and 003.3 are not HTTP APIs. Shared VNPay ingress is documented in
    ../../contracts/vnpay-payment-ingress.openapi.yaml. Browser return URLs never
    settle payment.
paths:
  /api/v1/workshop-bookings/{bookingCode}/final-bill:
    parameters:
      - $ref: '#/components/parameters/BookingCode'
      - $ref: '#/components/parameters/GuestContactEmail'
      - $ref: '#/components/parameters/GuestContactPhone'
    get:
      summary: Read the one customer-safe final bill for a booking
      description: >-
        An owning Member uses bearer authentication. A Guest supplies exactly one
        stored contact email or phone in addition to the booking code.
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      summary: Create the booking-scoped final bill when settlement is ready
      description: Requires active in-scope Staff authority and Idempotency-Key.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '201': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/charges:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Add a permitted fixed catalogue add-on or a confirmed variable charge
      description: >-
        Customer use requires Member ownership or Guest contact proof and permits
        only catalogueAddOnReference. Staff/Manager variable charge uses
        description, amount and reason. Staff must be in active booking-location
        scope; any active Manager may act globally. The server derives catalogue price.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCommand'
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/payment-attempts:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Start or return the active final-balance payment attempt
      description: >-
        Active Staff in the booking location or any active Manager may start the
        attempt. The server calculates the exact outstanding VND balance; the
        caller supplies no amount or currency. The response contains a short-lived
        VNPay URL/QR value for the customer to pay at settlement. The URL expires
        10 minutes after creation. A pending or unknown attempt prevents another
        attempt; after expiry, QueryDR must confirm the prior attempt did not
        succeed before a new attempt may be created. The URL is not logged,
        audited, placed in an event, or stored in a notification snapshot.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/FinalPaymentAttempt'}
        '201': {$ref: '#/components/responses/FinalPaymentAttempt'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/final-bill/finalizations:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Finalize an eligible final bill
      description: >-
        Finalization is allowed only after valid signed payment evidence confirms
        the complete final balance. No role can waive or defer collection.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FinalizationCommand'}
      responses:
        '200': {$ref: '#/components/responses/FinalBill'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/cancellation-cases:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a whole-booking customer cancellation case
      description: >-
        An owning Member sends no proof body. A Guest sends exactly one stored
        contact email or phone. Magic Link alone is not cancellation authority.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GuestContactProof'}
      responses:
        '201': {$ref: '#/components/responses/SettlementCase'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/required-session-change-cases:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a Manager-mediated complete required-session change case
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RequiredSessionChangeCommand'}
      responses:
        '201': {$ref: '#/components/responses/SettlementCase'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/mland-cancellation-remedy-cases:
    parameters: [{$ref: '#/components/parameters/BookingCode'}]
    post:
      summary: Open a Manager remedy for an Mland-caused cancellation
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MlandRemedyCommand'}
      responses:
        '201': {$ref: '#/components/responses/SettlementCase'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/cancellation-cases/{caseReference}:
    $ref: '#/components/pathItems/SettlementCaseRead'
  /api/v1/workshop-bookings/{bookingCode}/required-session-change-cases/{caseReference}:
    $ref: '#/components/pathItems/SettlementCaseRead'
  /api/v1/workshop-bookings/{bookingCode}/mland-cancellation-remedy-cases/{caseReference}:
    $ref: '#/components/pathItems/SettlementCaseRead'
  /api/v1/workshop-refund-policies:
    get:
      summary: Read central prospective refund-policy revision history
      description: Requires any active Manager globally.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Central policy revisions
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RefundPolicyRevision'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      summary: Create a prospective refund-policy revision
      description: Requires any active Manager globally; only future-effective values are accepted.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefundPolicyRevisionCommand'}}}
      responses:
        '201':
          description: Created policy revision
          content: {application/json: {schema: {$ref: '#/components/schemas/RefundPolicyRevision'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-token}
  parameters:
    BookingCode: {name: bookingCode, in: path, required: true, schema: {type: string}}
    CaseReference: {name: caseReference, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
    GuestContactEmail: {name: contactEmail, in: query, required: false, schema: {type: string, format: email}, description: Guest reads provide exactly one of contactEmail or contactPhone.}
    GuestContactPhone: {name: contactPhone, in: query, required: false, schema: {type: string}, description: Guest reads provide exactly one of contactEmail or contactPhone.}
  pathItems:
    SettlementCaseRead:
      parameters:
        - $ref: '#/components/parameters/BookingCode'
        - $ref: '#/components/parameters/CaseReference'
        - $ref: '#/components/parameters/GuestContactEmail'
        - $ref: '#/components/parameters/GuestContactPhone'
      get:
        summary: Read a customer-safe settlement case
        security: [{}, {bearerAuth: []}]
        responses:
          '200': {$ref: '#/components/responses/SettlementCase'}
          '401': {$ref: '#/components/responses/Problem'}
          '403': {$ref: '#/components/responses/Problem'}
          '404': {$ref: '#/components/responses/Problem'}
  schemas:
    GuestContactProof:
      type: object
      oneOf:
        - required: [contactEmail]
        - required: [contactPhone]
      properties:
        contactEmail: {type: string, format: email}
        contactPhone: {type: string}
    ChargeCommand:
      oneOf:
        - type: object
          required: [catalogueAddOnReference]
          properties:
            catalogueAddOnReference: {type: string}
            contactEmail: {type: string, format: email}
            contactPhone: {type: string}
          description: Guest supplies exactly one contact proof; Member omits both.
        - type: object
          required: [description, amount, reason]
          properties:
            description: {type: string}
            amount: {type: integer, format: int64, minimum: 1}
            reason: {type: string}
          description: Internal Staff/Manager variable charge only; currency is VND.
    RequiredSessionChangeCommand:
      type: object
      required: [targetRequiredSessionReferences, reason]
      properties:
        targetRequiredSessionReferences: {type: array, minItems: 1, items: {type: string}}
        reason: {type: string}
        cancellationHandoffReference: {type: string, description: Required when this is an Mland-caused replacement.}
    FinalizationCommand:
      type: object
      additionalProperties: false
      description: Empty command. Finalization has no unpaid-balance override.
    MlandRemedyCommand:
      type: object
      required: [reason, replacementOutcome, cancellationHandoffReference]
      properties:
        reason: {type: string}
        replacementOutcome: {type: string, enum: [UNAVAILABLE, DECLINED]}
        cancellationHandoffReference: {type: string}
    FinalBillProjection:
      type: object
      required: [bookingCode, status, currency, outstandingAmount]
      properties:
        bookingCode: {type: string}
        status: {type: string}
        currency: {type: string, enum: [VND]}
        outstandingAmount: {type: integer, format: int64, minimum: 0}
        paidAmount: {type: integer, format: int64, minimum: 0}
        refundedAmount: {type: integer, format: int64, minimum: 0}
        charges: {type: array, items: {$ref: '#/components/schemas/CustomerVisibleCharge'}}
    FinalPaymentAttempt:
      type: object
      required: [attemptReference, merchantReference, amountVnd, currency, paymentUrl, expiresAt, status]
      properties:
        attemptReference: {type: string}
        merchantReference: {type: string}
        amountVnd: {type: integer, format: int64, minimum: 1}
        currency: {type: string, enum: [VND]}
        paymentUrl: {type: string, format: uri, nullable: true, description: Null after expiry or reconciliation; never log or persist in notification payloads.}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [PENDING, UNKNOWN, EXPIRED, VERIFIED_PAID, VERIFIED_UNPAID]}
    CustomerVisibleCharge:
      type: object
      required: [description, amount]
      properties:
        description: {type: string, nullable: true, description: Null only for a legacy charge created before descriptions were retained.}
        amount: {type: integer, format: int64, minimum: 0}
    SettlementCaseProjection:
      type: object
      required: [caseReference, caseType, status, bookingCode, correlationReference]
      properties:
        caseReference: {type: string}
        caseType: {type: string}
        status: {type: string, enum: [OPEN, PENDING_PROVIDER, RESOLVED, REJECTED, FAILED, EXPIRED]}
        bookingCode: {type: string}
        correlationReference: {type: string}
        policyOrAmountOutcome: {type: string, description: Present only when authorized for that outcome.}
    RefundPolicyRevisionCommand:
      type: object
      required: [effectiveAt, wholeBookingRefundPercent]
      properties:
        effectiveAt: {type: string, format: date-time}
        wholeBookingRefundPercent: {type: integer, minimum: 0, maximum: 100}
    RefundPolicyRevision:
      allOf:
        - $ref: '#/components/schemas/RefundPolicyRevisionCommand'
        - type: object
          required: [policyReference]
          properties: {policyReference: {type: string}}
    Problem:
      type: object
      required: [code, correlationReference]
      properties:
        code: {type: string}
        correlationReference: {type: string}
        fieldErrors:
          type: array
          description: Safe validation metadata; never includes rejected values.
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
  responses:
    FinalBill:
      description: Customer-safe final bill projection
      content: {application/json: {schema: {$ref: '#/components/schemas/FinalBillProjection'}}}
    FinalPaymentAttempt:
      description: Short-lived final-payment checkout attempt
      content: {application/json: {schema: {$ref: '#/components/schemas/FinalPaymentAttempt'}}}
    SettlementCase:
      description: Safe settlement case projection
      content: {application/json: {schema: {$ref: '#/components/schemas/SettlementCaseProjection'}}}
    Problem:
      description: Safe typed error
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
