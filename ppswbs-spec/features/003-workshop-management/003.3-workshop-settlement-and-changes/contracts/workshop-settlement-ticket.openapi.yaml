  /api/v1/workshop-refund-account-key-replacements:
    post:
      summary: Manager replaces the refund-account encryption key operationally (FR-040)
      description: >-
        FR-040, decided 2026-11-15, served 2026-11-16 (task T137). Manager only
        since 2026-11-23 (Admin and Staff are 403). Run after the environment variable
        WORKSHOP_REFUND_ACCOUNT_KEY was replaced and the service restarted: for
        every refund request still holding an encrypted account number it
        deletes the ciphertext (the mask is kept), returns the request to
        PENDING_ACCOUNT, revokes its active link and sends the payer a new
        account link, with one audit record per request. A reason and an
        Idempotency-Key are required; a replay returns the stored result. It
        never returns or logs an account number. Not reversible: the numbers
        are gone and payers must enter them again. Decided 2026-11-15 (CHK021):
        one transaction per request, a rerun is idempotent (it touches only
        requests still holding ciphertext), and the earlier Manager approval of
        each such request is voided so a Manager approves again after the new
        account is entered.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200':
          description: Done. Only counts are returned, never an account number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestsReset: {type: integer, format: int32, description: 'Requests returned to PENDING_ACCOUNT by this call; a rerun answers 0.'}
                  linksSent: {type: integer, format: int32, description: 'New account links sent, one per request returned.'}
                  failed: {type: integer, format: int32, description: 'Requests that could not be returned and still hold a ciphertext; a new call with a new Idempotency-Key retries them (T137, 2026-11-16).'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
