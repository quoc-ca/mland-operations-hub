openapi: 3.0.3
info:
  title: Workshop Settlement per Ticket API (planned)
  version: 0.1.0-planned
  description: >-
    Planned contract for spec FR-030–FR-045 (decision 2026-11-12): per-ticket
    folio, counter collection, cash day close, bank refunds, per-ticket
    cancellation, Mland remedy and changes. Not implemented yet (tasks Phase 8).
    Decision 2026-11-14 (T106): the per-ticket folio routes below (add-ons,
    charges, finalizations, debts, corrections, and collections at their
    contract path) replace every /workshop-bookings/{bookingCode}/final-bill*,
    /folio-corrections* and /workshop-folios/{bookingReference}/* route; the
    booking-wide routes are removed only after T106.
    Routes move into workshop-settlement.openapi.yaml as they are implemented.
    Money values are whole VND strings.
paths:
  /api/v1/workshop-tickets/{ticketCode}/folio:
    get:
      summary: Read a ticket folio (customer view for the buyer; operator view for assigned Staff or Manager)
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      responses:
        '200': {description: Ticket folio, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections:
    post:
      summary: Record a counter collection (FR-031–FR-034)
      description: >-
        VNPAY starts a VNPay attempt (≥ 5,000) and is confirmed only by signed
        evidence; CASH is confirmed by the collecting Staff; BANK_TRANSFER is
        created PENDING_VERIFICATION and confirmed by an actor with
        workshop.payment.transfer.confirm. The folio is locked; a pending VNPay
        part must be reconciled before switching method.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionRequest'}}}}
      responses:
        '201': {description: Collection recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections/{collectionId}/confirmations:
    post:
      summary: Confirm a pending bank transfer after seeing it in the shop account
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: collectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankTransactionReference]
              properties:
                bankTransactionReference: {type: string, maxLength: 128}
      responses:
        '200': {description: Confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/handover-exceptions:
    post:
      summary: Manager allows product handover before a payment is verified (FR-035)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Exception recorded}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/add-ons:
    get:
      summary: List the catalogue add-ons sellable for this ticket's package and branch (decision 2026-11-14, T106)
      description: Replaces GET /workshop-bookings/{bookingCode}/final-bill/add-ons. Manager or Staff assigned to a session of the ticket.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      responses:
        '200':
          description: Sellable add-ons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [catalogueAddOnReference, name, price]
                  properties:
                    catalogueAddOnReference: {type: string}
                    name: {type: string}
                    price: {$ref: '#/components/schemas/Vnd'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/charges:
    post:
      summary: Add a catalogue add-on or a variable charge to an OPEN ticket folio (decision 2026-11-14, T106)
      description: >-
        Replaces POST /workshop-bookings/{bookingCode}/final-bill/charges with
        the same rules: the folio is OPEN, a session of the ticket has started,
        the price is at least 5,000 VND (FR-037) and a catalogue add-on is
        priced by the server from the 003.2 catalogue (D17–D18). Refused with
        FINAL_BILL_NOT_OPEN after FINALIZED: no add-on is ever added, changed or
        removed then, and the folio is never reopened (D7–D10, confirmed
        2026-11-14).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalogueAddOnReference: {type: string, description: A catalogue add-on; the server sets the price.}
                quantity: {type: integer, minimum: 1}
                description: {type: string, maxLength: 255, description: A variable charge only.}
                amount: {$ref: '#/components/schemas/Vnd'}
      responses:
        '201': {description: Charge added, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/finalizations:
    post:
      summary: Finalize a ticket folio whose balance is already zero (FR-035, decision 2026-11-14, T106)
      description: >-
        Replaces POST /workshop-bookings/{bookingCode}/final-bill/finalizations.
        Runs the same rule as automatic finalization: balance 0 and no pending
        collection. Needed when nothing new is collected, for example a ticket
        paid in full at booking. Idempotent; a finalized folio returns as is.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Finalized, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/debts:
    post:
      summary: Manager records a real debt on the ticket folio (FR-035)
      description: Moves the code route POST /workshop-folios/{bookingReference}/debt to this path (T106).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Debt recorded}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/debts/closures:
    post:
      summary: Manager closes the ticket folio's debt (FR-035)
      description: Moves the code route POST /workshop-folios/{bookingReference}/debt/close to this path (T106).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Debt closed}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/corrections:
    post:
      summary: Manager opens a post-FINALIZED overcharge correction on a ticket folio (FR-004c, D7–D10, T106)
      description: >-
        Replaces POST /workshop-bookings/{bookingCode}/folio-corrections. Only
        an overcharge, only an active Manager, reason required. The overcharge
        becomes a bank refund request (T097/T098), never a VNPay refund; an
        undercharge is absorbed by Mland and never collected. The folio stays
        FINALIZED.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overchargeAmount, reason]
              properties:
                overchargeAmount: {$ref: '#/components/schemas/Vnd'}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '201': {description: Correction opened, content: {application/json: {schema: {$ref: '#/components/schemas/FolioCorrection'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/corrections/{correctionReference}:
    get:
      summary: Read one ticket folio correction (Manager)
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: correctionReference, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Correction, content: {application/json: {schema: {$ref: '#/components/schemas/FolioCorrection'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-cash-closes:
    post:
      summary: Close a branch's cash book for one working day (FR-036)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, workingDate, countedAmount]
              properties:
                locationId: {type: integer, format: int64}
                workingDate: {type: string, format: date}
                countedAmount: {$ref: '#/components/schemas/Vnd'}
                differenceReason: {type: string, maxLength: 1000}
      responses:
        '201': {description: Close recorded; a difference waits for Manager confirmation}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests:
    get:
      summary: List refund requests (Manager; transfer actors see PENDING_TRANSFER)
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/RefundStatus'}}
      responses:
        '200': {description: Refund requests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RefundRequest'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests/{refundId}/transitions:
    post:
      summary: Approve, record the transfer, confirm REFUNDED, close or reopen a refund (FR-039)
      description: >-
        Implemented 2026-11-13. Every transition is Manager-only in V1: the codebase has roles, not named
        permissions, so a Manager is the actor who holds workshop.refund.execute until it can be granted per
        person (owner decision 2026-11-13, needs FE-001). RECORD_TRANSFER needs both a bank reference and a
        proof reference (422 TRANSFER_PROOF_REQUIRED without the proof); CLOSE_UNREACHABLE needs 30 days in
        PENDING_ACCOUNT and a reason; REOPEN restores PENDING_ACCOUNT with a fresh account link.
      security: [{bearerAuth: []}]
      parameters:
        - {name: refundId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [APPROVE, RECORD_TRANSFER, CONFIRM_REFUNDED, CLOSE_UNREACHABLE, REOPEN]}
                bankTransactionReference: {type: string, maxLength: 128}
                proofReference: {type: string, maxLength: 256}
                reason: {type: string, maxLength: 1000}
      responses:
        '200': {description: Transition applied, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequest'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests/{refundId}/account:
    put:
      summary: Staff or Manager enters the recipient account at the counter (FR-038a, FR-040)
      description: >-
        Implemented 2026-11-13. The payer is at the counter, so any active Staff member or a Manager may record
        what they hand over; the entry records actor, channel and time and revokes any active link. The
        response never echoes the account number, only the stored mask.
      security: [{bearerAuth: []}]
      parameters: [{name: refundId, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber, holderName]
              properties:
                bankCode: {type: string, maxLength: 32}
                accountNumber: {type: string, maxLength: 32}
                holderName: {type: string, maxLength: 128}
      responses:
        '200': {description: Account recorded, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequest'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests/{refundId}/account-link-resends:
    post:
      summary: Send a fresh single-use account link, revoking the previous one (FR-040)
      description: >-
        Implemented 2026-11-13. Staff or Manager; only possible while the request is PENDING_ACCOUNT
        (409 REFUND_ACCOUNT_ALREADY_ON_FILE otherwise). The token never appears in the response, only in email 7.
      security: [{bearerAuth: []}]
      parameters: [{name: refundId, in: path, required: true, schema: {type: string}}]
      responses:
        '204': {description: A fresh link was sent}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests/{refundId}/account-number:
    get:
      summary: The full recipient account number, for the approving and transferring Manager (FR-040)
      description: >-
        Implemented 2026-11-13. Manager only, audited on every read (REFUND_ACCOUNT_REVEALED) and answered
        with Cache-Control no-store, because this is the one route where the number leaves the database in
        clear. 409 REFUND_ACCOUNT_NOT_ON_FILE while no account was given; after REFUNDED the ciphertext is
        dropped, so only the mask remains.
      security: [{bearerAuth: []}]
      parameters: [{name: refundId, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: The account, in clear
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [refundId, accountNumber]
                properties:
                  refundId: {type: string}
                  bankCode: {type: string, nullable: true}
                  accountNumber: {type: string}
                  holderName: {type: string, nullable: true}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/refund-account-links/{token}:
    post:
      summary: Customer submits the refund account through the single-use link (FR-040)
      description: >-
        Link valid 7 days; single use; a resend revokes the old link. The response never echoes the full account number.
        Implemented 2026-11-13. The link reaches the payer in email 7 as the frontend path /refund-account#{token}
        (the token stays in the fragment); a day-3 or day-7 reminder issues a fresh link and revokes the previous one.
        404 RESOURCE_NOT_FOUND for an unknown link, 410 REFUND_ACCOUNT_LINK_NOT_USABLE when used, revoked or expired.
        The holder is not compared with the payer (decision 2026-11-13); the transferring actor compares the
        holder name the bank shows with the name entered and stops on a mismatch.
        The account page asks for the payer's own account, with the holder name exactly as the bank shows it.
      security: [{}]
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber, holderName]
              properties:
                bankCode: {type: string, maxLength: 32}
                accountNumber: {type: string, maxLength: 32}
                holderName: {type: string, maxLength: 128}
      responses:
        '204': {description: Account recorded}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/cancellations:
    post:
      summary: Buyer cancels a ticket (FR-041, FR-042)
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationRequest'}}}}
      responses:
        '201': {description: Cancelled; reports the 24-hour outcome and returned benefits, content: {application/json: {schema: {$ref: '#/components/schemas/TicketCancellation'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/cancellations:
    post:
      summary: Buyer cancels several tickets of one group at once, all or none (FR-041, FR-042, decision 2026-11-14)
      description: >-
        The same buyer rule, 24-hour benefit rule and per-ticket effects as
        POST /workshop-tickets/{ticketCode}/cancellations, applied to every
        listed ticket in one transaction. Every ticket is checked first (it
        belongs to this group, is unused and its first session has not
        started); if any fails, no ticket is cancelled and the 409 lists the
        failing ticket codes. Each ticket still gets its own 24-hour outcome.
        A replay with the same Idempotency-Key returns the stored result. To
        cancel the whole group, list all its active tickets.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/CancellationRequest'}
                - type: object
                  required: [ticketCodes]
                  properties:
                    ticketCodes: {type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: {type: string}}
      responses:
        '201':
          description: Every listed ticket is cancelled
          content:
            application/json:
              schema:
                type: object
                required: [groupCode, tickets]
                properties:
                  groupCode: {type: string}
                  tickets: {type: array, items: {$ref: '#/components/schemas/TicketCancellation'}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409':
          description: No ticket was cancelled; failingTicketCodes names every ticket that could not be
          content: {application/json: {schema: {$ref: '#/components/schemas/GroupCancellationProblem'}}}
  /api/v1/workshop-tickets/{ticketCode}/changes:
    post:
      summary: Change a ticket's sessions (FR-044, FR-045)
      description: >-
        One counted customer change per ticket (advance or late arrival); a
        price increase must be confirmed with confirmIncrease=true after the
        new schedule and amount are shown.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, targetSessionReferences]
              properties:
                type: {type: string, enum: [ADVANCE, LATE_ARRIVAL]}
                targetSessionReferences: {type: array, minItems: 1, maxItems: 2, items: {type: string, format: uuid}}
                confirmIncrease: {type: boolean}
      responses:
        '200': {description: Changed; returns the price effect}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/mland-remedy/answers:
    post:
      summary: Buyer accepts the replacement or chooses a refund after a Mland cancellation (FR-043)
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {type: string, enum: [ACCEPT_REPLACEMENT, REFUND]}
      responses:
        '200': {description: Answer recorded}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-Token}
  parameters:
    TicketCode: {name: ticketCode, in: path, required: true, schema: {type: string}}
    GroupCode: {name: groupCode, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  responses:
    Problem:
      description: Typed problem
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Vnd: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CollectionRequest:
      type: object
      required: [method, amount]
      properties:
        method: {type: string, enum: [VNPAY, CASH, BANK_TRANSFER]}
        amount: {$ref: '#/components/schemas/Vnd'}
        cashReceived: {$ref: '#/components/schemas/Vnd'}
        customerTransactionReference: {type: string, maxLength: 128}
    Collection:
      type: object
      required: [collectionId, method, amount, status]
      properties:
        collectionId: {type: string}
        method: {type: string, enum: [BOOKING_TIME, VNPAY, CASH, BANK_TRANSFER]}
        amount: {$ref: '#/components/schemas/Vnd'}
        status: {type: string, enum: [PENDING_VERIFICATION, CONFIRMED, FAILED, VOIDED]}
        changeReturned: {$ref: '#/components/schemas/Vnd'}
    TicketFolio:
      type: object
      required: [ticketCode, status, totalAmount, paidAmount, balanceDue, collections]
      properties:
        ticketCode: {type: string}
        status: {type: string, enum: [OPEN, FINALIZED, CLOSED]}
        totalAmount: {$ref: '#/components/schemas/Vnd'}
        paidAmount: {$ref: '#/components/schemas/Vnd'}
        pendingAmount: {$ref: '#/components/schemas/Vnd'}
        balanceDue: {$ref: '#/components/schemas/Vnd'}
        collections: {type: array, items: {$ref: '#/components/schemas/Collection'}}
    RefundStatus: {type: string, enum: [PENDING_ACCOUNT, PENDING_APPROVAL, PENDING_TRANSFER, PENDING_RECONCILIATION, REFUNDED, CLOSED_UNREACHABLE]}
    RefundRequest:
      type: object
      required: [refundId, source, amount, status]
      properties:
        refundId: {type: string}
        ticketCode:
          type: string
          nullable: true
          description: >-
            Null for a group-level refund: a late payment that was never re-confirmed has no confirmed ticket
            and no folio, so the request belongs to the group (decision 2026-11-13).
        groupCode: {type: string, nullable: true}
        source:
          type: string
          description: The stored refund reason (decision 2026-11-13; the five values the backend persists).
          enum: [MLAND_CANCELLATION, LATE_PAYMENT_NOT_RECONFIRMED, OVERCHARGE_AFTER_FINALIZED, EXCESS_OR_DUPLICATE_MONEY, OTA_ADDON_OVERCHARGE]
        amount: {$ref: '#/components/schemas/Vnd'}
        status: {$ref: '#/components/schemas/RefundStatus'}
        accountNumberMasked: {type: string, nullable: true}
        holderName: {type: string, nullable: true}
    Problem:
      type: object
      required: [code, correlationId]
      properties:
        code: {type: string}
        correlationId: {type: string}
        message: {type: string}
    TicketCancellation:
      type: object
      required: [ticketCode, benefitOutcome, pointsReturned]
      properties:
        ticketCode: {type: string}
        benefitOutcome:
          type: string
          enum: [VALID_CANCELLATION, LATE_CANCELLATION]
          description: FR-042. At least 24 hours before the ticket's first session, or later (treated as a no-show for benefits).
        pointsReturned: {type: integer, format: int64, minimum: 0}
        voucherRestored: {type: boolean, description: "True only on the cancellation that ends the group's last ticket and restores its one voucher use."}
    FolioCorrection:
      type: object
      required: [correctionReference, ticketCode, overchargeAmount, status]
      properties:
        correctionReference: {type: string}
        ticketCode: {type: string}
        overchargeAmount: {$ref: '#/components/schemas/Vnd'}
        refundId: {type: string, nullable: true, description: The bank refund request opened for the overcharge.}
        status: {type: string, enum: [OPEN, REFUND_REQUESTED, COMPLETED]}
    CancellationRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
        buyerVerificationReference:
          type: string
          description: >-
            Decision 2026-11-14. Required for a Guest buyer and for Staff at the
            counter (who also gives the reason): the single-use, group-scoped,
            15-minute reference from POST
            /workshop-booking-groups/{groupCode}/buyer-verifications and its
            confirmation (003.1 FR-041, BE-DESIGN-0003). Not sent by a Member,
            who is proven by the bearer token and group ownership. It is
            consumed only when the cancellation commits. A recipient cannot
            cancel.
    GroupCancellationProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          required: [failingTicketCodes]
          properties:
            failingTicketCodes: {type: array, items: {type: string}}
