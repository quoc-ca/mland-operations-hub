openapi: 3.0.3
info:
  title: Workshop Settlement per Ticket API (planned)
  version: 0.1.0-planned
  description: >-
    Planned contract for spec FR-030–FR-045 (decision 2026-11-12): per-ticket
    folio, counter collection, cash day close, bank refunds, per-ticket
    cancellation, Mland remedy and changes. Not implemented yet (tasks Phase 8).
    Routes move into workshop-settlement.openapi.yaml as they are implemented.
    Money values are whole VND strings.
paths:
  /api/v1/workshop-tickets/{ticketCode}/folio:
    get:
      summary: Read a ticket folio (customer view for the buyer; operator view for assigned Staff or Manager)
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      responses:
        '200': {description: Ticket folio, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections:
    post:
      summary: Record a counter collection (FR-031–FR-034)
      description: >-
        VNPAY starts a VNPay attempt (≥ 5,000) and is confirmed only by signed
        evidence; CASH is confirmed by the collecting Staff; BANK_TRANSFER is
        created PENDING_VERIFICATION and confirmed by an actor with
        workshop.payment.transfer.confirm. The folio is locked; a pending VNPay
        part must be reconciled before switching method.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionRequest'}}}}
      responses:
        '201': {description: Collection recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections/{collectionId}/confirmations:
    post:
      summary: Confirm a pending bank transfer after seeing it in the shop account
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: collectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankTransactionReference]
              properties:
                bankTransactionReference: {type: string, maxLength: 128}
      responses:
        '200': {description: Confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/handover-exceptions:
    post:
      summary: Manager allows product handover before a payment is verified (FR-035)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Exception recorded}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-cash-closes:
    post:
      summary: Close a branch's cash book for one working day (FR-036)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationId, workingDate, countedAmount]
              properties:
                locationId: {type: integer, format: int64}
                workingDate: {type: string, format: date}
                countedAmount: {$ref: '#/components/schemas/Vnd'}
                differenceReason: {type: string, maxLength: 1000}
      responses:
        '201': {description: Close recorded; a difference waits for Manager confirmation}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests:
    get:
      summary: List refund requests (Manager; transfer actors see PENDING_TRANSFER)
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/RefundStatus'}}
      responses:
        '200': {description: Refund requests, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RefundRequest'}}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-refund-requests/{refundId}/transitions:
    post:
      summary: Approve, record the transfer, confirm REFUNDED, close or reopen a refund (FR-039)
      description: >-
        APPROVE and CONFIRM_REFUNDED are Manager-only; RECORD_TRANSFER needs
        workshop.refund.execute and a bank reference and proof; CLOSE_UNREACHABLE
        needs 30 days in PENDING_ACCOUNT and a reason; REOPEN restores
        PENDING_ACCOUNT.
      security: [{bearerAuth: []}]
      parameters:
        - {name: refundId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [APPROVE, RECORD_TRANSFER, CONFIRM_REFUNDED, CLOSE_UNREACHABLE, REOPEN]}
                bankTransactionReference: {type: string, maxLength: 128}
                proofReference: {type: string, maxLength: 256}
                reason: {type: string, maxLength: 1000}
      responses:
        '200': {description: Transition applied, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequest'}}}}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/refund-account-links/{token}:
    post:
      summary: Customer submits the refund account through the single-use link (FR-040)
      description: Link valid 7 days; single use; a resend revokes the old link. The response never echoes the full account number.
      security: [{}]
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber, holderName]
              properties:
                bankCode: {type: string, maxLength: 32}
                accountNumber: {type: string, maxLength: 32}
                holderName: {type: string, maxLength: 128}
      responses:
        '204': {description: Account recorded}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/cancellations:
    post:
      summary: Buyer cancels a ticket (FR-041, FR-042)
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Cancelled; reports the 24-hour outcome and returned benefits}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/changes:
    post:
      summary: Change a ticket's sessions (FR-044, FR-045)
      description: >-
        One counted customer change per ticket (advance or late arrival); a
        price increase must be confirmed with confirmIncrease=true after the
        new schedule and amount are shown.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, targetSessionReferences]
              properties:
                type: {type: string, enum: [ADVANCE, LATE_ARRIVAL]}
                targetSessionReferences: {type: array, minItems: 1, maxItems: 2, items: {type: string, format: uuid}}
                confirmIncrease: {type: boolean}
      responses:
        '200': {description: Changed; returns the price effect}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/mland-remedy/answers:
    post:
      summary: Buyer accepts the replacement or chooses a refund after a Mland cancellation (FR-043)
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: {type: string, enum: [ACCEPT_REPLACEMENT, REFUND]}
      responses:
        '200': {description: Answer recorded}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-Token}
  parameters:
    TicketCode: {name: ticketCode, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  responses:
    Problem:
      description: Typed problem
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Vnd: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 1000}
    CollectionRequest:
      type: object
      required: [method, amount]
      properties:
        method: {type: string, enum: [VNPAY, CASH, BANK_TRANSFER]}
        amount: {$ref: '#/components/schemas/Vnd'}
        cashReceived: {$ref: '#/components/schemas/Vnd'}
        customerTransactionReference: {type: string, maxLength: 128}
    Collection:
      type: object
      required: [collectionId, method, amount, status]
      properties:
        collectionId: {type: string}
        method: {type: string, enum: [BOOKING_TIME, VNPAY, CASH, BANK_TRANSFER]}
        amount: {$ref: '#/components/schemas/Vnd'}
        status: {type: string, enum: [PENDING_VERIFICATION, CONFIRMED, FAILED, VOIDED]}
        changeReturned: {$ref: '#/components/schemas/Vnd'}
    TicketFolio:
      type: object
      required: [ticketCode, status, totalAmount, paidAmount, balanceDue, collections]
      properties:
        ticketCode: {type: string}
        status: {type: string, enum: [OPEN, FINALIZED, CLOSED]}
        totalAmount: {$ref: '#/components/schemas/Vnd'}
        paidAmount: {$ref: '#/components/schemas/Vnd'}
        pendingAmount: {$ref: '#/components/schemas/Vnd'}
        balanceDue: {$ref: '#/components/schemas/Vnd'}
        collections: {type: array, items: {$ref: '#/components/schemas/Collection'}}
    RefundStatus: {type: string, enum: [PENDING_ACCOUNT, PENDING_APPROVAL, PENDING_TRANSFER, PENDING_RECONCILIATION, REFUNDED, CLOSED_UNREACHABLE]}
    RefundRequest:
      type: object
      required: [refundId, ticketCode, source, amount, status]
      properties:
        refundId: {type: string}
        ticketCode: {type: string}
        source: {type: string, enum: [MLAND_CANCELLATION, LATE_PAYMENT, OVERCHARGE, EXCESS_OR_DUPLICATE]}
        amount: {$ref: '#/components/schemas/Vnd'}
        status: {$ref: '#/components/schemas/RefundStatus'}
        accountNumberMasked: {type: string, nullable: true}
        holderName: {type: string, nullable: true}
    Problem:
      type: object
      required: [code, correlationId]
      properties:
        code: {type: string}
        correlationId: {type: string}
        message: {type: string}
