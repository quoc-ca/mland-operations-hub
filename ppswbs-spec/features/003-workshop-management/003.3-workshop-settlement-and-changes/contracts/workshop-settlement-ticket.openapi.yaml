        - {name: state, in: query, required: false, description: "All four states when absent. VOIDED = a collection a Manager voided; EXCESS = signed VNPay money that settled no part of the folio (FOLIO_VNPAY_EXCESS evidence, owed back by a bank refund). Added 2026-11-15.", schema: {type: string, enum: [CONFIRMED, PENDING_VERIFICATION, VOIDED, EXCESS]}}
