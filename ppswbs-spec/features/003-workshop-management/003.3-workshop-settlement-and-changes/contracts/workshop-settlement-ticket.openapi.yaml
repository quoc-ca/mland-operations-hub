openapi: 3.0.3
info:
  title: Workshop Settlement per Ticket API
  version: 0.3.0
  description: >-
    Contract for spec FR-030–FR-057 (decision 2026-11-12; FR-052–FR-055
    added 2026-11-14, FR-056–FR-057 added 2026-11-15): per-ticket
    folio, counter collection, cash day close, bank refunds, per-ticket
    cancellation, Mland remedy and changes. Implemented and served by the code (tasks T093–T125).
    Decision 2026-11-14 (T106): the per-ticket folio routes below (add-ons,
    charges, finalizations, debts, corrections, and collections at their
    contract path) replace every /workshop-bookings/{bookingCode}/final-bill*,
    /folio-corrections* and /workshop-folios/{bookingReference}/* route; the
    booking-wide routes are removed (T106, T123, T124).
    Every per-ticket route stays in this file once implemented (plan "Public
    REST Design"); workshop-settlement.openapi.yaml keeps only the routes
    still served booking-wide.
    Money values are whole VND strings (Vnd schema); the CashClose and
    expected-cash responses still use the code's whole VND integers.
    Decided 2026-11-14 (spec FR-052–FR-055), added by T106: Manager-only public
    routes with a required reason and audit for the cash-close difference
    confirmation (canonical family /workshop-cash-closes/{cashCloseId}/difference-confirmations),
    the void of a folio line or collection, and the Manager-granted extra
    change; a Staff-on-behalf change reuses
    POST /workshop-tickets/{ticketCode}/changes with buyer proof and a reason,
    so it gets no route of its own.
    T123 (2026-11-15): the FR-052–FR-054 routes below are published as served by
    the code (line and collection voids, change-allowances, cash-close
    difference-confirmations); the retired /workshop-cash-days/* routes are no
    longer listed.
    2026-11-15 (spec FR-056, FR-057, Clarifications Session 2026-11-15): the
    routes marked x-status planned (reconciliation list, absorbed-undercharge
    record, void and list) were designed 2026-11-15 and are served since 2026-11-16
    (tasks T133, T135; x-status planned removed). C2 (decided 2026-11-15): every
    cash-close route, parameter and schema uses locationId and workingDate; the
    backend follows since T131 (2026-11-16), the frontend in T132.
    2026-11-15 (checklist payment-error-access.md, tasks Phase 11 T144-T171):
    the Manager-only cash reversal route, the account-entry confirmation
    flag, the return-to-PENDING_ACCOUNT transition and the optional transfer
    receipt image are PROPOSED here (names and codes are proposals until
    approved); the receipt image storage, size and retention are decided (plan O-1,
    2026-11-15): JPEG/PNG/WebP, at most 5,000,000 bytes, authenticated Cloudinary
    object, ATTACHED image not deleted before 5 years after the request reaches
    REFUNDED or CLOSED_UNREACHABLE (delete job T166, after V1).
    Served 2026-11-16 (T154, backend): the two receipt-image routes POST /workshop-refund-requests/{refundId}/receipt-images and
    GET /workshop-refund-requests/{refundId}/receipt-image (T154). Served 2026-11-16: the Manager-only refund-account key
    replacement POST /workshop-refund-account-key-replacements (T137; Admin and Staff get 403), the reconciliation list (T133), the absorbed-undercharge
    record, void and list (T135) and the Manager-only cash reversal
    POST /workshop-tickets/{ticketCode}/folio/collections/{collectionId}/cash-reversals
    (T144). The TicketCancellation field voucherRestored is replaced by the
    proposed voucherRestoration {restored, reason} (T155).
paths:
  /api/v1/workshop-tickets/{ticketCode}/folio:
    get:
      summary: Read a ticket folio (customer view for the owning Member; operator view for assigned Staff or Manager)
      description: >-
        Bearer only: the Member who owns the ticket's group gets the customer
        view; a Manager, or Staff assigned to a session of the ticket's group
        line, gets the operator view. A Guest reads through POST
        /workshop-tickets/{ticketCode}/folio-lookups instead, so no contact
        proof ever travels in a URL (decision 2026-11-14).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      responses:
        '200': {description: Ticket folio, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio-lookups:
    post:
      summary: Guest reads a ticket folio with one contact proof of the group (decision 2026-11-14, FR-048)
      description: >-
        Same proof as 003.1 POST /workshop-booking-group-lookups: exactly one
        of contactEmail or contactPhone of the group the ticket belongs to. A
        wrong ticket code or a wrong proof answers the same 404 and never says
        which part failed; same rate limits as the group lookup. Read-only, so
        it never consumes a buyerVerificationReference (that single-use proof
        is for changes only). Served Cache-Control no-store.
      security: [{}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactEmail: {type: string, format: email, maxLength: 254}
                contactPhone: {type: string, maxLength: 32}
              oneOf:
                - required: [contactEmail]
                - required: [contactPhone]
      responses:
        '200': {description: Customer view of the ticket folio, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {description: 'Rate limit of the 003.1 group lookup reached; retry later', content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections:
    post:
      summary: Record a counter collection (FR-031–FR-034)
      description: >-
        VNPAY starts a VNPay attempt (≥ 5,000) and is confirmed only by signed
        evidence; CASH is confirmed by the collecting Staff; BANK_TRANSFER is
        created PENDING_VERIFICATION and confirmed by the holder of
        workshop.payment.transfer.confirm, which in V1 is a Manager (decision
        2026-11-12; per-person grants wait for FE-001). The folio is locked; a
        pending VNPay part must be reconciled before switching method.
        T108 (2026-11-14): for VNPAY the server creates the merchant reference
        and the checkout URL (valid 10 minutes) and returns them as paymentUrl
        and paymentExpiresAt; any customerTransactionReference sent with VNPAY
        is ignored.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CollectionRequest'}}}}
      responses:
        '201': {description: Collection recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections/{collectionId}/confirmations:
    post:
      summary: Confirm a pending bank transfer after seeing it in the shop account
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: collectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankTransactionReference]
              properties:
                bankTransactionReference: {type: string, maxLength: 128}
      responses:
        '200': {description: Confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections/{collectionId}/failures:
    post:
      summary: Manager reconciles a stuck pending VNPay or transfer part as not paid (T109, FR-031, FR-034)
      description: >-
        Manager only, reason required, audited. Sets a PENDING_VERIFICATION part
        of this ticket's folio to FAILED so another method can take the balance;
        a part of another folio is 404, a part that is no longer pending is 409.
        Signed VNPay money that still arrives for a FAILED part is kept in full
        and opened as an EXCESS_OR_DUPLICATE_MONEY bank refund (T110). The
        system also fails a pending VNPay part by itself on a signed IPN or
        QueryDR answer with transaction status 02.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: collectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '200': {description: Part failed, content: {application/json: {schema: {$ref: '#/components/schemas/Collection'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/lines/{lineId}/voids:
    post:
      summary: Manager voids a wrongly recorded folio line (FR-053, decided 2026-11-14)
      description: >-
        Manager only, reason and Idempotency-Key required, audited. Allowed only
        while the folio is OPEN. A void is an audited reversal record and never
        deletes the original row; the balance is recomputed from what remains.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: lineId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '200': {description: Line voided, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections/{collectionId}/voids:
    post:
      summary: Manager voids a wrongly recorded collection (FR-053, decided 2026-11-14)
      description: >-
        Manager only, reason and Idempotency-Key required, audited. Allowed only
        while the folio is OPEN; a collection already counted into a closed cash
        day is refused (FR-050). The original row is kept and the balance is
        recomputed from what remains.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: collectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '200': {description: Collection voided, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/collections/{collectionId}/cash-reversals:
    post:
      summary: Manager reverses a wrongly recorded cash collection of a closed day (FR-036, FR-053, proposed)
      description: >-
        SERVED 2026-11-16 (T144; decided in spec FR-036, checklist CHK014; the UI is T145).
        Refusals answer 409 with the codes FINAL_BILL_NOT_OPEN, COLLECTION_UNDER_REFUND,
        COLLECTION_NOT_CASH, COLLECTION_ALREADY_VOIDED, COLLECTION_NOT_CONFIRMED,
        COLLECTION_ALREADY_REVERSED and CASH_DAY_NOT_CLOSED. Manager only
        (Staff 403); reason and Idempotency-Key required; audited with actor and
        time. Records a negative cash amount equal to the collection's applied
        amount on the CURRENT Vietnam working day (the day after the close once
        the counted amount was submitted); the closed day is never edited and
        the original collection keeps its row. The folio's collected amount
        falls and balanceDue is recomputed. Refused with 409 when the folio is
        FINALIZED or CLOSED (FINAL_BILL_NOT_OPEN, use the folio correction and
        bank refund of FR-050/FR-038), when a refund request exists for that
        money (COLLECTION_UNDER_REFUND), when the collection is not CASH or is
        already voided/reversed, or when its cash day is not yet closed
        (CASH_DAY_NOT_CLOSED, use the void of FR-053). A same-key replay returns
        the stored reversal; a changed reuse is 409 IDEMPOTENCY_CONFLICT.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: collectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Reversal recorded, content: {application/json: {schema: {$ref: '#/components/schemas/CashReversal'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/handover-exceptions:
    post:
      summary: Manager allows product handover before a payment is verified (FR-035)
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Exception recorded}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/add-ons:
    get:
      summary: List the catalogue add-ons sellable for this ticket's package and branch (decision 2026-11-14, T106)
      description: Replaces GET /workshop-bookings/{bookingCode}/final-bill/add-ons. Manager or Staff assigned to a session of the ticket.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      responses:
        '200':
          description: Sellable add-ons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [catalogueAddOnReference, name, price]
                  properties:
                    catalogueAddOnReference: {type: string}
                    name: {type: string}
                    price: {$ref: '#/components/schemas/Vnd'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/previous-location-add-ons:
    get:
      summary: Manager-only list of the catalogue add-ons sold at a location the ticket no longer belongs to (FR-060, T187)
      description: >-
        Read only; nothing about the add-ons or their charges changes (decided 2026-11-17, Q3/Q4). A charge is listed
        when its CATALOGUE-ADDON reference belongs, per 003.2, to a location other than the ticket's current one; a
        variable charge is never listed. Staff and Members get 403.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}]
      responses:
        '200':
          description: Add-ons sold at the old location
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [chargeReference, catalogueAddOnReference, description, amount, addOnLocationReference, ticketLocationReference]
                  properties:
                    chargeReference: {type: string}
                    catalogueAddOnReference: {type: string}
                    description: {type: string}
                    amount: {$ref: '#/components/schemas/Vnd'}
                    addOnLocationReference: {type: integer, format: int64}
                    ticketLocationReference: {type: integer, format: int64}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/charges:
    post:
      summary: Add a catalogue add-on or a variable charge to an OPEN ticket folio (decision 2026-11-14, T106)
      description: >-
        Replaces POST /workshop-bookings/{bookingCode}/final-bill/charges with
        the same rules: the folio is OPEN, a session of the ticket has started,
        the price is at least 5,000 VND (FR-037) and a catalogue add-on is
        priced by the server from the 003.2 catalogue (D17–D18). Refused with
        FINAL_BILL_NOT_OPEN after FINALIZED: no add-on is ever added, changed or
        removed then, and the folio is never reopened (D7–D10, confirmed
        2026-11-14).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Same two shapes as the booking-wide ChargeCommand.
              oneOf:
                - type: object
                  required: [catalogueAddOnReference]
                  properties:
                    catalogueAddOnReference: {type: string, description: A catalogue add-on; the server sets the price.}
                - type: object
                  required: [description, amount, reason]
                  properties:
                    description: {type: string, maxLength: 255}
                    amount: {$ref: '#/components/schemas/Vnd'}
                    reason: {type: string, minLength: 1, maxLength: 1000}
                  description: Internal Staff/Manager variable charge only.
      responses:
        '201': {description: Charge added, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/finalizations:
    post:
      summary: Finalize a ticket folio whose balance is already zero (FR-035, decision 2026-11-14, T106)
      description: >-
        Replaces POST /workshop-bookings/{bookingCode}/final-bill/finalizations.
        Runs the same rule as automatic finalization: balance 0 and no pending
        collection. Needed when nothing new is collected, for example a ticket
        paid in full at booking. Idempotent; a finalized folio returns as is.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Finalized, content: {application/json: {schema: {$ref: '#/components/schemas/TicketFolio'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/debts:
    post:
      summary: Manager records a real debt on the ticket folio (FR-035)
      description: Moves the code route POST /workshop-folios/{bookingReference}/debt to this path (T106).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Debt recorded}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/debts/closures:
    post:
      summary: Manager closes the ticket folio's debt (FR-035)
      description: Moves the code route POST /workshop-folios/{bookingReference}/debt/close to this path (T106).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
      responses:
        '201': {description: Debt closed}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/corrections:
    post:
      summary: Manager opens a post-FINALIZED overcharge correction on a ticket folio (FR-004c, D7–D10, T106)
      description: >-
        Replaces POST /workshop-bookings/{bookingCode}/folio-corrections. Only
        an overcharge, only an active Manager, reason required. The overcharge
        becomes a bank refund request (T097/T098), never a VNPay refund; an
        undercharge is absorbed by Mland and never collected. The folio stays
        FINALIZED.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overchargeAmount, reason]
              properties:
                overchargeAmount: {$ref: '#/components/schemas/Vnd'}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '201': {description: Correction opened, content: {application/json: {schema: {$ref: '#/components/schemas/FolioCorrection'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/corrections/{correctionReference}:
    get:
      summary: Read one ticket folio correction (owning Member, Manager or assigned Staff)
      description: >-
        T114 (FR-048, Constitution II): no contact proof is accepted in the URL;
        a missing or invalid bearer token answers 401 (fix A09, 2026-11-15; a verified caller who is not the owner,
        a Manager or assigned Staff gets 403 or 404 as for the folio). A Guest reads the ticket folio through
        POST /workshop-tickets/{ticketCode}/folio-lookups with one contact proof
        in the body.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TicketCode'}
        - {name: correctionReference, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Correction, content: {application/json: {schema: {$ref: '#/components/schemas/FolioCorrection'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/absorbed-undercharges:
    post:
      summary: Manager records an undercharge Mland absorbs on a FINALIZED ticket folio (FR-057, planned)
      description: >-
        FR-056/FR-057, added 2026-11-15, SERVED 2026-11-16 (task T135). Manager
        only; reason and Idempotency-Key required; audited. Allowed only on a
        FINALIZED ticket folio (409 FOLIO_NOT_FINALIZED otherwise). Documentation only: it collects nothing, does not reopen or
        change the folio, its lines, balance or Loyalty earn, does not touch
        confirmed or closed cash, and names no employee. The record is
        immutable; a mistake is voided once and a correct amount is recorded
        as a new record. A replay with the same Idempotency-Key returns the
        stored record; a changed reuse is 409 IDEMPOTENCY_CONFLICT.
        Cap (decided 2026-11-15, CHK009): amountVnd may not exceed the ticket's
        folio total (price plus add-ons and variable charges, voided lines
        excluded), and the non-voided records of one ticket together may not
        exceed it either; a larger amount is 422 (code UNDERCHARGE_EXCEEDS_FOLIO_TOTAL, T156).
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountVnd, reason]
              properties:
                amountVnd: {allOf: [{$ref: '#/components/schemas/Vnd'}], pattern: '^[1-9][0-9]*$', description: 'Whole VND string above 0 (Vnd without the value 0).'}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '201': {description: Recorded, content: {application/json: {schema: {$ref: '#/components/schemas/AbsorbedUndercharge'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/folio/absorbed-undercharges/{underchargeReference}/voids:
    post:
