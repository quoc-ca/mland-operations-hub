openapi: 3.0.3
info:
  title: Mland Workshop Operations API
  version: 1.0.0-draft
  description: >-
    Public discovery plus globally authorized Manager and location- and assignment-scoped Staff API for Workshop
    Packages, fixed workshop add-ons, canonical workshop locations, slots,
    sessions, attendance and exception audit. Authorization is evaluated server-side.
    Authorization (owner decision Hồ Hoàng Quốc, 2026-11-15, spec FR-012/FR-012c): an active
    MANAGER is global, including creating and editing workshop locations; an active STAFF needs
    the session location in activeLocationIds and an active assignment to the session; an ADMIN
    has no Workshop Operations business authority and is answered 403 (one exception decided
    2026-11-16, conditional on task T138: read-only GET /workshop-locations as reference data). Errors (spec "Error
    catalogue"): 401 UNAUTHORIZED only for a missing, malformed, invalid or expired bearer token,
    declared on every bearerAuth operation; 403 for a verified identity without a Mland account,
    inactive, wrong role or out of scope; 503 DEPENDENCY_UNAVAILABLE when the Account facade
    cannot supply role, status or activeLocationIds (fail closed, no side effect). Problem.code
    lists the closed set of codes.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /workshop-packages:
    get:
      summary: Browse published Workshop Packages
      security: []
      responses:
        '200': { $ref: '#/components/responses/PackageList' }
    post:
      summary: Create a draft Workshop Package as an active Manager (global scope)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageWrite' } } } }
      responses:
        '201': { $ref: '#/components/responses/Package' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-package-management/packages:
    get:
      summary: List Workshop Packages for the globally authorized Manager
      description: >-
        Returns draft, published and retired packages for the Manager package-management screen.
        Without a state filter all lifecycle states are returned; the public discovery route above
        remains limited to PUBLISHED packages.
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/PackageState' }
      responses:
        '200': { $ref: '#/components/responses/PackageManagementList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}:
    parameters: [ { $ref: '#/components/parameters/PackageId' } ]
    get:
      summary: Get one published Workshop Package
      security: []
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Prospectively update a Workshop Package as an active Manager without changing lifecycle state
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageWrite' } } } }
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/lifecycle-transitions:
    parameters: [ { $ref: '#/components/parameters/PackageId' } ]
    post:
      summary: Publish or retire a Workshop Package as an active Manager
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageLifecycleTransitionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Package' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/sessions:
    parameters: [ { $ref: '#/components/parameters/PackageId' } ]
    get:
      summary: Discover customer-selectable future sessions for one published Workshop Package at one location
      security: []
      parameters:
        - { name: locationId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/CustomerSessionAvailabilityList' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # PACKAGE_NOT_AVAILABLE_AT_LOCATION (spec FR-039, proposed 2026-11-17): Package is INACTIVE at the requested location
  /workshop-package-availability:
    get:
      summary: Read the Package x location availability matrix as an active Manager (spec FR-038, proposed 2026-11-17)
      description: >-
        Active Manager only; Staff, Admin and every other role get 403 (owner decision 2026-11-17).
        Returns every Package, every workshop location and one cell per pair; a pair with no stored
        row is returned as INACTIVE.
      responses:
        '200': { description: Matrix, content: { application/json: { schema: { $ref: '#/components/schemas/PackageAvailabilityMatrix' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/locations/{locationId}/availability:
    parameters:
      - { $ref: '#/components/parameters/PackageId' }
      - { $ref: '#/components/parameters/LocationId' }
    put:
      summary: Set one Package x location pair ACTIVE or INACTIVE as an active Manager (spec FR-038, proposed 2026-11-17)
      description: >-
        Active Manager only. Setting the state the pair already has returns 200 with no change and no
        audit event; a real change writes one audit event. Never blocked by existing bookings, tickets or
        holds (spec FR-040). Unknown Package or location is 404.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageAvailabilityWrite' } } } }
      responses:
        '200': { description: Resulting cell, content: { application/json: { schema: { $ref: '#/components/schemas/PackageAvailabilityCell' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS / OPTIMISTIC_LOCK_CONFLICT
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-audit/operations-events:
    get:
      summary: List Operations audit rows as an active Manager, newest first (spec FR-047 to FR-051, proposed 2026-11-17)
      description: >-
        Active Manager only; Staff, Admin and every other role get 403 and the refused attempt is audited
        DENIED (FR-007b). Keyset paging by id so rows written while browsing never duplicate or skip a row
        (FR-050). Metadata is returned only for whitelisted keys (FR-051). Reading writes no audit row (FR-053).
      parameters:
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: outcome, in: query, required: false, schema: { type: string, enum: [SUCCESS, FAILURE, DENIED, SENT] } }
        - { name: actorId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: sessionId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/AuditCursor' }
        - { $ref: '#/components/parameters/AuditLimit' }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsAuditPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }   # from after to; limit out of range; malformed cursor
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-audit/settlement-records:
    get:
      summary: List 003.3 settlement audit records as an active Manager, newest first (spec FR-047 to FR-052, proposed 2026-11-17)
      description: >-
        Active Manager only. Served by the `workshopsettlement` module (003.3) itself; Operations does not call 003.3 (that would form a module cycle). actorId matches the stored reference account:<id>. reasonText is the full free text of up to 500 characters and may hold
        personal data, so it is Manager-only and never logged (FR-052). Same keyset paging and no-audit-on-read
        rules as the Operations list.
      parameters:
        - { name: actionCode, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: actorId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: aggregateType, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: aggregateReference, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: denied, in: query, required: false, schema: { type: boolean }, description: 'navigation shell and dashboard (014 R-5). With true only denied attempts are returned (action code starting with DENIED_); false or absent changes nothing; any other value is 400 VALIDATION_ERROR.' }
        - { $ref: '#/components/parameters/AuditCursor' }
        - { $ref: '#/components/parameters/AuditLimit' }
      responses:
        '200': { description: One page, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementAuditPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/locations:
    parameters: [ { $ref: '#/components/parameters/PackageId' } ]
    get:
      summary: List the active locations where one published package is sellable (ACTIVE pair only since 2026-11-17, spec FR-039)
      security: []
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/LocationList' }
        '404': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/locations/{locationId}/add-ons:
    parameters:
      - { $ref: '#/components/parameters/PackageId' }
      - { $ref: '#/components/parameters/LocationId' }
    get:
      summary: List active fixed-price add-ons for a published Package at an active location
      security: []
      responses:
        '200': { $ref: '#/components/responses/AddOnList' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a draft fixed-price add-on as a globally authorized active Manager
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddOnWrite' } } } }
      responses:
        '201': { $ref: '#/components/responses/AddOn' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-package-management/packages/{packageId}/locations/{locationId}/add-ons:
    parameters:
      - { $ref: '#/components/parameters/PackageId' }
      - { $ref: '#/components/parameters/LocationId' }
    get:
      summary: List all fixed-price add-ons, including DRAFT and RETIRED, for a globally authorized active Manager
      responses:
        '200': { $ref: '#/components/responses/AddOnList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/locations/{locationId}/add-ons/{addOnReference}:
    parameters:
      - { $ref: '#/components/parameters/PackageId' }
      - { $ref: '#/components/parameters/LocationId' }
      - { $ref: '#/components/parameters/AddOnReference' }
    patch:
      summary: Prospectively update a draft or active add-on as a globally authorized active Manager
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddOnWrite' } } } }
      responses:
        '200': { $ref: '#/components/responses/AddOn' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-packages/{packageId}/locations/{locationId}/add-ons/{addOnReference}/lifecycle-transitions:
    parameters:
      - { $ref: '#/components/parameters/PackageId' }
      - { $ref: '#/components/parameters/LocationId' }
      - { $ref: '#/components/parameters/AddOnReference' }
    post:
      summary: Activate a draft add-on or retire an active add-on as a globally authorized active Manager
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddOnLifecycleTransitionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/AddOn' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-locations:
    get:
      summary: List workshop locations visible to the actor
      description: >-
        An active Manager sees every location; an active Staff member sees the locations in their
        activeLocationIds. An Admin has no Workshop Operations authority and gets 403 (FR-012c).
        Decided 2026-11-16 (Hồ Hoàng Quốc, conditional on task T138): if FE-001 calls this route,
        an Admin gets a separate read-only grant to this list only (reference data, not a business
        permission; no create, edit, assignment or audit right) and 403 stays on every other route.
      responses:
        '200': { $ref: '#/components/responses/LocationList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a workshop location as an active Manager (global scope)
      description: >-
        Manager only (owner decision Hồ Hoàng Quốc, 2026-11-15, spec FR-012c, CHK024; task T129).
        An Admin, a Staff member or any other role is refused with 403 FORBIDDEN. Assigning the
        new location to Staff activeLocationIds stays in Account Management (FE-001).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationWrite' } } } }
      responses:
        '201': { $ref: '#/components/responses/Location' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-locations/{locationId}:
    parameters: [ { $ref: '#/components/parameters/LocationId' } ]
    patch:
      summary: Rename a workshop location or deactivate/reactivate it as an active Manager (global scope)
      description: >-
        Added to V1 (owner decision Hồ Hoàng Quốc, 2026-11-15, spec FR-012c, task T135). Manager only;
        an Admin, a Staff member or any other role is refused with 403 FORBIDDEN. Changes only
        `name`, `address` and `active` (existing columns display_name, address_snapshot, active);
        `code` is immutable and sending a different `code` is refused with 400 VALIDATION_ERROR.
        At least one of the three fields is required. Deactivating (`active=false`) does not touch
        existing sessions, tickets or history. Confirmed by the owner 2026-11-15: renaming, changing the
        address and reactivating are always allowed; deactivating a location that still has a session
        not yet ended (state other than ATTENDANCE_FINALIZED or CANCELLED) that uses it is refused
        with 409 INVALID_STATE and a message.
        Idempotent per Idempotency-Key; one audit event per applied change. An unknown locationId is
        404 RESOURCE_NOT_FOUND.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationUpdate' } } } }
      responses:
        '200': { $ref: '#/components/responses/Location' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # INVALID_STATE (deactivation refused, confirmed 2026-11-15); IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-locations/{locationId}/slots:
    parameters: [ { $ref: '#/components/parameters/LocationId' } ]
    get:
      summary: List location slots
      responses:
        '200': { $ref: '#/components/responses/SlotList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a reusable slot (409 SLOT_OVERLAP_CONFLICT only against another ACTIVE slot)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SlotWrite' } } } }
      responses:
        '201': { $ref: '#/components/responses/Slot' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-slots/{slotId}:
    parameters: [ { $ref: '#/components/parameters/SlotId' } ]
    patch:
      summary: Edit a reusable slot or change its active flag (409 SLOT_OVERLAP_CONFLICT when the result is active and overlaps another ACTIVE slot, including re-activation)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SlotWrite' } } } }
      responses:
        '200': { $ref: '#/components/responses/Slot' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions:
    get:
      summary: Search sessions within the actor's location scope
      parameters:
        - { name: locationId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/SessionState' } }
      responses:
        '200': { $ref: '#/components/responses/SessionList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create one future session in DRAFT by default
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionCreate' } } } }
      responses:
        '201': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-day-summaries:
    get:
      summary: Sessions and check-in progress of one Vietnam day (navigation shell and dashboard, 014 R-1)
      description: >-
        Manager only. date defaults to today in Vietnam time. sessions includes cancelled sessions; checkedIn and expected
        count people holding a valid (ACTIVE) ticket for the sessions that are not cancelled, not the capacity of the sessions.
        Read-only; writes no audit row.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - { name: locationId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Day summary, content: { application/json: { schema: { type: object, required: [date, sessions, cancelledSessions, checkedIn, expected], properties: { date: { type: string, format: date }, sessions: { type: integer, minimum: 0 }, cancelledSessions: { type: integer, minimum: 0 }, checkedIn: { type: integer, minimum: 0 }, expected: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/bulk:
    post:
      summary: Generate bounded future sessions and report duplicates skipped
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkSessionRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/BulkGenerationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    get:
      summary: Get a session (Manager, or Staff in the session location and assigned to it)
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update the capacity and the check-in opening override of a session.
      description: >-
        V1 (decided 2026-11-14): only capacity and checkInOpensAt change. slotId, locationId and workshopDate may be
        sent only with the session's own current values; a different value is refused with 400 instead of being
        ignored. To move a session, create a new one. Send the `version` last read; a different stored version is
        refused with 409 OPTIMISTIC_LOCK_CONFLICT before any field is applied (T112, 2026-11-15).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SessionWrite' } } } }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # OPTIMISTIC_LOCK_CONFLICT (stale version) or INSUFFICIENT_CAPACITY
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/reschedule-quota:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    put:
      summary: Manager sets or clears this session's reschedule quota (FR-035)
      description: >-
        Approved 2026-11-13. quota null returns the session to the default floor(25% x capacity) with a minimum
        of 1 and recomputes it on every capacity change; 0 closes the session to customer changes; a
        Manager-set value is kept when the capacity changes. The used count is never reset, because the
        tickets already moved in keep their seat. Manager only; refused once the session is
        ATTENDANCE_FINALIZED or CANCELLED. Mland replacements neither check nor consume the quota.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RescheduleQuotaRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # INVALID_STATE (session ATTENDANCE_FINALIZED or CANCELLED); IDEMPOTENCY_CONFLICT / IDEMPOTENCY_IN_PROGRESS
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/state-transitions:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Apply a non-cancellation authorized lifecycle transition (PUBLISHED, SALES_PAUSED, IN_PROGRESS); finalization only via attendance-finalizations, cancellation via the reasoned cancellation endpoint
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StateTransitionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/assignable-staff:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    get:
      summary: List the Staff of the session location for the assignment picker (FR-069)
      description: >-
        Manager only. ACTIVE STAFF accounts whose location scope contains the session location,
        ordered by full name; no login email or contact data. Answered in every session state.
      responses:
        '200':
          description: Assignable Staff
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AssignableStaff' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/staff-assignments:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    put:
      summary: Assign one Staff member (adds; never replaces)
      description: >-
        Manager only (spec "Staff session-assignment access", eligibility rules decided 2026-11-15,
        CHK029, task T130). The assignee must exist, have role STAFF, be ACTIVE and have the session
        location in activeLocationIds; otherwise 409 STAFF_NOT_ELIGIBLE with Problem.reason. 403 only
        when the caller is not an active Manager. Allowed only while the session is DRAFT, PUBLISHED,
        SALES_PAUSED or IN_PROGRESS; otherwise 409 INVALID_STATE. Assigning an already actively
        assigned Staff member is a no-op answered 200 with the unchanged session. A refused attempt
        is recorded as a denied-attempt audit (FR-007b).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffAssignmentRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # STAFF_NOT_ELIGIBLE (with reason) or INVALID_STATE (session state)
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Remove one Staff assignment when responsibility remains
      description: >-
        Manager only; 403 for any other caller. Revocation is allowed in every session state and
        takes effect immediately, subject only to the last-assignment confirmation of spec
        Clarifications Q3 (T115). Once checkInOpensAt has passed and while the session is PUBLISHED,
        SALES_PAUSED or IN_PROGRESS (CHK030; no confirmation is needed in any other state), removing the last active Staff
        assignment of the session without confirmLastAssignmentRemoval=true is refused with
        409 LAST_STAFF_ASSIGNMENT_CONFIRMATION_REQUIRED; the Manager repeats the request with
        confirmLastAssignmentRemoval=true to proceed. Both the refusal and the confirmed removal are
        audited (FR-007b). Other refused attempts are recorded as denied-attempt audits too.
        The confirmation is an optional boolean query parameter (default false) because DELETE carries no
        request body here; đã xác nhận bởi Hồ Hoàng Quốc 2026-11-15. A retry with confirmLastAssignmentRemoval=true MUST use a new Idempotency-Key (the refused attempt's key is bound to the first request and would answer IDEMPOTENCY_CONFLICT).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: accountId, in: query, required: true, schema: { type: integer, format: int64 } }
        - name: confirmLastAssignmentRemoval
          in: query
          required: false
          description: >-
            Explicit Manager confirmation (Clarifications Q3, T115). Required to be true only when the
            request removes the last active Staff assignment after checkInOpensAt; ignored otherwise.
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Assignment removed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # LAST_STAFF_ASSIGNMENT_CONFIRMATION_REQUIRED (last active assignment after checkInOpensAt, no confirmation) or INVALID_STATE
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/check-ins:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Normal QR or exact ticket-code check-in; repeat scan returns the existing result without another attendance action
      description: >-
        A ticket cancelled by cancelTicket (FR-031, CHK010) keeps its QR but is refused with 409
        TICKET_CONFLICT and records no attendance. A QR revoked by a recipient change (FR-033) is refused with 409
        TICKET_QR_REVOKED and records no attendance; the ticket's current QR
        or exact ticket code still checks in. A check-in before checkInOpensAt is
        refused with 409 CHECK_IN_NOT_OPEN and Problem.checkInOpensAt (spec FR-005,
        decided 2026-11-15, CHK014, task T126); there is no early-check-in override
        (EARLY_CHECKIN removed 2026-11-17; a Manager sets an earlier checkInOpensAt). Check-in is accepted while the session is PUBLISHED, SALES_PAUSED or IN_PROGRESS
        (T114); a paused session still checks in. A session that is not open for check-in (for example
        ATTENDANCE_FINALIZED or CANCELLED) is 409 INVALID_STATE.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CheckInResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # CHECK_IN_NOT_OPEN, INVALID_STATE, TICKET_CONFLICT or TICKET_QR_REVOKED
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/check-in-overrides:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Authorised exception check-in for an eligible ticket at the same session and location
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInOverrideRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Ticket' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-booking-lookups/{bookingCode}:
    parameters:
      - { name: bookingCode, in: path, required: true, schema: { type: string } }
    get:
      summary: Manager-only audited lookup of a booking's full ticket set across sessions and locations
      description: >-
        Spec FR-003b, Clarifications 2026-11-15 Q4 and "Checklist follow-up, second pass" (CHK026),
        task T116; route name proposed until coded. Manager only; Staff, Admin and any other role get
        403 (a refused attempt is a denied-attempt audit, FR-007b). Read-only. Returns the booking code and
        every ticket with its session, location, validity and attendance state, and never the booking
        contact's full email or phone, a QR value or payment data. An unknown code is 404
        RESOURCE_NOT_FOUND (the Manager may see every booking, so nothing is concealed, unlike the Staff
        lookup of FR-003d). Every successful lookup is audited with actor, booking code and correlation ID.
      responses:
        '200':
          description: The booking's tickets across all sessions and locations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagerBookingLookup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }   # RESOURCE_NOT_FOUND for an unknown booking code
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/booking-lookups/{bookingCode}:
    parameters:
      - { $ref: '#/components/parameters/SessionId' }
      - { name: bookingCode, in: path, required: true, schema: { type: string } }
    get:
      summary: Lookup only eligible tickets for the active session and location
      responses:
        '200': { $ref: '#/components/responses/TicketList' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }   # Generic no-eligible-ticket result (FR-003d): RESOURCE_NOT_FOUND, identical for unknown booking, other session or other location
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/attendance-roster:
    parameters:
      - { $ref: '#/components/parameters/SessionId' }
    get:
      summary: List the valid tickets of the session with their check-in state (Staff assigned to the session, or a Manager)
      responses:
        '200':
          description: Valid tickets of the session, grouped by booking; no customer contact data
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRosterEntry' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/ticket-resends:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Request auditable resend of the buyer's tickets
      description: >-
        At most three requests per booking in 15 minutes (spec FR-003c). A further request is
        refused with 429 REDELIVERY_THROTTLED, sends nothing and carries Retry-After (whole seconds
        until the 15-minute window counted from the first request of that window ends; decided
        2026-11-15, CHK020, task T127); the Staff screen then suggests the
        TICKET_REDELIVERY_UNAVAILABLE override. Refused attempts, including 429 and the two 409 INVALID_STATE
        reasons below, are recorded as denied-attempt audits (FR-007b). A resend refused with
        NO_ELIGIBLE_TICKET or REDELIVERY_REJECTED_BY_BOOKING is not counted toward the three requests
        (the counter belongs to Operations and counts only a request actually processed; decided
        2026-11-16, F15). 409 INVALID_STATE is also returned, with a `reason`, when the
        session state does not allow resend, when the booking has no ACTIVE unused ticket
        (reason NO_ELIGIBLE_TICKET) and when Booking refuses the redelivery
        (reason REDELIVERY_REJECTED_BY_BOOKING); owner decision Hồ Hoàng Quốc
        2026-11-15, names final 2026-11-16 (option A), task T139. These two cases are never 400 or 404, so the response does not reveal
        whether a booking exists. No Idempotency-Key and no deduplication (spec FR-010kh, CHK015, T140):
        each accepted request is a new delivery, limited only by the three-per-15-minutes rule.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TicketResendRequest' } } } }
      responses:
        '202': { description: Delivery request accepted }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }   # INVALID_STATE (session not PUBLISHED, SALES_PAUSED or IN_PROGRESS; or reason NO_ELIGIBLE_TICKET / REDELIVERY_REJECTED_BY_BOOKING, T139)
        '429': { $ref: '#/components/responses/RedeliveryThrottled' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/attendance-finalizations:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Finalise the whole session's attendance
      description: >-
        No Idempotency-Key (spec FR-010kh, CHK015, T140). A repeat after success finds the session no longer
        IN_PROGRESS and is refused 409 INVALID_STATE.
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/attendance-corrections:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Post-finalisation attendance correction (Manager, or Staff assigned to the session)
      description: >-
        Allowed until 24 hours after the latest finalization among the ticket's sessions (spec FR-002b,
        FR-008, FR-032; Staff added 2026-11-27); afterwards 409 INVALID_STATE. Changing to NO_SHOW is also 409
        INVALID_STATE while the ticket folio is finalized (FR-062).
        No Idempotency-Key (spec FR-010kh, CHK015, T140). A correction that sets the value the ticket already
        has returns 200 with the unchanged ticket and writes no second audit event.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceCorrectionRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Ticket' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/check-in-reversals:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Reversal of an erroneous check-in before attendance finalization (Manager, or Staff assigned to the session)
      description: >-
        Staff (added 2026-11-27) may reverse only while the session is IN_PROGRESS, otherwise 409
        INVALID_STATE; a Manager in any state before finalization (spec FR-002b). 409 INVALID_STATE for anyone
        while the ticket folio is finalized (FR-062).
        No Idempotency-Key (spec FR-010kh, CHK015, T140). A repeat after success finds the ticket no longer
        checked in and is refused 409 INVALID_STATE; the original scan is never deleted.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInReversalRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Ticket' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /workshop-sessions/{sessionId}/cancellation-requests:
    parameters: [ { $ref: '#/components/parameters/SessionId' } ]
    post:
      summary: Cancel directly when no commitment exists, otherwise stop operations and create a 003.3 cancellation handoff
      description: >-
        No Idempotency-Key (spec FR-010kh, CHK015, T140). A repeat finds the session already
        CANCELLATION_REQUESTED or CANCELLED and is refused 409 INVALID_STATE; no second handoff is created.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonedRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '202': { description: Cancellation handoff created }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: Firebase-ID-token }
  parameters:
    AuditCursor: { name: cursor, in: query, required: false, description: Opaque id of the last row of the previous page; omit for the first page, schema: { type: string, maxLength: 64 } }
    AuditLimit: { name: limit, in: query, required: false, description: Page size, default 50, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    PackageId: { name: packageId, in: path, required: true, schema: { type: integer, format: int64 } }
    LocationId: { name: locationId, in: path, required: true, schema: { type: integer, format: int64 } }
    SlotId: { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    AddOnReference: { name: addOnReference, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: Reuse the exact key only for the same semantic command; changed payload or scope returns 409. }
  responses:
    Package: { description: Workshop Package, content: { application/json: { schema: { $ref: '#/components/schemas/Package' } } } }
    PackageList: { description: Published Workshop Packages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Package' } } } } }
    PackageManagementList: { description: Workshop Packages across lifecycle states for Manager package management, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Package' } } } } }
    AddOn: { description: Fixed workshop add-on, content: { application/json: { schema: { $ref: '#/components/schemas/AddOn' } } } }
    AddOnList: { description: Active fixed workshop add-ons, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AddOn' } } } } }
    CustomerSessionAvailabilityList: { description: Customer-selectable Package sessions; remaining capacity is a non-guaranteed selection snapshot, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CustomerSessionAvailability' } } } } }
    Location: { description: Workshop location, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
    LocationList: { description: Workshop locations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Location' } } } } }
    Slot: { description: Slot, content: { application/json: { schema: { $ref: '#/components/schemas/Slot' } } } }
    SlotList: { description: Slots, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Slot' } } } } }
    Session: { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
    SessionList: { description: Sessions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } }
    Ticket: { description: Ticket, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
    CheckInResult: { description: Normal check-in result, including a repeated-scan result, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInResult' } } } }
    TicketList: { description: Tickets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Ticket' } } } } }
    BulkGenerationResult: { description: Generation outcome, content: { application/json: { schema: { $ref: '#/components/schemas/BulkGenerationResult' } } } }
    Problem: { description: Problem response, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RedeliveryThrottled:
      description: >-
        REDELIVERY_THROTTLED: the resend limit of three requests per booking in 15 minutes is
        reached; nothing was sent (spec FR-003c, decided 2026-11-15, CHK020).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  headers:
    RetryAfter:
      description: Whole seconds (rounded up, at least 1) until the 15-minute resend window counted from its first request ends.
      schema: { type: integer, minimum: 1 }
  schemas:
    AssignableStaff:
      type: object
      required: [accountId]
      properties:
        accountId: { type: integer, format: int64 }
        fullName: { type: string, nullable: true }
    AuditActor:
      type: object
      required: [accountId]
      properties:
        accountId: { type: integer, format: int64 }
        displayName: { type: string, nullable: true, description: Null when the account no longer exists or has no name }
    OperationsAuditRow:
      type: object
      required: [id, action, outcome, correlationId, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        actor: { allOf: [ { $ref: '#/components/schemas/AuditActor' } ], nullable: true, description: Null for system actions }
        action: { type: string }
        outcome: { type: string, enum: [SUCCESS, FAILURE, DENIED, SENT] }
        sessionId: { type: integer, format: int64, nullable: true }
        correlationId: { type: string }
        metadata: { type: object, additionalProperties: { type: string }, description: All values returned as strings. Whitelisted keys only; empty when none or when the stored value is not valid JSON }
    OperationsAuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OperationsAuditRow' } }
        nextCursor: { type: string, nullable: true, description: Null on the last page }
    SettlementAuditRow:
      type: object
      required: [id, occurredAt, actionCode, aggregateType, aggregateReference, correlationReference]
      properties:
        id: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        actionCode: { type: string }
        aggregateType: { type: string }
        aggregateReference: { type: string }
        actor: { allOf: [ { $ref: '#/components/schemas/AuditActor' } ], nullable: true }
        actorReference: { type: string, nullable: true, description: "Stored actor reference, for example account:12 or SYSTEM; shown as is when it is not an account" }
        correlationReference: { type: string }
        evidenceReference: { type: string, nullable: true }
        reasonText: { type: string, nullable: true, maxLength: 500, description: Full text; Manager only; never logged }
    SettlementAuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SettlementAuditRow' } }
        nextCursor: { type: string, nullable: true }
    PackageState:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
    PackageWrite:
      type: object
      required: [name, description, publicPrice, minParticipants, maxParticipants, requiredSessionCount, sameLocationRequired, minimumSameDaySlotGap, requiredFoundryWorkingDaysBetweenSessions]
      properties:
        name: { type: string }
        description: { type: string }
        publicPrice: { type: integer, format: int64, minimum: 0, description: Public per-participant price in whole VND. }
        minParticipants: { type: integer, minimum: 1 }
        maxParticipants: { type: integer, minimum: 1, description: Must be greater than or equal to minParticipants. }
        requiredSessionCount: { type: integer, minimum: 1 }
        sameLocationRequired: { type: boolean }
        minimumSameDaySlotGap: { type: integer, minimum: 0, description: Required number of configured slots between selected sessions on the same local date; 0 disables this rule. }
        requiredFoundryWorkingDaysBetweenSessions: { type: integer, minimum: 0, description: Minimum number of Monday-Friday local dates strictly between chronological selected sessions; Saturday and Sunday are excluded. Use 0 when no foundry-working-date rule applies. }
    Package:
      allOf:
        - { $ref: '#/components/schemas/PackageWrite' }
        - type: object
          required: [packageId, state]
          properties:
            packageId: { type: integer, format: int64 }
            state: { $ref: '#/components/schemas/PackageState' }
            branchIds:
              type: array
              items: { type: integer, format: int64 }
              description: >-
                Only on the public list GET /workshop-packages: ids of the locations where the package is
                sellable (FR-039), so public offers can be priced per branch (003.1 / 006 FE-03). Absent elsewhere.
    PackageLifecycleTransitionRequest:
      type: object
      required: [targetState]
      properties:
        targetState: { type: string, enum: [PUBLISHED, RETIRED] }
    AddOnState:
      type: string
      enum: [DRAFT, ACTIVE, RETIRED]
    AddOnWrite:
      type: object
      required: [description, priceVnd]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        priceVnd: { type: integer, format: int64, minimum: 1 }
    AddOn:
      allOf:
        - { $ref: '#/components/schemas/AddOnWrite' }
        - type: object
          required: [addOnReference, packageId, locationId, state, currencyCode]
          properties:
            addOnReference: { type: string, format: uuid }
            packageId: { type: integer, format: int64 }
            locationId: { type: integer, format: int64 }
            state: { $ref: '#/components/schemas/AddOnState' }
            currencyCode: { type: string, enum: [VND] }
    AddOnLifecycleTransitionRequest:
      type: object
      required: [targetState]
      properties:
        targetState: { type: string, enum: [ACTIVE, RETIRED] }
    CustomerSessionAvailability:
      type: object
      required: [sessionReference, locationId, scheduledStart, scheduledEnd, saleState, customerSelectable, remainingCapacity]
      properties:
        sessionReference: { type: string, format: uuid, description: Opaque Operations session reference; not a numeric legacy ID. }
        locationId: { type: integer, format: int64 }
        locationName: { type: string, description: 'Location display name (spec FR-044, proposed 2026-11-17).' }
        scheduledStart: { type: string, format: date-time }
        scheduledEnd: { type: string, format: date-time }
        saleState: { type: string, description: "Customer discovery returns only future PUBLISHED sessions" }
        customerSelectable: { type: boolean }
        remainingCapacity: { type: integer, minimum: 0, description: Exact current availability snapshot; reserve remains authoritative. }
    PackageAvailabilityState:
      type: string
      enum: [ACTIVE, INACTIVE]
    PackageAvailabilityCell:
      type: object
      required: [packageId, locationId, state, version]
      properties:
        packageId: { type: integer, format: int64 }
        locationId: { type: integer, format: int64 }
        state: { $ref: '#/components/schemas/PackageAvailabilityState' }
        version: { type: integer, format: int64, minimum: 0, description: 0 for a pair with no stored row. }
    PackageAvailabilityWrite:
      type: object
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/PackageAvailabilityState' }
        version: { type: integer, format: int64, minimum: 0, description: Optional; a stale value returns 409 OPTIMISTIC_LOCK_CONFLICT. }
    PackageAvailabilityMatrix:
      type: object
      required: [packages, locations, cells]
      properties:
        packages:
          type: array
          items: { type: object, required: [id, name, lifecycleState], properties: { id: { type: integer, format: int64 }, name: { type: string }, lifecycleState: { type: string } } }
        locations:
          type: array
          items: { type: object, required: [id, name, active], properties: { id: { type: integer, format: int64 }, name: { type: string }, active: { type: boolean } } }
        cells:
          type: array
          items: { $ref: '#/components/schemas/PackageAvailabilityCell' }
    LocationWrite:
      type: object
      required: [code, name]
      properties: { code: { type: string }, name: { type: string }, address: { type: string }, active: { type: boolean } }
    LocationUpdate:
      type: object
      minProperties: 1
      description: Partial update of a workshop location (T135). `code` is immutable and is not accepted.
      properties: { name: { type: string, minLength: 1 }, address: { type: string }, active: { type: boolean } }
    Location:
      allOf: [ { $ref: '#/components/schemas/LocationWrite' }, { type: object, required: [id], properties: { id: { type: integer, format: int64 } } } ]
    SlotWrite:
      type: object
      required: [label, startsAtLocal, endsAtLocal, active]
      properties:
        label: { type: string }
        startsAtLocal: { type: string, format: time }
        endsAtLocal: { type: string, format: time }
        active: { type: boolean }
    Slot:
      allOf: [ { $ref: '#/components/schemas/SlotWrite' }, { type: object, required: [id, locationId], properties: { id: { type: string, format: uuid }, locationId: { type: integer, format: int64 } } } ]
    SessionState:
      type: string
      enum: [DRAFT, PUBLISHED, SALES_PAUSED, IN_PROGRESS, ATTENDANCE_FINALIZED, CANCELLATION_REQUESTED, CANCELLED]
    SessionWrite:
      type: object
      required: [locationId, slotId, workshopDate, capacity]
      properties:
        locationId: { type: integer, format: int64 }
        slotId: { type: string, format: uuid }
        workshopDate: { type: string, format: date }
        capacity: { type: integer, minimum: 1 }
        checkInOpensAt: { type: string, format: date-time, nullable: true }
        version:
          type: integer
          format: int64
          description: >-
            Version of the session the client last read (T112, 2026-11-15). On PATCH the server compares it with the
            stored version before applying anything and answers 409 OPTIMISTIC_LOCK_CONFLICT on a mismatch; omitted
            means no stale check. Ignored on create. Every Session response returns the current value.
    SessionCreate:
      allOf:
        - { $ref: '#/components/schemas/SessionWrite' }
        - type: object
          properties:
            initialState: { type: string, enum: [DRAFT, PUBLISHED], default: DRAFT, description: 'Creation only; PUBLISHED publishes the session at once, as in bulk generation (FR-001i).' }
    Session:
      allOf:
        - { $ref: '#/components/schemas/SessionWrite' }
        - type: object
          required: [id, version, state, scheduledStartAt, scheduledEndAt, checkInOpeningSource]
          properties:
            id: { type: string, format: uuid }
            locationName: { type: string, description: 'Location display name (spec FR-044, proposed 2026-11-17).' }
            state: { $ref: '#/components/schemas/SessionState' }
            scheduledStartAt: { type: string, format: date-time }
            scheduledEndAt: { type: string, format: date-time }
            checkInOpeningSource: { type: string, enum: [DEFAULT, MANAGER_SET] }
            assignedStaffAccountIds:
              type: array
              description: Accounts of the Staff currently assigned to the session; empty when none.
              items: { type: integer, format: int64 }
            missingStaff:
              type: boolean
              description: >-
                True from checkInOpensAt while the session has no active Staff assignment (Clarifications Q3,
                T115); a flag for Managers, not a block. False before checkInOpensAt and whenever at least
                one Staff assignment is active. Applies only while the session is PUBLISHED, SALES_PAUSED or
                IN_PROGRESS; always false in DRAFT, CANCELLATION_REQUESTED, CANCELLED and ATTENDANCE_FINALIZED
                (CHK030, owner decision 2026-11-15).
            rescheduleQuota:
              type: integer
              description: Tickets this session may receive by customer change (FR-035); the Manager-set value or the default.
            rescheduleQuotaOverridden:
              type: boolean
              description: True when a Manager set the quota, so a capacity change no longer recomputes it.
            rescheduleQuotaUsed:
              type: integer
              description: Tickets this session has already received by customer change.
    RescheduleQuotaRequest:
      type: object
      required: [reason]
      properties:
        quota: { type: integer, minimum: 0, nullable: true, description: 'Null restores the default; 0 closes the session to customer changes.' }
        reason: { type: string, maxLength: 500 }
    AttendanceRosterEntry:
      type: object
      required: [ticketCode, bookingReference, attendanceState]
      properties:
        ticketCode: { type: string }
        bookingReference: { type: string }
        ticketSequence: { type: integer }
        attendanceState: { type: string, enum: [NOT_CHECKED_IN, CHECKED_IN, NO_SHOW] }
        checkedInAt: { type: string, format: date-time, nullable: true }
        correctionClosesAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Finalized session only: the instant the ticket's attendance correction window closes (spec
            FR-060); null otherwise, or while another session of the ticket is not finalized.
    BulkSessionRequest:
      type: object
      required: [locationId, slotIds, from, to, weekdays, capacity]
      properties:
        locationId: { type: integer, format: int64 }
        slotIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        capacity: { type: integer, minimum: 1, description: "Capacity given to every generated session (2026-11-17)." }
        from: { type: string, format: date }
        to: { type: string, format: date }
        weekdays: { type: array, minItems: 1, items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] } }
        initialState: { type: string, enum: [DRAFT, PUBLISHED], default: DRAFT }
    BulkGenerationResult:
      type: object
      required: [createdSessionIds, skippedDuplicates]
      properties:
        createdSessionIds: { type: array, items: { type: string, format: uuid } }
        skippedDuplicates: { type: array, items: { type: string } }
    StateTransitionRequest:
      type: object
      required: [targetState]
      properties:
        targetState: { type: string, enum: [PUBLISHED, SALES_PAUSED, IN_PROGRESS], description: 'Finalization only via attendance-finalizations; cancellation via cancellation-requests (decided 2026-11-15).' }
    StaffAssignmentRequest:
      type: object
      required: [accountId]
      properties: { accountId: { type: integer, format: int64 } }
    CheckInRequest:
      type: object
      properties: { qrToken: { type: string }, ticketCode: { type: string } }
      oneOf: [ { required: [qrToken] }, { required: [ticketCode] } ]
    CheckInOverrideRequest:
      allOf: [ { $ref: '#/components/schemas/CheckInRequest' }, { $ref: '#/components/schemas/ReasonedRequest' } ]
    TicketResendRequest:
      type: object
      required: [bookingCode]
      properties: { bookingCode: { type: string } }
    AttendanceCorrectionRequest:
      allOf: [ { $ref: '#/components/schemas/ReasonedRequest' }, { type: object, required: [ticketCode, correctedAttendanceState], properties: { ticketCode: { type: string }, correctedAttendanceState: { type: string, enum: [CHECKED_IN, NO_SHOW] } } } ]
    CheckInReversalRequest:
      allOf: [ { $ref: '#/components/schemas/ReasonedRequest' }, { type: object, required: [ticketCode], properties: { ticketCode: { type: string } } } ]
    ReasonedRequest:
      type: object
      required: [reasonCode]
      description: >-
        Fixed reason-code catalogue (backfilled 2026-11-12). Codes marked
        note-required need reasonNote; TICKET_REDELIVERY_UNAVAILABLE also needs
        evidenceReference (the failed-redelivery correlation reference).
      properties:
        reasonCode:
          type: string
          enum: [TICKET_REDELIVERY_UNAVAILABLE, CUSTOMER_DEVICE_UNAVAILABLE, PHYSICAL_VOUCHER_VERIFIED, INSTRUCTOR_UNAVAILABLE, FACILITY_ISSUE, WEATHER_EMERGENCY, RECORDING_ERROR, OTHER_REQUIRES_NOTE]
        reasonNote: { type: string }
        evidenceReference: { type: string }
    ManagerBookingLookup:
      type: object
      required: [bookingCode, tickets]
      properties:
        bookingCode: { type: string }
        tickets:
          type: array
          description: Every ticket of the booking in every session and location; no contact data, QR value or payment data.
          items: { $ref: '#/components/schemas/Ticket' }
    Ticket:
      type: object
      required: [ticketCode, sessionId, locationId, validityState, attendanceState]
      properties:
        ticketCode: { type: string }
        sessionId: { type: string, format: uuid }
        locationId: { type: integer, format: int64 }
        validityState: { type: string, enum: [ACTIVE, CANCELLED, REVOKED, REFUNDED] }
        attendanceState: { type: string, enum: [NOT_CHECKED_IN, CHECKED_IN, NO_SHOW] }
        checkedInAt: { type: string, format: date-time, nullable: true }
    CheckInResult:
      allOf:
        - { $ref: '#/components/schemas/Ticket' }
        - type: object
          required: [checkInResult, checkedInAt]
          properties:
            checkInResult: { type: string, enum: [CHECKED_IN, ALREADY_CHECKED_IN] }
            checkedInAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: >-
            Closed list of the spec "Error catalogue" (decided 2026-11-15, owner decision Hồ Hoàng Quốc,
            CHK014). 400 VALIDATION_ERROR, IDEMPOTENCY_KEY_REQUIRED; 401 UNAUTHORIZED (missing, malformed,
            invalid or expired token only); 403 FORBIDDEN (no Mland account, inactive, wrong role
            including Admin, Staff not assigned), LOCATION_SCOPE_DENIED (Staff caller outside location
            scope); 404 RESOURCE_NOT_FOUND; 409 INVALID_STATE, CHECK_IN_NOT_OPEN (adds checkInOpensAt),
            TICKET_CONFLICT, TICKET_QR_REVOKED, INSUFFICIENT_CAPACITY, SLOT_OVERLAP_CONFLICT,
            DUPLICATE_SESSION, OPTIMISTIC_LOCK_CONFLICT, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS,
            STAFF_NOT_ELIGIBLE (adds reason), LAST_STAFF_ASSIGNMENT_CONFIRMATION_REQUIRED (removing the last
            active Staff assignment after checkInOpensAt without confirmLastAssignmentRemoval=true; accepted
            2026-11-15, owner decision Hồ Hoàng Quốc, T115); 429 REDELIVERY_THROTTLED (Retry-After header); 500
            INTERNAL_ERROR; 503 DEPENDENCY_UNAVAILABLE (Account facade unavailable, fail closed).
          enum:
            - VALIDATION_ERROR
            - IDEMPOTENCY_KEY_REQUIRED
            - UNAUTHORIZED
            - FORBIDDEN
            - LOCATION_SCOPE_DENIED
            - RESOURCE_NOT_FOUND
            - INVALID_STATE
            - CHECK_IN_NOT_OPEN
            - TICKET_CONFLICT
            - TICKET_QR_REVOKED
            - INSUFFICIENT_CAPACITY
            - PACKAGE_NOT_AVAILABLE_AT_LOCATION   # proposed 2026-11-17, spec FR-039 (409 on discovery at an inactive pair)
            - SLOT_OVERLAP_CONFLICT
            - DUPLICATE_SESSION
            - OPTIMISTIC_LOCK_CONFLICT
            - IDEMPOTENCY_CONFLICT
            - IDEMPOTENCY_IN_PROGRESS
            - STAFF_NOT_ELIGIBLE
            - LAST_STAFF_ASSIGNMENT_CONFIRMATION_REQUIRED
            - REDELIVERY_THROTTLED
            - INTERNAL_ERROR
            - DEPENDENCY_UNAVAILABLE
          example: CHECK_IN_NOT_OPEN
        detail: { type: string }
        correlationId: { type: string, description: Correlation ID of the request; returned by every Problem body today. }
        checkInOpensAt: { type: string, format: date-time, description: 'Only with CHECK_IN_NOT_OPEN: when normal check-in opens for the session.' }
        reason:
          type: string
          description: 'Only with STAFF_NOT_ELIGIBLE (account reasons) or INVALID_STATE on ticket-resends (NO_ELIGIBLE_TICKET, REDELIVERY_REJECTED_BY_BOOKING; CHK029, T139).'
          enum: [ACCOUNT_NOT_FOUND, NOT_STAFF, NOT_ACTIVE, LOCATION_NOT_IN_SCOPE, NO_ELIGIBLE_TICKET, REDELIVERY_REJECTED_BY_BOOKING]  # last two: final (2026-11-16), code aligned by T139
