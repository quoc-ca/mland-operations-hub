openapi: 3.0.3
info:
  title: Workshop Booking API
  version: 2.0.0
  description: >-
    Direct-Mland booking contract. Decision 2026-11-13 (spec FR-044–FR-051): a
    booking group is the only direct booking, so every route below is a group
    route and every single-`WorkshopBooking` route of FR-046 is deleted, not
    deprecated. T104 (2026-11-14) moved the implemented group routes here from
    workshop-booking-cart.openapi.yaml and aligned the field names with the
    controllers and DTOs that serve them, as T098 decided: the money fields end
    in `Vnd` and are whole-VND integers, the group status field is `groupStatus`,
    and a cart quote nests its tickets under `lines[].tickets[]` instead of one
    flat ticket list. Shared VNPay provider ingress is documented in
    ../../contracts/vnpay-payment-ingress.openapi.yaml.
    OTA bookings (003.4) keep `WorkshopBooking` and are not described here.
paths:
  /api/v1/workshop-cart-quotes:
    post:
      summary: Quote a cart of one or more package lines
      description: >-
        Guest (no `Authorization`) or Member (bearer). Computes the per-ticket
        voucher and point allocation (FR-033, FR-034), the booking-time
        collection per ticket (FR-035) and the group payment mode (FR-036).
        Reserves no capacity and holds no benefit. A Member quote is bound to
        the Member and expires 30 minutes after creation. A Member cart always
        previews the FE-06 point limits, so `maxPoints`, `minRedeemPoints` and
        `pointValueVnd` are reported even when nothing is selected (FR-034); a
        Guest cart has no benefits and reports zeros. A Guest cart that asks for
        a voucher or points is refused with 409 `CART_BENEFITS_NEED_A_MEMBER`.
      security: [{}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CartQuoteRequest'}}}}
      responses:
        '201': {description: Cart quote, content: {application/json: {schema: {$ref: '#/components/schemas/CartQuote'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups:
    post:
      summary: Confirm a cart quote and hold every line atomically
      description: >-
        Holds all lines all-or-nothing (FR-031). Returns `PENDING_PAYMENT` with
        `holdExpiresAt` (12 minutes) and `paymentDeadlineAt` (10 minutes, the
        only deadline a customer is shown) when the group collection is at least
        5,000 VND; returns `CONFIRMED` when the group is 0 VND or deferred below
        5,000 VND (FR-036, FR-038). A capacity failure returns 409 with
        `failingLines` and holds nothing. The quote is accepted once under a row
        lock: `QUOTE_EXPIRED`, `QUOTE_ALREADY_ACCEPTED` and `QUOTE_CHANGED` are
        409. A replay with the same `Idempotency-Key` returns the stored 201.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/CreateIdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateGroupRequest'}}}}
      responses:
        '201': {description: Group created, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroup'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {description: "Quote or capacity refusal; a capacity refusal carries failingLines.", content: {application/json: {schema: {$ref: '#/components/schemas/CartHoldRejection'}}}}
  /api/v1/workshop-booking-groups/{groupCode}/payment-attempts:
    post:
      summary: Start or retry the single VNPay payment of the group
      description: >-
        Only for a group collection of at least 5,000 VND; the amount is
        rechecked immediately before the attempt is created (FR-036).
        `expiresAt` is the group's payment deadline, two minutes before the hold
        ends; a retry never extends the hold (FR-032).
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Payment initiation, content: {application/json: {schema: {$ref: '#/components/schemas/GroupPaymentAttempt'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}:
    get:
      summary: Read an owned group with its tickets (Member buyer view)
      description: >-
        Owning Member bearer only (FR-048). A Guest reads the group through
        POST /workshop-booking-group-lookups or the Magic-Link exchange, so
        contact proof never travels in a URL. A group the Member does not own
        answers 404, never 403. Served `Cache-Control: no-store`.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}]
      responses:
        '200': {description: Group projection with ticketReference per ticket, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroupView'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/members/me/workshop-booking-groups:
    get:
      summary: List the authenticated Member's own booking groups
      description: >-
        Replaces GET /members/me/workshop-bookings (FR-046, FR-048). At most 30
        groups, newest `createdAt` first; an `EXPIRED` group only while
        `holdExpiresAt` is within the last 24 hours. A group that cannot be
        projected is skipped fail-soft. Served `Cache-Control: no-store`.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Member's groups, content: {application/json: {schema: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BookingGroupView'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-group-lookups:
    post:
      summary: Guest lookup of a group by group code and one contact proof
      description: >-
        Replaces POST /booking-lookups (FR-048). Exactly one of `contactEmail`
        or `contactPhone`. A wrong code or a wrong proof answers the same 404
        and never says which part failed; rate limits follow the single-booking
        lookup. The projection omits `qrReference`'s Member-only companion
        `ticketReference`. Served `Cache-Control: no-store`.
      security: [{}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupLookupRequest'}}}}
      responses:
        '200': {description: Group projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroupView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-group-magic-links/exchanges:
    post:
      summary: Exchange the group Magic Link for a read-only group projection
      description: >-
        Replaces POST /booking-magic-links/exchanges (FR-048). The token comes
        from the URL fragment and is never persisted or logged. An expired,
        revoked or unknown token answers the same 404. The projection omits
        `ticketReference`. Served `Cache-Control: no-store`.
      security: [{}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkExchangeRequest'}}}}
      responses:
        '200': {description: Group projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroupView'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/pending-hold-release:
    post:
      summary: Release a PENDING_PAYMENT group's holds before payment
      description: >-
        Guest with exactly one stored contact proof and no bearer, or the owning
        Member with no proof; both give a reason (FR-048). Releases every line's
        hold and ends the group `CANCELLED`; with no payment attempt and no late
        evidence it also releases the held voucher and points (FR-017j). Refused
        with 409 `PAYMENT_ATTEMPT_EXISTS` once a group payment attempt exists,
        and 409 `INVALID_STATE` when the group is not `PENDING_PAYMENT`. A
        replay with the same `Idempotency-Key` returns 204.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupPendingHoldReleaseRequest'}}}}
      responses:
        '204': {description: Released}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/confirmation-deliveries:
    post:
      summary: Resend a CONFIRMED group's buyer confirmation to the stored contact email
      description: >-
        Guest supplies exactly one stored contact proof; the owning Member none;
        Staff within the active location scope of a group session; any active
        Manager globally. Sends every ticket again to the stored contact only,
        never to a recipient, and reuses the active group Magic Link (409
        `ACCESS_LINK_UNAVAILABLE` when none is active). Rolling limits: 3
        accepted self-service resends per group per hour and 5 accepted internal
        resends per group per 15 minutes; a rejected request queues nothing.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ContactProof'}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/GroupActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/magic-link-incidents:
    post:
      summary: Revoke or rotate the group Magic Link
      description: >-
        Any active Manager globally. `ROTATE` revokes the active link and sends
        a new one to the stored contact email; `REVOKE` only revokes. The reason
        must not contain URLs, link fragments or credentials.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkIncidentRequest'}}}}
      responses:
        '200': {description: Safe outcome, content: {application/json: {schema: {$ref: '#/components/schemas/GroupActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/buyer-verifications:
    post:
      summary: Send a buyer-verification OTP to the group's original contact email
      description: >-
        Guest buyer, or Staff at the shop on the buyer's behalf (FR-041,
        decision 2026-11-13). The caller proves the booking with exactly one of
        the stored contact email or phone (the same proof as the guest lookup);
        the OTP always goes to the original contact email, never to a ticket
        recipient. 6 digits, valid 10 minutes, at most 5 wrong attempts; only a
        hash is stored. A new request supersedes the group's active challenge;
        requests are at least 60 seconds apart and at most 5 per hour per group
        (429 `BUYER_VERIFICATION_RATE_LIMITED`). The response never reveals
        whether the contact matched; a mismatch sends nothing.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationRequest'}}}}
      responses:
        '202': {description: Challenge accepted, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationChallenge'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/buyer-verifications/{verificationId}/confirmations:
    post:
      summary: Confirm the OTP and receive a single-use buyerVerificationReference
      description: >-
        On success returns a `buyerVerificationReference` scoped to the group,
        valid 15 minutes and consumed by one recipient change. Errors: 400
        `BUYER_VERIFICATION_FAILED` (wrong code, attempts remain), 409
        `BUYER_VERIFICATION_LOCKED` (5 wrong attempts), 409
        `BUYER_VERIFICATION_EXPIRED` (expired or superseded). An unknown
        `verificationId` is answered like a wrong code.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupCode'}
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationConfirmation'}}}}
      responses:
        '200': {description: Buyer verified, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/recipient:
    put:
      summary: Send a ticket to a recipient email, or change its recipient
      description: >-
        Buyer only, or Staff after verifying the buyer (FR-041, decision
        2026-11-13). Proof: a Member buyer sends a Firebase bearer and must own
        the group; a Guest buyer sends `buyerVerificationReference`; Staff or
        Manager sends a bearer with location scope plus
        `buyerVerificationReference` and `reason`. A recipient has no management
        right. The first send keeps the current QR and is not counted. Changing
        to a different email revokes the old QR at once, issues a new opaque QR
        for the same entitlements (003.2 FR-033), emails the new recipient and
        tells the previous recipient the old QR is void; it counts as one online
        change (at most 3 per ticket). Staff changes are not counted. The same
        email resends with the same QR. Errors: 401
        `BUYER_VERIFICATION_REQUIRED`, 403 `RECIPIENT_CHANGE_FORBIDDEN`, 404
        `TICKET_NOT_FOUND`, 409 `TICKET_NOT_CONFIRMED`, 409
        `TICKET_ALREADY_CHECKED_IN`, 409 `TICKET_QR_REVOKED`, 409
        `RECIPIENT_CHANGE_LIMIT_REACHED` (go to the shop), 409
        `BUYER_VERIFICATION_EXPIRED`, 409 `IDEMPOTENCY_KEY_REUSED`. A refused
        request changes nothing. Audit keeps the masked old and new email, the
        actor, the channel, the time and the correlation only.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecipientRequest'}}}}
      responses:
        '200': {description: Recipient updated, content: {application/json: {schema: {$ref: '#/components/schemas/TicketRecipient'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/late-payment-reviews:
    get:
      summary: Manager queue of late-payment reviews
      description: >-
        Manager only (FR-040a, decision 2026-11-13). Ordered by earliest session
        start, then `resultDueAt`. Carries no buyer contact data. An unknown
        `status` is 400.
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [AUTO_RECONFIRMED, PENDING_MANAGER, MANAGER_CONFIRMED, REFUND_REQUESTED], default: PENDING_MANAGER}}
      responses:
        '200': {description: Queue, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LatePaymentReview'}}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/late-payment-reviews/{reviewId}/decisions:
    post:
      summary: Manager decision on a late payment that was not re-confirmed automatically
      description: >-
        `CONFIRM` only when the failed conditions are limited to the 60-minute
        window or a duplicate booking, the buyer still wants to attend, and
        capacity, start time and the recomputed amount still hold; `REFUND`
        opens a 100% bank refund in 003.3 (FR-040). Only a `PENDING_MANAGER`
        review is decided. `CONFIRM` rechecks conditions 1–3 at decision time
        and holds capacity for the whole group atomically; it is refused with
        409 `LATE_PAYMENT_CONFIRM_NOT_ALLOWED` when any of conditions 1–3 failed
        on arrival or fails now. `REFUND` asks 003.3 through
        `LatePaymentRefundPort` in the same transaction and is recorded only
        once a durable bank-refund request exists (`PENDING_ACCOUNT` when the
        refund account is still missing); it never calls VNPay Refund. A
        repeated decision with the same `Idempotency-Key` replays the result; a
        decided review returns 409 `LATE_PAYMENT_REVIEW_ALREADY_DECIDED`.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupCode'}
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}, description: LatePaymentReview.reviewId}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LatePaymentDecisionRequest'}}}}
      responses:
        '200': {description: Decision recorded, content: {application/json: {schema: {$ref: '#/components/schemas/LatePaymentReview'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-Token}
  parameters:
    GroupCode: {name: groupCode, in: path, required: true, schema: {type: string}}
    TicketCode: {name: ticketCode, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    CreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
      description: >-
        16 to 128 characters, like every other command here (decided
        2026-11-14). The implemented controller still accepts 1 to 128 and is
        tightened in T107; the frontend already sends 16 to 128 (T102), so no
        client changes.
  responses:
    Problem:
      description: Safe typed error (RFC 7807)
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, CANCELLED, COMPLETED, NO_SHOW]
      description: "COMPLETED, NO_SHOW and post-confirmation CANCELLED are set only from 003.3 conclusions (D13)."
    PaymentStatus:
      type: string
      enum: [UNPAID, DEPOSIT_PAID, FULLY_PAID, REFUND_PENDING, REFUNDED]
      description: "REFUND_PENDING and REFUNDED occur only during a Mland-caused remedy (D14)."
    PaymentMode:
      type: string
      enum: [VNPAY, INTERNAL_FREE, INTERNAL_DEFERRED]
    CollectionKind:
      type: string
      enum: [FREE, FULL, DEPOSIT, DEFERRED_BELOW_VNPAY_MINIMUM]
    Vnd:
      type: integer
      format: int64
      minimum: 0
      description: Whole VND.
    CartLine:
      type: object
      required: [packageId, sessionReferences, participantCount]
      properties:
        packageId: {type: integer, format: int64, minimum: 1}
        sessionReferences: {type: array, minItems: 1, maxItems: 4, items: {type: string, format: uuid, description: Canonical lower-case UUID.}}
        participantCount: {type: integer, minimum: 1, maximum: 20}
    BenefitSelection:
      type: object
      required: [choice]
      properties:
        choice: {type: string, enum: [NONE, VOUCHER]}
        voucherCode: {type: string, maxLength: 128, description: Sent only when choice is VOUCHER.}
        requestedPoints: {type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19}
    CartQuoteRequest:
      type: object
      required: [lines]
      properties:
        lines: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/CartLine'}}
        benefitSelection:
          allOf: [{$ref: '#/components/schemas/BenefitSelection'}]
          description: >-
            Optional. Absent or NONE, the cart still gets the largest automatic
            workshop discount (006 FR-044), Guest included; VOUCHER replaces it
            (006 FR-015). A Guest cart asking for a voucher or points is refused
            with CART_BENEFITS_NEED_A_MEMBER.
    CartQuote:
      type: object
      required: [quoteRef, expiresAt, lines, grossVnd, voucherDiscountVnd, pointsUsed, pointDiscountVnd, finalTotalVnd, maxPoints, minRedeemPoints, pointValueVnd, groupCollectionVnd, remainingAtCheckoutVnd, paymentMode, reasons, appliedDiscount]
      properties:
        quoteRef: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time, description: 30 minutes after the quote was created.}
        lines: {type: array, items: {$ref: '#/components/schemas/QuotedLine'}}
        grossVnd: {$ref: '#/components/schemas/Vnd'}
        voucherDiscountVnd:
          allOf: [{$ref: '#/components/schemas/Vnd'}]
          description: >-
            FR-033. The group's programme discount, whichever programme gave it:
            the automatic workshop discount or the Member's voucher. Which one
            is `appliedDiscount`; the field keeps its name for compatibility.
        appliedDiscount:
          type: string
          enum: [NONE, AUTO, VOUCHER]
          description: >-
            T105, 006 FR-015. The one programme discount of this cart. AUTO is
            the largest automatic workshop discount (006 FR-044), applied to
            every cart that names no voucher, Guest included. VOUCHER means the
            Member's voucher replaced it. NONE means no programme discounts the
            cart.
        pointsUsed: {type: integer, format: int64, minimum: 0}
        pointDiscountVnd: {$ref: '#/components/schemas/Vnd'}
        finalTotalVnd: {$ref: '#/components/schemas/Vnd'}
        maxPoints:
          type: integer
          format: int64
          minimum: 0
          description: >-
            FR-034. The most points the Member may apply to this cart under the
            FE-06 point policy. Reported for every Member cart, including one
            that selected nothing, so the screen can show the cap before the
            Member types an amount; 0 for a Guest cart. A requested amount above
            it is refused, never trimmed, and the reason appears in `reasons`.
        minRedeemPoints: {type: integer, format: int64, minimum: 0, description: "FR-034. The smallest redeemable amount of the recorded point policy; 0 for a Guest cart."}
        pointValueVnd: {$ref: '#/components/schemas/Vnd'}
        groupCollectionVnd: {$ref: '#/components/schemas/Vnd'}
        remainingAtCheckoutVnd: {$ref: '#/components/schemas/Vnd'}
        paymentMode: {$ref: '#/components/schemas/PaymentMode'}
        reasons:
          type: array
          items: {type: string}
          description: >-
            Every voucher or point reason 006 reported for this cart, so a
            refused voucher or point amount says why. Empty when nothing was
            refused and for a Guest cart. "No automatic discount applies" is
            not repeated here; `appliedDiscount` says it.
    QuotedLine:
      type: object
      required: [lineIndex, packageId, packageName, pricePerParticipantVnd, participantCount, sessions, tickets]
      properties:
        lineIndex: {type: integer, minimum: 0, description: Zero-based position of the line in the cart.}
        packageId: {type: integer, format: int64}
        packageName: {type: string}
        pricePerParticipantVnd: {$ref: '#/components/schemas/Vnd'}
        participantCount: {type: integer, minimum: 1}
        sessions: {type: array, items: {$ref: '#/components/schemas/QuotedSession'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/QuotedTicket'}}
    QuotedSession:
      type: object
      required: [sessionReference, ordinal, scheduledStart, scheduledEnd]
      properties:
        sessionReference: {type: string, format: uuid}
        locationReference: {type: integer, format: int64, nullable: true}
        ordinal: {type: integer, minimum: 1}
        scheduledStart: {type: string, format: date-time}
        scheduledEnd: {type: string, format: date-time}
    QuotedTicket:
      type: object
      required: [participantOrdinal, packagePriceVnd, voucherDiscountVnd, pointsUsed, pointDiscountVnd, finalPriceVnd, collectedAtBookingVnd, collectionKind, remainingVnd]
      properties:
        participantOrdinal: {type: integer, minimum: 1, description: One-based position of the person inside the line.}
        packagePriceVnd: {$ref: '#/components/schemas/Vnd'}
        voucherDiscountVnd: {$ref: '#/components/schemas/Vnd'}
        pointsUsed: {type: integer, format: int64, minimum: 0}
        pointDiscountVnd: {$ref: '#/components/schemas/Vnd'}
        finalPriceVnd: {$ref: '#/components/schemas/Vnd'}
        collectedAtBookingVnd: {$ref: '#/components/schemas/Vnd'}
        collectionKind: {$ref: '#/components/schemas/CollectionKind'}
        remainingVnd: {$ref: '#/components/schemas/Vnd'}
    CreateGroupRequest:
      type: object
      required: [quoteRef, contactEmail, contactPhone]
      properties:
        quoteRef: {type: string, maxLength: 36}
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
      description: The contact is shared by the whole group; companion details are not required (FR-031).
    GroupLine:
      type: object
      required: [lineIndex, packageId, packageName, pricePerParticipantVnd, ticketCount, sessionReferences]
      properties:
        lineIndex: {type: integer, minimum: 0}
        packageId: {type: integer, format: int64}
        packageName: {type: string}
        pricePerParticipantVnd: {$ref: '#/components/schemas/Vnd'}
        ticketCount: {type: integer, minimum: 1}
        sessionReferences: {type: array, items: {type: string, format: uuid}}
    BookingGroup:
      type: object
      required: [groupCode, groupStatus, paymentMode, groupCollectionVnd, lines, tickets]
      description: The group as group creation returns it (FR-030..FR-032, FR-036).
      properties:
        groupCode: {type: string}
        groupStatus: {$ref: '#/components/schemas/BookingStatus'}
        paymentMode: {$ref: '#/components/schemas/PaymentMode'}
        groupCollectionVnd: {$ref: '#/components/schemas/Vnd'}
        holdExpiresAt: {type: string, format: date-time, nullable: true, description: Internal hold end (12 minutes); never shown to customers.}
        paymentDeadlineAt: {type: string, format: date-time, nullable: true, description: Customer-visible deadline (10 minutes), two minutes before the hold ends.}
        lines: {type: array, items: {$ref: '#/components/schemas/GroupLine'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/GroupTicket'}}
    GroupTicket:
      type: object
      required: [ticketCode, lineIndex, participantOrdinal, packageId, packageName, ticketStatus, financialStatus, finalPriceVnd, collectedAtBookingVnd, collectionKind, remainingVnd]
      properties:
        ticketCode: {type: string}
        lineIndex: {type: integer, minimum: 0}
        participantOrdinal: {type: integer, minimum: 1}
        packageId: {type: integer, format: int64}
        packageName: {type: string}
        ticketStatus: {$ref: '#/components/schemas/BookingStatus'}
        financialStatus: {$ref: '#/components/schemas/PaymentStatus'}
        finalPriceVnd: {$ref: '#/components/schemas/Vnd'}
        collectedAtBookingVnd: {$ref: '#/components/schemas/Vnd'}
        collectionKind: {$ref: '#/components/schemas/CollectionKind'}
        remainingVnd: {$ref: '#/components/schemas/Vnd'}
    BookingGroupView:
      type: object
      required: [groupCode, groupStatus, paymentMode, groupCollectionVnd, lines, tickets]
      description: >-
        The buyer's read-only view of a group (FR-042, FR-049): every ticket
        with its own status, price breakdown, schedule, masked recipient and
        attendance.
      properties:
        groupCode: {type: string}
        groupStatus: {$ref: '#/components/schemas/BookingStatus'}
        paymentMode: {$ref: '#/components/schemas/PaymentMode'}
        groupCollectionVnd: {$ref: '#/components/schemas/Vnd'}
        holdExpiresAt: {type: string, format: date-time, nullable: true}
        paymentDeadlineAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time, nullable: true, description: List ordering, newest first.}
        confirmedAt: {type: string, format: date-time, nullable: true}
        lines: {type: array, items: {$ref: '#/components/schemas/GroupLine'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/TicketView'}}
    TicketView:
      type: object
      required: [ticketCode, lineIndex, participantOrdinal, packageId, packageName, ticketStatus, financialStatus, finalPriceVnd, collectedAtBookingVnd, collectionKind, remainingVnd, sessions]
      properties:
        ticketCode: {type: string}
        lineIndex: {type: integer, minimum: 0}
        participantOrdinal: {type: integer, minimum: 1}
        packageId: {type: integer, format: int64}
        packageName: {type: string}
        ticketStatus: {$ref: '#/components/schemas/BookingStatus'}
        financialStatus: {$ref: '#/components/schemas/PaymentStatus'}
        finalPriceVnd: {$ref: '#/components/schemas/Vnd'}
        collectedAtBookingVnd: {$ref: '#/components/schemas/Vnd'}
        collectionKind: {$ref: '#/components/schemas/CollectionKind'}
        remainingVnd: {$ref: '#/components/schemas/Vnd'}
        recipientEmailMasked: {type: string, nullable: true}
        onlineRecipientChangesRemaining: {type: integer, minimum: 0, maximum: 3, nullable: true}
        attendanceStatus:
          type: string
          nullable: true
          enum: [ATTENDED, NO_SHOW_PENDING, NO_SHOW]
          description: Display only. Null before attendance is finalized; NO_SHOW_PENDING while a recorded no-show is still inside the 24-hour correction window. ticketStatus still changes only on the final 003.3 conclusion.
        qrReference: {type: string, nullable: true, description: "FR-049. Opaque scan reference issued by Workshop Operations; returned in the buyer projection (Member owner, Guest lookup, Magic Link) only while the ticket is active."}
        ticketReference: {type: string, nullable: true, description: "FR-049 (FR-021c carried over). Opaque; only in the owning Member's projection, for Feature 011 review matching; never displayed."}
        sessions: {type: array, items: {$ref: '#/components/schemas/TicketSession'}}
    TicketSession:
      type: object
      required: [sessionReference, ordinal, scheduledStart, scheduledEnd]
      properties:
        sessionReference: {type: string, format: uuid}
        locationId: {type: integer, format: int64, nullable: true}
        ordinal: {type: integer, minimum: 1}
        scheduledStart: {type: string, format: date-time}
        scheduledEnd: {type: string, format: date-time}
    GroupPaymentAttempt:
      type: object
      required: [attemptReference, merchantReference, amountVnd, currency, paymentUrl, expiresAt, status]
      properties:
        attemptReference: {type: string}
        merchantReference: {type: string}
        amountVnd: {$ref: '#/components/schemas/Vnd'}
        currency: {type: string}
        paymentUrl: {type: string}
        expiresAt: {type: string, format: date-time, description: The group's payment deadline, two minutes before the hold ends (FR-032).}
        status: {type: string}
    GroupLookupRequest:
      type: object
      required: [groupCode]
      description: Exactly one of contactEmail or contactPhone.
      properties:
        groupCode: {type: string, maxLength: 32}
        contactEmail: {type: string, format: email, maxLength: 254, writeOnly: true}
        contactPhone: {type: string, minLength: 7, maxLength: 32, writeOnly: true}
    MagicLinkExchangeRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, maxLength: 128, writeOnly: true, description: Opaque value from the Magic Link URL fragment; never persist or log it.}
    ContactProof:
      type: object
      description: Guest sends exactly one stored contact value; a Member or authorized internal caller sends none.
      properties:
        contactEmail: {type: string, format: email, maxLength: 254, writeOnly: true}
        contactPhone: {type: string, minLength: 7, maxLength: 32, writeOnly: true}
    GroupPendingHoldReleaseRequest:
      type: object
      required: [reason]
      properties:
        contactEmail: {type: string, format: email, maxLength: 254, writeOnly: true}
        contactPhone: {type: string, minLength: 7, maxLength: 32, writeOnly: true}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Audit reason; contact proof is never copied to audit.}
    MagicLinkIncidentRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [REVOKE, ROTATE]}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Must not contain URLs, link fragments or credentials.}
    GroupActionOutcome:
      type: object
      required: [groupCode, action, outcome, correlationId]
      properties:
        groupCode: {type: string}
        action: {type: string}
        outcome: {type: string}
        correlationId: {type: string}
    BuyerVerificationRequest:
      type: object
      description: Exactly one of contactEmail or contactPhone.
      properties:
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
    BuyerVerificationChallenge:
      type: object
      required: [verificationId, expiresAt]
      properties:
        verificationId: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
    BuyerVerificationConfirmation:
      type: object
      required: [otp]
      properties:
        otp: {type: string, pattern: '^[0-9]{6}$'}
    BuyerVerificationResult:
      type: object
      required: [buyerVerificationReference, expiresAt]
      properties:
        buyerVerificationReference: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
    RecipientRequest:
      type: object
      required: [recipientEmail]
      properties:
        recipientEmail: {type: string, format: email, maxLength: 254}
        buyerVerificationReference: {type: string, format: uuid, description: Required for a Guest buyer and for Staff/Manager; ignored for the owning Member.}
        reason: {type: string, minLength: 1, maxLength: 500, description: Required for Staff/Manager.}
    TicketRecipient:
      type: object
      required: [ticketCode, status, collectionKind]
      description: The ticket after a recipient command; carries the masked recipient email only.
      properties:
        ticketCode: {type: string}
        status: {$ref: '#/components/schemas/BookingStatus'}
        collectionKind: {$ref: '#/components/schemas/CollectionKind'}
        recipientEmailMasked: {type: string, nullable: true}
        attendanceStatus: {type: string, nullable: true}
        sessionReferences: {type: array, items: {type: string, format: uuid}}
        onlineRecipientChangesRemaining: {type: integer, minimum: 0, maximum: 3, nullable: true}
    LatePaymentDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [CONFIRM, REFUND]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    LatePaymentReview:
      type: object
      required: [reviewId, groupCode, outcome, amount, arrivedAt, failedConditions, confirmAllowed]
      properties:
        reviewId: {type: string, format: uuid}
        groupCode: {type: string}
        outcome: {type: string, enum: [AUTO_RECONFIRMED, PENDING_MANAGER, MANAGER_CONFIRMED, REFUND_REQUESTED]}
        amount: {type: string, pattern: '^(0|[1-9][0-9]*)$', description: Whole VND as a string, as the implemented response returns it.}
        arrivedAt: {type: string, format: date-time}
        failedConditions:
          type: array
          items: {type: string, enum: [CAPACITY, START_TIME, AMOUNT, ARRIVAL_WINDOW, DUPLICATE_BOOKING]}
        confirmAllowed: {type: boolean, description: True when only ARRIVAL_WINDOW and/or DUPLICATE_BOOKING failed.}
        earliestSessionAt: {type: string, format: date-time, nullable: true}
        resultDueAt: {type: string, format: date-time, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        refundRequestReference: {type: string, nullable: true}
    Problem:
      type: object
      required: [status, code, correlationId]
      description: RFC 7807 problem detail as the Workshop Booking exception handler returns it.
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        correlationId: {type: string}
    CartHoldRejection:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            failingLines:
              type: array
              items: {type: integer, minimum: 0}
              description: Zero-based cart positions that could not be held (FR-031); present only on a capacity refusal.
