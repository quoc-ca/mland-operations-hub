openapi: 3.0.3
info:
  title: Workshop Booking API
  version: 1.0.0-draft
  description: >-
    Draft direct-Mland booking contract; requires owner approval before
    implementation. Shared VNPay provider ingress is documented in
    ../../contracts/vnpay-payment-ingress.openapi.yaml.
paths:
  /api/v1/workshop-packages:
    get:
      summary: Browse published customer-selectable packages
      responses: {'200': {description: Packages}}
  /api/v1/workshop-sessions:
    get:
      summary: Discover customer-selectable workshop sessions for one package and branch
      parameters:
        - {$ref: '#/components/parameters/PackageId'}
        - {$ref: '#/components/parameters/BranchId'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200': {description: Customer-safe sale-eligibility snapshots, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SessionAvailability'}}}}}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings:
    post:
      summary: Create one pending booking for one package
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBookingRequest'}}}}
      responses:
        '201': {description: Pending booking and holds, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/payment-attempts:
    post:
      summary: Start or retry the 50 percent deposit while the hold is active
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Payment initiation}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/booking-lookups:
    post:
      summary: Look up a Guest booking using booking code and one contact proof
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GuestLookupRequest'}}}}
      responses: {'200': {description: Authorized projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/booking-magic-links/exchanges:
    post:
      summary: Exchange a protected Magic Link for a read-only booking projection
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkExchangeRequest'}}}}
      responses: {'200': {description: Authorized projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/members/me/workshop-bookings/{bookingCode}:
    get:
      summary: Read an owned Member booking
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}]
      responses: {'200': {description: Authorized projection}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /api/v1/workshop-bookings/{bookingCode}/pending-hold-release:
    post:
      summary: Release an active pending hold
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'204': {description: Released}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/workshop-bookings/{bookingCode}/confirmation-deliveries:
    post:
      summary: Resend booking confirmation only to the stored booking contact
      description: Guest supplies exactly one stored contact proof; Member uses ownership; authorized in-branch Staff or Manager may act without customer proof.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmationDeliveryRequest'}}}}
      responses:
        '202': {description: Accepted delivery request, content: {application/json: {schema: {$ref: '#/components/schemas/BookingActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/magic-link-incidents:
    post:
      summary: Revoke or rotate a Magic Link
      description: Manager responsible for the booking branch only.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkIncidentRequest'}}}}
      responses:
        '200': {description: Safe incident outcome, content: {application/json: {schema: {$ref: '#/components/schemas/BookingActionOutcome'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/late-payment-follow-ups:
    post:
      summary: Record or escalate a late-payment follow-up
      description: Manager responsible for the booking branch only; this command never changes booking, capacity, ticket, or payment-link state.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LatePaymentFollowUpRequest'}}}}
      responses:
        '200': {description: Safe follow-up outcome, content: {application/json: {schema: {$ref: '#/components/schemas/BookingActionOutcome'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-Token}
  parameters:
    BookingCode: {name: bookingCode, in: path, required: true, schema: {type: string}}
    PackageId: {name: packageId, in: query, required: true, schema: {type: integer, format: int64}}
    BranchId: {name: branchId, in: query, required: true, schema: {type: integer, format: int64}}
    From: {name: from, in: query, required: true, schema: {type: string, format: date-time}}
    To: {name: to, in: query, required: true, schema: {type: string, format: date-time}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  schemas:
    CreateBookingRequest:
      type: object
      required: [packageId, sessionIds, participantCount, contactEmail, contactPhone]
      properties:
        packageId: {type: integer, format: int64}
        sessionIds: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: integer, format: int64}}
        participantCount: {type: integer, minimum: 1}
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
    GuestLookupRequest:
      type: object
      required: [bookingCode]
      properties:
        bookingCode: {type: string}
        contactEmail: {type: string, format: email}
        contactPhone: {type: string}
      description: Exactly one of contactEmail or contactPhone is required.
    MagicLinkExchangeRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, writeOnly: true, description: Opaque bearer value extracted by the React client from the Magic Link URL fragment; never persist or log it.}
    SessionAvailability:
      type: object
      required: [sessionId, branchId, scheduledStart, scheduledEnd, saleState, customerSelectable, remainingCapacity]
      properties:
        sessionId: {type: integer, format: int64}
        branchId: {type: integer, format: int64}
        scheduledStart: {type: string, format: date-time}
        scheduledEnd: {type: string, format: date-time}
        saleState: {type: string}
        customerSelectable: {type: boolean}
        remainingCapacity: {type: integer, minimum: 0}
    ConfirmationDeliveryRequest:
      type: object
      properties:
        contactEmail: {type: string, format: email, writeOnly: true}
        contactPhone: {type: string, writeOnly: true}
      description: Guest submits exactly one stored contact value. Member and authorized internal callers submit no proof in the body.
    MagicLinkIncidentRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [REVOKE, ROTATE]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    LatePaymentFollowUpRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [RECORD, ESCALATE]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    BookingActionOutcome:
      type: object
      required: [bookingCode, action, outcome, correlationId]
      properties:
        bookingCode: {type: string}
        action: {type: string}
        outcome: {type: string}
        correlationId: {type: string}
    BookingSummary:
      type: object
      required: [bookingCode, bookingStatus, paymentStatus, participantCount, sessions]
      properties:
        bookingCode: {type: string}
        bookingStatus: {type: string, enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, CANCELLED]}
        paymentStatus: {type: string, enum: [UNPAID, DEPOSIT_PAID, FULLY_PAID]}
        participantCount: {type: integer}
        holdExpiresAt: {type: string, format: date-time, nullable: true}
        sessions: {type: array, items: {$ref: '#/components/schemas/BookedSession'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/BookingTicket'}}
    BookedSession:
      type: object
      required: [sessionId, branchId, ordinal]
      properties:
        sessionId: {type: integer, format: int64}
        branchId: {type: integer, format: int64}
        ordinal: {type: integer, minimum: 1}
    BookingTicket:
      type: object
      required: [ticketCode, qrToken, sessionIds]
      properties:
        ticketCode: {type: string}
        qrToken: {type: string, description: Signed opaque credential without PII.}
        sessionIds: {type: array, items: {type: integer, format: int64}}
    Problem:
      type: object
      required: [code, correlationId]
      properties:
        code: {type: string}
        correlationId: {type: string}
  responses:
    Problem: {description: Safe typed error, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
