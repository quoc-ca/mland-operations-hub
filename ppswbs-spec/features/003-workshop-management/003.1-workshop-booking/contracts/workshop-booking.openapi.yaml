openapi: 3.0.3
info:
  title: Workshop Booking API
  version: 1.0.0-draft
  description: >-
    Draft direct-Mland booking contract; requires owner approval before
    implementation. Shared VNPay provider ingress is documented in
    ../../contracts/vnpay-payment-ingress.openapi.yaml.
paths:
  /api/v1/workshop-booking-quotes:
    post:
      summary: Preview and persist a Member's workshop quote
      description: Requires an active Member bearer. Quote amounts and terms are computed server-side by Loyalty; the server returns a source-owned quoteRef that the Member confirms when creating the booking.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkshopBookingQuoteRequest'}}}}
      responses:
        '201': {description: Persisted quote preview, content: {application/json: {schema: {$ref: '#/components/schemas/WorkshopBookingQuote'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings:
    post:
      summary: Confirm a Member quote or create one Guest booking for one package
      description: A Member confirms with quoteRef only; package, session and price facts are loaded from the stored quote and authoritative 003.2 data. A Guest may use the no-benefit package/session request. A Member may create a no-benefit quote by selecting NONE.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateBookingRequest'}}}}
      responses:
        '201': {description: Pending booking and holds, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {description: Quote expired (`QUOTE_EXPIRED`) or selection/terms conflict, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  /api/v1/workshop-bookings/{bookingCode}/payment-attempts:
    post:
      summary: Start or retry the 50 percent deposit while the hold is active
      description: The payment attempt and VNPay link expire at the booking's holdExpiresAt, which is at most 10 minutes after hold creation. Retrying never extends the hold deadline.
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses: {'200': {description: Payment initiation}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/booking-lookups:
    post:
      summary: Look up a Guest booking using booking code and one contact proof
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GuestLookupRequest'}}}}
      responses: {'200': {description: Authorized projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/booking-magic-links/exchanges:
    post:
      summary: Exchange a protected Magic Link for a read-only booking projection
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkExchangeRequest'}}}}
      responses: {'200': {description: Authorized projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/members/me/workshop-bookings:
    get:
      summary: List the authenticated Member's own workshop bookings
      description: >-
        FR-021a (backfilled 2026-11-12 from b662e42, 6987155). Returns at most 30
        of the Member's own bookings, newest createdAt first. An EXPIRED booking is
        included only while holdExpiresAt is within the last 24 hours; older
        expired holds are left out. A booking that cannot be projected is skipped
        fail-soft instead of failing the whole list. Each item is the Member
        projection, including ticketReferences.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Member's bookings, content: {application/json: {schema: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BookingSummary'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/members/me/workshop-bookings/{bookingCode}:
    get:
      summary: Read an owned Member booking
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}]
      responses: {'200': {description: Authorized Member projection, including ticketReferences, content: {application/json: {schema: {$ref: '#/components/schemas/BookingSummary'}}}}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}}
  /api/v1/workshop-bookings/{bookingCode}/pending-hold-release:
    post:
      summary: Release an active pending hold from Guest or Member lookup
      description: Guest supplies exactly one stored contact proof. An authenticated Member supplies no contact proof; Booking verifies that the Member owns this booking. Both callers must provide an audit-safe reason. When no payment attempt and no late-payment evidence exists for the booking, the release also gives back the points and voucher held by the Member quote, as an unpaid expiry does (FR-017j). A body-less 204 replay is stored with a null idempotency payload.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PendingHoldReleaseRequest'}}}}
      responses:
        '204': {description: Released}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/confirmation-deliveries:
    post:
      summary: Resend booking confirmation only to the stored booking contact
      description: Guest supplies exactly one stored contact proof; Member uses ownership; Staff may act only within active location scope, while any active Manager may act globally without customer proof. Rolling limits are 3 accepted self-service resends per booking per hour and 5 accepted internal resends per booking per 15 minutes; a rejected request queues no delivery.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmationDeliveryRequest'}}}}
      responses:
        '202': {description: Accepted delivery request, content: {application/json: {schema: {$ref: '#/components/schemas/BookingActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/magic-link-incidents:
    post:
      summary: Revoke or rotate a Magic Link
      description: Any active Manager globally.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkIncidentRequest'}}}}
      responses:
        '200': {description: Safe incident outcome, content: {application/json: {schema: {$ref: '#/components/schemas/BookingActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-bookings/{bookingCode}/late-payment-follow-ups:
    post:
      summary: Record or escalate a late-payment follow-up
      description: Any active Manager globally; this command never changes booking, capacity, ticket, or payment-link state.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/BookingCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LatePaymentFollowUpRequest'}}}}
      responses:
        '200': {description: Safe follow-up outcome, content: {application/json: {schema: {$ref: '#/components/schemas/BookingActionOutcome'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-Token}
  parameters:
    BookingCode: {name: bookingCode, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  schemas:
    CreateBookingRequest:
      oneOf:
        - {$ref: '#/components/schemas/MemberQuoteBookingRequest'}
        - {$ref: '#/components/schemas/GuestBookingRequest'}
    MemberQuoteBookingRequest:
      type: object
      required: [quoteRef, contactEmail, contactPhone]
      properties:
        quoteRef: {type: string, format: uuid}
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
    GuestBookingRequest:
      type: object
      required: [packageId, sessionReferences, participantCount, contactEmail, contactPhone]
      properties:
        packageId: {type: integer, format: int64}
        sessionReferences: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        participantCount: {type: integer, minimum: 1}
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
    WorkshopBookingQuoteRequest:
      type: object
      required: [packageId, sessionReferences, participantCount, benefitSelection]
      properties:
        packageId: {type: integer, format: int64, minimum: 1}
        sessionReferences: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, format: uuid}}
        participantCount: {type: integer, minimum: 1}
        benefitSelection: {$ref: '#/components/schemas/BenefitSelection'}
    BenefitSelection:
      type: object
      required: [choice, requestedPoints]
      properties:
        choice: {type: string, enum: [NONE, VOUCHER]}
        voucherCode: {type: string, maxLength: 128, description: Sent only when choice is VOUCHER; omitted for NONE.}
        requestedPoints: {type: string, pattern: '^(0|[1-9][0-9]*)$', maxLength: 19}
    WorkshopBookingQuote:
      type: object
      required: [quoteRef, expiresAt, grossAmount, programDiscount, pointsUsed, maxPoints, pointDiscount, postPromotionAmount, depositAmount, remainingAmount, earnBase, termsDigest, reasons]
      properties:
        quoteRef: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time, description: Exactly 30 minutes after quote preview creation.}
        grossAmount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        programDiscount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        pointsUsed: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        maxPoints: {type: string, pattern: '^(0|[1-9][0-9]*)$', description: Maximum loyalty points the Member may apply to this workshop quote.}
        pointDiscount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        postPromotionAmount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        depositAmount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        remainingAmount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        earnBase: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        termsDigest: {type: string, minLength: 1, maxLength: 128}
        reasons: {type: array, items: {type: string}}
        reasonDetails:
          type: array
          description: FR-006b (backfilled 2026-11-12 from 78d79a3). One entry per reason, with a stable code and a Vietnamese customer message; message falls back to the original reason text when no translation exists.
          items: {$ref: '#/components/schemas/QuoteReasonDetail'}
    QuoteReasonDetail:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    GuestLookupRequest:
      type: object
      required: [bookingCode]
      properties:
        bookingCode: {type: string}
        contactEmail: {type: string, format: email}
        contactPhone: {type: string}
      description: Exactly one of contactEmail or contactPhone is required.
    MagicLinkExchangeRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, writeOnly: true, description: Opaque bearer value extracted by the React client from the Magic Link URL fragment; never persist or log it.}
    ConfirmationDeliveryRequest:
      type: object
      properties:
        contactEmail: {type: string, format: email, writeOnly: true}
        contactPhone: {type: string, writeOnly: true}
      description: Guest submits exactly one stored contact value. Member and authorized internal callers submit no proof in the body.
    PendingHoldReleaseRequest:
      type: object
      required: [reason]
      properties:
        contactEmail: {type: string, format: email, writeOnly: true}
        contactPhone: {type: string, writeOnly: true}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Required audit reason. Contact proofs are not copied to audit.}
      description: Guest must provide exactly one stored contact proof and no bearer token. An authenticated Member must omit both contact proofs; the server verifies ownership from the bearer identity. Both require a reason.
    MagicLinkIncidentRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [REVOKE, ROTATE]}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Required business reason; must not contain URLs, link fragments, or credentials.}
    LatePaymentFollowUpRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [RECORD, ESCALATE]}
        reason: {type: string, minLength: 1, maxLength: 1000}
    BookingActionOutcome:
      type: object
      required: [bookingCode, action, outcome, correlationId]
      properties:
        bookingCode: {type: string}
        action: {type: string}
        outcome: {type: string}
        correlationId: {type: string}
    BookingSummary:
      type: object
      required: [bookingCode, bookingStatus, paymentStatus, packageId, packageName, participantCount, sessions]
      properties:
        bookingCode: {type: string}
        bookingStatus: {type: string, enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, CANCELLED, COMPLETED, NO_SHOW], description: "COMPLETED, NO_SHOW and post-confirmation CANCELLED are set only from 003.3 conclusions (D13)."}
        paymentStatus: {type: string, enum: [UNPAID, DEPOSIT_PAID, FULLY_PAID, REFUND_PENDING, REFUNDED], description: "REFUND_PENDING and REFUNDED occur only during a Mland-caused remedy (D14)."}
        packageId: {type: integer, format: int64}
        packageName: {type: string}
        participantCount: {type: integer}
        holdExpiresAt: {type: string, format: date-time, nullable: true}
        sessions: {type: array, items: {$ref: '#/components/schemas/BookedSession'}}
        tickets: {type: array, items: {$ref: '#/components/schemas/BookingTicket'}}
        attendanceStatus:
          type: string
          nullable: true
          enum: [ATTENDED, NO_SHOW_PENDING, NO_SHOW]
          description: FR-021b (backfilled 2026-11-12). Display only. Null before attendance is finalized; NO_SHOW_PENDING while a recorded no-show is still inside the 24-hour correction window; NO_SHOW when final. bookingStatus still changes only on the final 003.3 conclusion.
        ticketReferences:
          type: array
          nullable: true
          items: {type: string}
          description: FR-021c (backfilled 2026-11-12). Opaque ticket references, returned only in the booking's own Member projection (null for Guest lookup and Magic Link). Used to match a Feature-011 review source (one ticket) to this booking; never displayed.
    BookedSession:
      type: object
      required: [sessionReference, locationId, ordinal, scheduledStart, scheduledEnd]
      properties:
        sessionReference: {type: string, format: uuid}
        locationId: {type: integer, format: int64}
        ordinal: {type: integer, minimum: 1}
        scheduledStart: {type: string, format: date-time}
        scheduledEnd: {type: string, format: date-time}
    BookingTicket:
      type: object
      required: [ticketCode, qrReference, sessionReferences]
      properties:
        ticketCode: {type: string}
        qrReference: {type: string, writeOnly: false, description: Opaque bearer scan reference issued by Workshop Operations; it is used as the QR value and is accepted by Operations check-in. Return only in an authorized booking projection.}
        sessionReferences: {type: array, items: {type: string, format: uuid}}
    Problem:
      type: object
      required: [code, correlationId]
      properties:
        code: {type: string}
        correlationId: {type: string}
  responses:
    Problem: {description: Safe typed error, content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}
