openapi: 3.0.3
info:
  title: Workshop Booking Cart API (planned)
  version: 0.1.0-planned
  description: >-
    Planned contract for the multi-ticket cart and per-ticket booking of spec
    FR-030–FR-043 (decision 2026-11-12). Not implemented yet (tasks Phase 8).
    Kept separate from workshop-booking.openapi.yaml, whose routes must match
    the implemented controllers exactly; each route moves there when its
    controller is implemented. Money values are whole VND strings.
    Decision 2026-11-13 (spec FR-044–FR-051): the booking group is the only
    direct booking; the single-booking routes of workshop-booking.openapi.yaml
    are removed and replaced by the group routes here. Routes marked
    "approved 2026-11-13" were approved by the owner that day and are not implemented yet.
paths:
  /api/v1/workshop-cart-quotes:
    post:
      summary: Quote a cart of one or more package lines
      description: >-
        Guest or Member. Computes per-ticket voucher and points allocation
        (FR-033, FR-034), booking-time collection per ticket (FR-035) and the
        group payment mode (FR-036). Reserves no capacity or benefit. A Member
        quote is bound to the Member and expires 30 minutes after creation.
      security: [{}, {bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CartQuoteRequest'}}}}
      responses:
        '201': {description: Cart quote, content: {application/json: {schema: {$ref: '#/components/schemas/CartQuote'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups:
    post:
      summary: Confirm a cart quote and hold every line atomically
      description: >-
        Holds all lines all-or-nothing (FR-031). Returns PENDING_PAYMENT with
        holdExpiresAt (12 minutes) and paymentDeadline (10 minutes) when the
        group collection is at least 5,000 VND; returns CONFIRMED when the group
        is 0 VND or deferred below 5,000 VND (FR-036, FR-038). A capacity
        failure returns 409 with failingLines and holds nothing.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateGroupRequest'}}}}
      responses:
        '201': {description: Group created, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroup'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/payment-attempts:
    post:
      summary: Start or retry the single VNPay payment of the group
      description: >-
        Only for group collection ≥ 5,000 VND; the amount is rechecked before the
        attempt is created. vnp_ExpireDate = holdExpiresAt − 2 minutes; retry
        never extends the hold (FR-032).
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {description: Payment initiation}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}:
    get:
      summary: Read an owned group with its tickets (Member buyer view)
      description: >-
        Owning Member bearer only (FR-048, approved 2026-11-13). A Guest reads
        the group through POST /workshop-booking-group-lookups or the Magic-Link
        exchange, so contact proof never travels in a URL. A group the Member
        does not own answers 404, never 403.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}]
      responses:
        '200': {description: Group projection with ticketReference per ticket, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroup'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/members/me/workshop-booking-groups:
    get:
      summary: List the authenticated Member's own booking groups (approved 2026-11-13)
      description: >-
        Replaces GET /members/me/workshop-bookings (FR-046, FR-048). At most 30
        groups, newest createdAt first; an EXPIRED group only while
        holdExpiresAt is within the last 24 hours. A group that cannot be
        projected is skipped fail-soft.
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Member's groups, content: {application/json: {schema: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BookingGroup'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-group-lookups:
    post:
      summary: Guest lookup of a group by group code and one contact proof (approved 2026-11-13)
      description: >-
        Replaces POST /booking-lookups (FR-048). Exactly one of contactEmail or
        contactPhone. A wrong code or proof answers the same 404
        BOOKING_NOT_FOUND; rate limits as the single-booking lookup. The
        response omits ticketReference.
      security: [{}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupLookupRequest'}}}}
      responses:
        '200': {description: Group projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroup'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-group-magic-links/exchanges:
    post:
      summary: Exchange the group Magic Link for a read-only group projection (approved 2026-11-13)
      description: >-
        Replaces POST /booking-magic-links/exchanges (FR-048). The token comes
        from the URL fragment; it is never persisted or logged. Expired,
        revoked or unknown tokens answer the same 404. The response omits
        ticketReference.
      security: [{}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkExchangeRequest'}}}}
      responses:
        '200': {description: Group projection, content: {application/json: {schema: {$ref: '#/components/schemas/BookingGroup'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/pending-hold-release:
    post:
      summary: Release a PENDING_PAYMENT group's holds before payment (approved 2026-11-13)
      description: >-
        Guest with exactly one stored contact proof and no bearer, or the
        owning Member with no proof; both give a reason (FR-048). Releases
        every line's hold; with no payment attempt and no late evidence it also
        releases the held voucher/points (FR-017j). Refused with 409
        PAYMENT_ATTEMPT_EXISTS once a group payment attempt exists; 409
        INVALID_STATE when the group is not PENDING_PAYMENT. A replay with the
        same Idempotency-Key returns 204.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroupPendingHoldReleaseRequest'}}}}
      responses:
        '204': {description: Released}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/confirmation-deliveries:
    post:
      summary: Resend the buyer confirmation of a CONFIRMED group to the stored contact email (approved 2026-11-13)
      description: >-
        Guest supplies exactly one stored contact proof; the owning Member
        none; Staff within active location scope of a group session; any
        active Manager globally. Sends every ticket again to the stored
        contact only, never to a recipient. Rolling limits: 3 accepted
        self-service resends per group per hour, 5 accepted internal resends
        per group per 15 minutes; a rejected request queues nothing.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/ContactProof'}}}}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/GroupActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/magic-link-incidents:
    post:
      summary: Revoke or rotate the group Magic Link (approved 2026-11-13)
      description: >-
        Any active Manager globally. ROTATE revokes the active link and sends a
        new one to the stored contact email; REVOKE only revokes.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MagicLinkIncidentRequest'}}}}
      responses:
        '200': {description: Safe outcome, content: {application/json: {schema: {$ref: '#/components/schemas/GroupActionOutcome'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/buyer-verifications:
    post:
      summary: Send a buyer-verification OTP to the group's original contact email
      description: >-
        Guest buyer, or Staff at the shop on the buyer's behalf (FR-041,
        decision 2026-11-13). The caller proves the booking with exactly one of
        the stored contact email or phone (same proof as guest lookup); the OTP
        is always sent to the original contact email, never to a ticket
        recipient. 6 digits, valid 10 minutes, at most 5 wrong attempts; only a
        hash is stored. A new request supersedes the active challenge of the
        group; requests are at least 60 seconds apart and at most 5 per hour
        per group. The response never reveals whether the contact matched; a
        mismatch sends nothing.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GroupCode'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationRequest'}}}}
      responses:
        '202': {description: Challenge accepted, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationChallenge'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/buyer-verifications/{verificationId}/confirmations:
    post:
      summary: Confirm the OTP and receive a single-use buyerVerificationReference
      description: >-
        On success returns a buyerVerificationReference scoped to the group,
        valid 15 minutes and consumed by one recipient change. Errors:
        400 BUYER_VERIFICATION_FAILED (wrong code, attempts remain),
        409 BUYER_VERIFICATION_LOCKED (5 wrong attempts),
        409 BUYER_VERIFICATION_EXPIRED (expired or superseded). An unknown
        verificationId is answered like a wrong code.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupCode'}
        - {name: verificationId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationConfirmation'}}}}
      responses:
        '200': {description: Buyer verified, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerVerificationResult'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-tickets/{ticketCode}/recipient:
    put:
      summary: Send a ticket to a recipient email, or change its recipient
      description: >-
        Buyer only, or Staff after verifying the buyer (FR-041, decision
        2026-11-13). Proof: a Member buyer sends a Firebase bearer and must own
        the group; a Guest buyer sends buyerVerificationReference; Staff or
        Manager sends a bearer with location scope plus buyerVerificationReference
        and reason. A recipient has no management right. The first send keeps
        the current QR and is not counted. Changing to a different email
        revokes the old QR at once, issues a new opaque QR for the same
        entitlements (003.2 FR-033), emails the new recipient and tells the
        previous recipient the old QR is void; it counts as one online change
        (at most 3 per ticket). Staff changes are not counted. The same email
        resends with the same QR. Errors: 401 BUYER_VERIFICATION_REQUIRED,
        403 RECIPIENT_CHANGE_FORBIDDEN, 404 TICKET_NOT_FOUND,
        409 TICKET_NOT_CONFIRMED, 409 TICKET_ALREADY_CHECKED_IN,
        409 RECIPIENT_CHANGE_LIMIT_REACHED (go to the shop),
        409 BUYER_VERIFICATION_EXPIRED, 409 IDEMPOTENCY_KEY_REUSED.
        A refused request changes nothing. Audit keeps masked old/new email,
        actor, channel, time and correlation only.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/TicketCode'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RecipientRequest'}}}}
      responses:
        '200': {description: Recipient updated, content: {application/json: {schema: {$ref: '#/components/schemas/Ticket'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/late-payment-reviews:
    get:
      summary: Manager queue of late-payment reviews
      description: >-
        Manager only (FR-040a, decision 2026-11-13). Ordered by earliest session
        start, then resultDueAt. Contains no buyer contact data.
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [AUTO_RECONFIRMED, PENDING_MANAGER, MANAGER_CONFIRMED, REFUND_REQUESTED], default: PENDING_MANAGER}}
      responses:
        '200': {description: Queue, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/LatePaymentReview'}}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/workshop-booking-groups/{groupCode}/late-payment-reviews/{reviewId}/decisions:
    post:
      summary: Manager decision on a late payment that was not re-confirmed automatically
      description: >-
        CONFIRM only when the failed conditions are limited to the 60-minute
        window or a duplicate booking, the buyer still wants to attend, and
        capacity, start time and recomputed amount still hold; REFUND opens a
        100% bank refund in 003.3 (FR-040). Only a PENDING_MANAGER review is
        decided. CONFIRM rechecks conditions 1–3 at decision time and holds
        capacity for the whole group atomically; it is refused with
        409 LATE_PAYMENT_CONFIRM_NOT_ALLOWED when any of conditions 1–3 failed
        on arrival or fails now. REFUND asks 003.3 through
        LatePaymentRefundPort in the same transaction and is recorded only
        once a durable bank-refund request exists (PENDING_ACCOUNT when the
        refund account is still missing); it never calls VNPay Refund. A
        repeated decision with the same Idempotency-Key replays the result;
        a decided review returns 409 LATE_PAYMENT_REVIEW_ALREADY_DECIDED.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/GroupCode'}
        - {name: reviewId, in: path, required: true, schema: {type: string, format: uuid}, description: LatePaymentReview.reviewId}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [CONFIRM, REFUND]}
                reason: {type: string, minLength: 1, maxLength: 1000}
      responses:
        '200': {description: Decision recorded, content: {application/json: {schema: {$ref: '#/components/schemas/LatePaymentReview'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Firebase-ID-Token}
  parameters:
    GroupCode: {name: groupCode, in: path, required: true, schema: {type: string}}
    TicketCode: {name: ticketCode, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  responses:
    Problem:
      description: Typed problem
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Vnd: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
    CartLine:
      type: object
      required: [packageId, sessionReferences, participantCount]
      properties:
        packageId: {type: integer, format: int64}
        sessionReferences: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, format: uuid}}
        participantCount: {type: integer, minimum: 1}
    CartQuoteRequest:
      type: object
      required: [lines]
      properties:
        lines: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CartLine'}}
        voucherCode: {type: string, maxLength: 128, description: Member only.}
        requestedPoints: {$ref: '#/components/schemas/Vnd'}
    TicketQuote:
      type: object
      required: [lineIndex, packagePrice, voucherDiscount, pointsUsed, pointDiscount, finalPrice, collectedAtBooking, collectionKind, remaining]
      properties:
        lineIndex: {type: integer}
        packagePrice: {$ref: '#/components/schemas/Vnd'}
        voucherDiscount: {$ref: '#/components/schemas/Vnd'}
        pointsUsed: {$ref: '#/components/schemas/Vnd'}
        pointDiscount: {$ref: '#/components/schemas/Vnd'}
        finalPrice: {$ref: '#/components/schemas/Vnd'}
        collectedAtBooking: {$ref: '#/components/schemas/Vnd'}
        collectionKind: {type: string, enum: [FREE, FULL, DEPOSIT, DEFERRED_BELOW_VNPAY_MINIMUM]}
        remaining: {$ref: '#/components/schemas/Vnd'}
    CartQuote:
      type: object
      required: [quoteRef, expiresAt, tickets, groupCollection, paymentMode, reasons]
      properties:
        quoteRef: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        tickets: {type: array, items: {$ref: '#/components/schemas/TicketQuote'}}
        groupCollection: {$ref: '#/components/schemas/Vnd'}
        paymentMode: {type: string, enum: [VNPAY, INTERNAL_FREE, INTERNAL_DEFERRED]}
        reasons: {type: array, items: {type: string}}
    CreateGroupRequest:
      type: object
      required: [quoteRef, contactEmail, contactPhone]
      properties:
        quoteRef: {type: string, format: uuid}
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
    Ticket:
      type: object
      required: [ticketCode, status, collectionKind]
      properties:
        ticketCode: {type: string}
        status: {type: string}
        collectionKind: {type: string, enum: [FREE, FULL, DEPOSIT, DEFERRED_BELOW_VNPAY_MINIMUM]}
        recipientEmailMasked: {type: string, nullable: true}
        onlineRecipientChangesRemaining: {type: integer, minimum: 0, maximum: 3, nullable: true}
        attendanceStatus: {type: string, nullable: true}
        sessionReferences: {type: array, items: {type: string, format: uuid}}
        packageName: {type: string, description: FR-049, approved 2026-11-13.}
        sessions: {type: array, items: {$ref: '#/components/schemas/TicketSession'}, description: FR-049, approved 2026-11-13.}
        finalPrice: {$ref: '#/components/schemas/Vnd'}
        collectedAtBooking: {$ref: '#/components/schemas/Vnd'}
        remaining: {$ref: '#/components/schemas/Vnd'}
        qrReference: {type: string, nullable: true, description: FR-049, approved 2026-11-13. Buyer projection only (Member owner, Guest lookup, Magic Link) while the ticket is active; null otherwise.}
        ticketReference: {type: string, nullable: true, description: FR-049 (FR-021c carried over), approved 2026-11-13. Opaque; only in the owning Member's projection, for Feature 011 review matching; never displayed.}
    TicketSession:
      type: object
      required: [sessionReference, locationId, ordinal, scheduledStart, scheduledEnd]
      properties:
        sessionReference: {type: string, format: uuid}
        locationId: {type: integer, format: int64}
        ordinal: {type: integer, minimum: 1}
        scheduledStart: {type: string, format: date-time}
        scheduledEnd: {type: string, format: date-time}
    BookingGroup:
      type: object
      required: [groupCode, status, paymentMode, groupCollection, tickets]
      properties:
        groupCode: {type: string}
        createdAt: {type: string, format: date-time, description: Proposed 2026-11-13; list ordering.}
        status: {type: string, enum: [PENDING_PAYMENT, CONFIRMED, EXPIRED, CANCELLED]}
        paymentMode: {type: string, enum: [VNPAY, INTERNAL_FREE, INTERNAL_DEFERRED]}
        groupCollection: {$ref: '#/components/schemas/Vnd'}
        holdExpiresAt: {type: string, format: date-time, nullable: true, description: Internal hold end (12 minutes); not shown to customers.}
        paymentDeadline: {type: string, format: date-time, nullable: true, description: Customer-visible deadline (10 minutes).}
        tickets: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
        failingLines: {type: array, items: {type: integer}, description: Present on a 409 capacity failure.}
    RecipientRequest:
      type: object
      required: [recipientEmail]
      properties:
        recipientEmail: {type: string, format: email, maxLength: 254}
        buyerVerificationReference: {type: string, format: uuid, description: Required for a Guest buyer and for Staff/Manager; ignored for the owning Member.}
        reason: {type: string, minLength: 1, maxLength: 500, description: Required for Staff/Manager.}
    BuyerVerificationRequest:
      type: object
      description: Exactly one of contactEmail or contactPhone.
      properties:
        contactEmail: {type: string, format: email, maxLength: 254}
        contactPhone: {type: string, minLength: 7, maxLength: 32}
    BuyerVerificationChallenge:
      type: object
      required: [verificationId, expiresAt]
      properties:
        verificationId: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
    BuyerVerificationConfirmation:
      type: object
      required: [otp]
      properties:
        otp: {type: string, pattern: '^[0-9]{6}$'}
    BuyerVerificationResult:
      type: object
      required: [buyerVerificationReference, expiresAt]
      properties:
        buyerVerificationReference: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
    ContactProof:
      type: object
      description: Guest sends exactly one stored contact value; a Member or authorized internal caller sends none.
      properties:
        contactEmail: {type: string, format: email, maxLength: 254, writeOnly: true}
        contactPhone: {type: string, minLength: 7, maxLength: 32, writeOnly: true}
    GroupLookupRequest:
      type: object
      required: [groupCode]
      description: Exactly one of contactEmail or contactPhone.
      properties:
        groupCode: {type: string}
        contactEmail: {type: string, format: email, maxLength: 254, writeOnly: true}
        contactPhone: {type: string, minLength: 7, maxLength: 32, writeOnly: true}
    MagicLinkExchangeRequest:
      type: object
      required: [token]
      properties:
        token: {type: string, writeOnly: true, description: Opaque value from the Magic Link URL fragment; never persist or log it.}
    GroupPendingHoldReleaseRequest:
      type: object
      required: [reason]
      properties:
        contactEmail: {type: string, format: email, maxLength: 254, writeOnly: true}
        contactPhone: {type: string, minLength: 7, maxLength: 32, writeOnly: true}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Audit reason; contact proof is never copied to audit.}
    MagicLinkIncidentRequest:
      type: object
      required: [action, reason]
      properties:
        action: {type: string, enum: [REVOKE, ROTATE]}
        reason: {type: string, minLength: 1, maxLength: 1000, description: Must not contain URLs, link fragments or credentials.}
    GroupActionOutcome:
      type: object
      required: [groupCode, action, outcome, correlationId]
      properties:
        groupCode: {type: string}
        action: {type: string}
        outcome: {type: string}
        correlationId: {type: string}
    LatePaymentReview:
      type: object
      required: [reviewId, groupCode, outcome, amount, arrivedAt, failedConditions]
      properties:
        reviewId: {type: string, format: uuid}
        groupCode: {type: string}
        outcome: {type: string, enum: [AUTO_RECONFIRMED, PENDING_MANAGER, MANAGER_CONFIRMED, REFUND_REQUESTED]}
        amount: {$ref: '#/components/schemas/Vnd'}
        arrivedAt: {type: string, format: date-time}
        failedConditions:
          type: array
          items: {type: string, enum: [CAPACITY, START_TIME, AMOUNT, ARRIVAL_WINDOW, DUPLICATE_BOOKING]}
        confirmAllowed: {type: boolean, description: True when only ARRIVAL_WINDOW and/or DUPLICATE_BOOKING failed.}
        earliestSessionAt: {type: string, format: date-time, nullable: true}
        resultDueAt: {type: string, format: date-time, nullable: true}
        decidedAt: {type: string, format: date-time, nullable: true}
        refundRequestReference: {type: string, nullable: true}
    Problem:
      type: object
      required: [code, correlationId]
      properties:
        code: {type: string}
        correlationId: {type: string}
        message: {type: string}
