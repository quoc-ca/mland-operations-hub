# Last updated by: Ngô Tiến Đạt
openapi: 3.0.3
info:
  title: Staff Consultation Chat API
  version: 0.2.0-change-request
  description: Contract including Guest opaque sessions and saved Feature-012 design context.
servers:
  - url: /api/v1
tags:
  - name: consultation-chat
paths:
  /consultations/context-options:
    get:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      summary: List Member-owned design contexts safe to attach
      responses:
        '200':
          description: Context options
          content: { application/json: { schema: { $ref: '#/components/schemas/ContextOptionList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /consultations:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/GuestConsultationSession' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateConversationRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
        - { name: unclaimed, in: query, description: 'STAFF and MANAGER only. When true, only conversations nobody has claimed, within the same scope and combinable with status. A MEMBER sending true gets 403 CHAT_ACCESS_DENIED. Used by the navigation badge (014 FR-005).', schema: { type: boolean, default: false } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { $ref: '#/components/parameters/GuestConsultationSession' }
      responses:
        '200': { description: Scoped inbox, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /consultations/{conversationReference}:
    parameters: [{ $ref: '#/components/parameters/ConversationReference' }]
    get:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conversation detail, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/IfMatchVersion' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Hidden from Member list; operational history retained }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /consultations/{conversationReference}/messages:
    parameters: [{ $ref: '#/components/parameters/ConversationReference' }]
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageRequest' } } }
      responses:
        '201': { description: Message created, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /consultations/{conversationReference}/claim:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ConversationReference' }
        - { $ref: '#/components/parameters/IfMatchVersion' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '200': { description: Claimed, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /consultations/{conversationReference}/release:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationReference' }, { $ref: '#/components/parameters/IfMatchVersion' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Released, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /consultations/{conversationReference}/assign:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationReference' }, { $ref: '#/components/parameters/IfMatchVersion' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignRequest' } } } }
      responses: { '200': { description: Assigned, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /consultations/{conversationReference}/read:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationReference' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReadStateRequest' } } } }
      responses: { '204': { description: Read state recorded }, '403': { $ref: '#/components/responses/Forbidden' } }
  /consultations/{conversationReference}/close:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationReference' }, { $ref: '#/components/parameters/IfMatchVersion' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /consultations/{conversationReference}/reopen:
    post:
      tags: [consultation-chat]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ConversationReference' }, { $ref: '#/components/parameters/IfMatchVersion' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Reopened, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: Firebase-ID-token }
  parameters:
    ConversationReference: { name: conversationReference, in: path, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    IfMatchVersion: { name: If-Match-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
    GuestConsultationSession: { name: X-Guest-Consultation-Session, in: header, required: false, schema: { type: string, minLength: 16, maxLength: 256 } }
  schemas:
    ContextOption:
      type: object
      required: [contextType, contextReference, displayCode, displayName, designVersion]
      properties:
        contextType: { type: string, enum: [WORKSHOP_RING_DESIGN, INDEPENDENT_DESIGN_REQUEST] }
        contextReference: { type: string }
        displayCode: { type: string }
        displayName: { type: string }
        preview: { type: object, additionalProperties: false, properties: { imageUrl: { type: string }, summary: { type: string } } }
        designVersion: { type: integer, minimum: 1 }
    ContextOptionList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ContextOption' } } } }
    CreateConversationRequest:
      type: object
      properties:
        contextType: { type: string, nullable: true, enum: [WORKSHOP_RING_DESIGN, INDEPENDENT_DESIGN_REQUEST] }
        contextReference: { type: string, nullable: true }
        contextVersion: { type: integer, nullable: true, minimum: 1 }
        initialMessage: { type: string, maxLength: 2000 }
    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
    AssignRequest: { type: object, required: [locationReference], properties: { locationReference: { type: string } } }
    ReadStateRequest: { type: object, required: [messageReference], properties: { messageReference: { type: string } } }
    Message:
      type: object
      required: [messageReference, senderRole, text, createdAt]
      properties:
        messageReference: { type: string }
        senderRole: { type: string, enum: [GUEST, MEMBER, STAFF, MANAGER] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [conversationReference, contextType, status, aggregateVersion, unreadCount]
      properties:
        conversationReference: { type: string }
        contextType: { type: string, enum: [WORKSHOP_RING_DESIGN, INDEPENDENT_DESIGN_REQUEST] }
        contextSnapshot: { $ref: '#/components/schemas/ContextOption' }
        assignedLocationReference: { type: string, nullable: true }
        claimantRole: { type: string, enum: [STAFF, MANAGER], nullable: true }
        status: { type: string, enum: [OPEN, CLOSED] }
        aggregateVersion: { type: integer, minimum: 1 }
        unreadCount: { type: integer, minimum: 0 }
    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [messages]
          properties: { messages: { type: array, items: { $ref: '#/components/schemas/Message' } } }
    ConversationList: { type: object, required: [items, hasMore], properties: { items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }, nextCursor: { type: string, nullable: true }, hasMore: { type: boolean } } }
    ErrorResponse:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string }, correlationId: { type: string }, retryAfterSeconds: { type: integer, nullable: true } }
  responses:
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Scope or permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Not found or not visible, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Version/idempotency/state conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    RateLimited:
      description: Message rate limit exceeded
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
