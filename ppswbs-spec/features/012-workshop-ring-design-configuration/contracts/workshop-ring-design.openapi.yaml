# Date created: 2026-11-08
# Date updated: 2026-11-26
# Author: Ngô Tiến Đạt
# Last updated by: Phan Sơn

openapi: 3.1.0
info:
  title: Feature-012 Workshop Ring Design Configuration API
  version: 0.6.0
  description: >-
    Proposed Member-only workshop ring design contract. Public catalogue reads
    support general discovery and optional compatible-package filtering;
    protected draft, evaluation and history commands require an active Member.
    Published-model scores include complete defaults and one effective policy.
    This revision has no Guest session or booking attachment command.
servers:
  - url: /api/v1
tags:
  - name: Workshop Ring Design
security:
  - bearerAuth: []
paths:
  /workshop-design-options:
    get:
      security: []
      tags: [Workshop Ring Design]
      summary: Get general design options or options filtered by compatible package
      operationId: getWorkshopDesignOptions
      parameters:
        - $ref: '#/components/parameters/PackageReference'
      responses:
        '200':
          description: Active general or package-filtered options, complete model defaults and rule metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignOptionsResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/BusinessInvalid' }
        '503': { $ref: '#/components/responses/RulesUnavailable' }
  /workshop-designs:
    get:
      tags: [Workshop Ring Design]
      summary: List the active Member's own designs and history
      operationId: listMyWorkshopDesigns
      responses:
        '200':
          description: Owner-safe design summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DesignResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
    post:
      tags: [Workshop Ring Design]
      summary: Create a Member configured-design draft
      operationId: createWorkshopDesign
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDesignRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessInvalid' }
  /workshop-designs/{designId}:
    get:
      tags: [Workshop Ring Design]
      summary: Get an owner-safe design projection
      operationId: getWorkshopDesign
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '200':
          description: Design projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workshop-designs/{designId}/versions:
    post:
      tags: [Workshop Ring Design]
      summary: Save and evaluate a new design version
      operationId: saveWorkshopDesignVersion
      parameters:
        - $ref: '#/components/parameters/DesignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDesignVersionRequest' }
      responses:
        '200':
          description: New saved version with separate advisory evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessInvalid' }
        '503': { $ref: '#/components/responses/RulesUnavailable' }
  /workshop-designs/{designId}/evaluate:
    post:
      tags: [Workshop Ring Design]
      summary: Explicitly evaluate the current design version
      operationId: evaluateWorkshopDesign
      parameters:
        - $ref: '#/components/parameters/DesignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDesignVersionRequest' }
      responses:
        '200':
          description: Server-derived evaluation and design version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessInvalid' }
        '503': { $ref: '#/components/responses/RulesUnavailable' }
  /workshop-designs/{designId}/recommendation:
    get:
      tags: [Workshop Ring Design]
      summary: Get an advisory workshop recommendation for a saved design
      operationId: getWorkshopDesignRecommendation
      parameters:
        - $ref: '#/components/parameters/DesignId'
      responses:
        '200':
          description: Owner-safe non-blocking workshop recommendation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkshopRecommendation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/RulesUnavailable' }
  /workshop-designs/{designId}/archive:
    post:
      tags: [Workshop Ring Design]
      summary: Archive an unsubmitted design
      operationId: archiveWorkshopDesign
      parameters:
        - $ref: '#/components/parameters/DesignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Archived owner-safe projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workshop-designs/{designId}/restore:
    post:
      tags: [Workshop Ring Design]
      summary: Restore an archived Member design without rewriting prior versions
      operationId: restoreWorkshopDesign
      parameters:
        - $ref: '#/components/parameters/DesignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Restored owner-safe projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    PackageReference:
      name: packageReference
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    DesignId:
      name: designId
      in: path
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
      description: Opaque public design reference, not a database identifier.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    DesignOptionsResponse:
      type: object
      description: >-
        Active options awaiting an Admin score remain visible but disabled.
        Active published models are always fully scored, valid and at or below
        the too-risky cutoff; publication commands reject a change that would
        disable one. With no package filter, all active published models appear;
        if persisted data violates the invariant, return a safe unavailable
        error rather than silently omitting a model or inventing a score.
      required: [rulesVersion, materials, shapes, sizes, components, attachments, engravingConfig, models]
      properties:
        packageReference: { type: string, nullable: true, description: Explicit compatible package filter; null for general discovery }
        rulesVersion: { type: string, description: Immutable effective difficulty-policy version used for returned option/model scores }
        materials:
          type: array
          description: Active workshop materials (Silver 925, Copper, Stainless Steel 316L; Gold deactivated).
          items:
            type: object
            required: [reference, name, selectable]
            properties:
              reference: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              purity: { type: string, nullable: true }
              unitPrice: { type: string, nullable: true }
              currency: { type: string, nullable: true }
              difficultyScore: { type: string, nullable: true }
              selectable: { type: boolean, description: False for an active option missing a score in the effective policy }
              unavailableReason: { type: string, enum: [DIFFICULTY_SCORE_PENDING], nullable: true }
              imageUrl: { type: string, nullable: true }
        shapes:
          type: array
          description: Workshop shapes and surface textures (classic, beveled, single twist, wave, ball-peen, flat band).
          items:
            type: object
            required: [reference, name, selectable]
            properties:
              reference: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              priceAdjustment: { type: string, nullable: true }
              currency: { type: string, nullable: true }
              difficultyScore: { type: string, nullable: true }
              selectable: { type: boolean }
              unavailableReason: { type: string, enum: [DIFFICULTY_SCORE_PENDING], nullable: true }
              imageUrl: { type: string, nullable: true }
        sizes:
          type: array
          description: Standard workshop sizes (6 through 29) with millimeter perimeter (perimeter = size + 40mm).
          items: { type: string }
        components:
          type: array
          items:
            type: object
            required: [reference, name, selectable]
            properties:
              reference: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              type: { type: string, nullable: true }
              color: { type: string, nullable: true }
              cutName: { type: string, nullable: true }
              unitPrice: { type: string, nullable: true }
              currency: { type: string, nullable: true }
              difficultyScore: { type: string, nullable: true }
              selectable: { type: boolean }
              unavailableReason: { type: string, enum: [DIFFICULTY_SCORE_PENDING], nullable: true }
              imageUrl: { type: string, nullable: true }
              maxQuantity: { type: integer, nullable: true }
              allowedPlacements:
                type: array
                items: { type: string }
        attachments:
          type: array
          items:
            type: object
            required: [reference, name, selectable]
            properties:
              reference: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              type: { type: string, nullable: true }
              unitPrice: { type: string, nullable: true }
              currency: { type: string, nullable: true }
              difficultyScore: { type: string, nullable: true }
              selectable: { type: boolean }
              unavailableReason: { type: string, enum: [DIFFICULTY_SCORE_PENDING], nullable: true }
              imageUrl: { type: string, nullable: true }
              maxQuantity: { type: integer, nullable: true }
              allowedPlacements:
                type: array
                items: { type: string }
        engravingConfig:
          type: object
          required: [supported]
          properties:
            supported: { type: boolean }
            maxCharacters: { type: integer, nullable: true }
            allowedPlacements:
              type: array
              items: { type: string }
            priceAdjustment: { type: string, nullable: true }
            customImagePrice: { type: string, nullable: true }
            imageFrameSizePx: { type: integer, nullable: true }
            maxTextItems: { type: integer, minimum: 0, default: 2 }
            maxSymbolItems: { type: integer, minimum: 0, default: 2 }
            maxCustomImageItems: { type: integer, minimum: 0, default: 2 }
            imagePreprocessing:
              type: object
              required: [contrastMin, contrastMax, contrastDefault, sharpnessMin, sharpnessMax, sharpnessDefault]
              properties:
                contrastMin: { type: integer, minimum: 0, maximum: 100, default: 0 }
                contrastMax: { type: integer, minimum: 0, maximum: 100, default: 100 }
                contrastDefault: { type: integer, minimum: 0, maximum: 100, default: 50 }
                sharpnessMin: { type: integer, minimum: 0, maximum: 100, default: 0 }
                sharpnessMax: { type: integer, minimum: 0, maximum: 100, default: 100 }
                sharpnessDefault: { type: integer, minimum: 0, maximum: 100, default: 50 }
            currency: { type: string, nullable: true }
        models:
          type: array
          items:
            type: object
            required: [modelReference, name, materialReference, shapeReference, defaultComponents, defaultAttachments, difficultyScore, difficultyLevel, selectable]
            properties:
              modelReference: { type: string }
              name: { type: string }
              description: { type: string, nullable: true }
              imageUrl: { type: string, nullable: true }
              materialReference: { type: string }
              shapeReference: { type: string }
              defaultComponents:
                type: array
                items: { $ref: '#/components/schemas/ComponentSelection' }
              defaultAttachments:
                type: array
                items: { $ref: '#/components/schemas/AttachmentSelection' }
              difficultyScore: { type: string, description: Server-evaluated complete model-default score under rulesVersion }
              difficultyLevel: { type: string, enum: [EASY, MEDIUM, HARD, VERY_HARD] }
              selectable: { type: boolean, const: true }
    CreateDesignRequest:
      type: object
      additionalProperties: false
      required: [startMode]
      properties:
        packageReference: { type: string, minLength: 1, maxLength: 128, nullable: true, description: Explicit compatible package context; omitted for general design }
        sourceModelReference: { type: string, minLength: 1, maxLength: 128, nullable: true }
        startMode: { type: string, enum: [PUBLISHED_MODEL, BLANK] }
    SaveDesignVersionRequest:
      type: object
      additionalProperties: false
      required: [materialReference, shapeReference, ringSize, components, attachments, engraving]
      properties:
        packageReference: { type: string, minLength: 1, maxLength: 128, nullable: true, description: Optional explicit compatible package context; omission retains the design's current context }
        materialReference: { type: string, minLength: 1, maxLength: 128 }
        shapeReference: { type: string, minLength: 1, maxLength: 128 }
        ringSize: { type: string, minLength: 1, maxLength: 64 }
        thicknessMm: { type: number, minimum: 0.5, maximum: 10.0, nullable: true }
        bandWidthMm: { type: number, minimum: 0.5, maximum: 20.0, nullable: true }
        dimensions:
          type: object
          properties:
            thicknessMm: { type: number, minimum: 1.0, maximum: 3.0 }
            bandWidthMm: { type: number, minimum: 1.5, maximum: 6.0 }
        components:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/ComponentSelection' }
        attachments:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/AttachmentSelection' }
        engraving: { $ref: '#/components/schemas/EngravingInput' }
    ComponentSelection:
      type: object
      additionalProperties: false
      required: [reference, quantity]
      properties:
        reference: { type: string, minLength: 1, maxLength: 128 }
        quantity:
          type: integer
          minimum: 1
          maximum: 64
          description: Selected stone quantity; each component maxQuantity and aggregate gemstone total limit of 10 are validated by the server.
        variant: { type: string, maxLength: 64, nullable: true }
        placement:
          type: string
          maxLength: 100
          nullable: true
          description: Semantic placement code (e.g. CENTER, ACCENT_LEFT, ACCENT_RIGHT, HALO, CUSTOM)
    AttachmentSelection:
      type: object
      additionalProperties: false
      required: [reference, quantity]
      properties:
        reference: { type: string, minLength: 1, maxLength: 128 }
        quantity: { type: integer, minimum: 1, maximum: 64 }
        variant: { type: string, maxLength: 64, nullable: true }
        placement: { type: string, maxLength: 100, nullable: true }
    EngravingInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
        text: { type: string, maxLength: 200, nullable: true }
        placement: { type: string, maxLength: 100, nullable: true }
        items:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/EngravingItem' }
        customImages:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/CustomEngravingImage' }
    EngravingItem:
      type: object
      required: [content, type]
      properties:
        id: { type: string, nullable: true }
        type: { type: string, enum: [TEXT, SYMBOL], default: TEXT }
        content: { type: string, minLength: 1, maxLength: 100 }
        placement: { type: string, enum: [INNER_BAND, OUTER_BAND], default: INNER_BAND }
    CustomEngravingImage:
      type: object
      required: [imageUrl]
      properties:
        id: { type: string, nullable: true }
        placement: { type: string, enum: [INNER_BAND, OUTER_BAND], default: INNER_BAND }
        imageUrl: { type: string }
        cropX: { type: integer, default: 0 }
        cropY: { type: integer, default: 0 }
        cropWidth: { type: integer, default: 160 }
        cropHeight: { type: integer, default: 160 }
        contrast: { type: integer, minimum: 0, maximum: 100, default: 50 }
        sharpness: { type: integer, minimum: 0, maximum: 100, default: 50 }
        processedPreviewReference: { type: string, nullable: true }
        price: { type: number, default: 100000.00 }
    DesignResponse:
      type: object
      required: [designId, designVersion, status, validation, evaluation]
      properties:
        designId: { type: string }
        packageReference: { type: string, nullable: true }
        designVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, SAVED, ARCHIVED] }
        validation: { $ref: '#/components/schemas/ValidationResult' }
        evaluation: { $ref: '#/components/schemas/EvaluationResult' }
        componentSnapshot: { type: object, additionalProperties: true }
        recommendation: { $ref: '#/components/schemas/WorkshopRecommendation' }
    WorkshopRecommendation:
      type: object
      required: [recommendationCode, reason, advisory, rulesVersion]
      properties:
        recommendationCode:
          type: string
          enum: [SIGNATURE_SILVER, SIGNATURE_BRASS, SILVER_CLAY, WAX_CASTING, NO_COMPATIBLE_PACKAGE, TOO_RISKY]
        packageReference: { type: string, nullable: true, minLength: 1, maxLength: 128 }
        packageUrl: { type: string, format: uri-reference, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 500 }
        note: { type: string, nullable: true, maxLength: 500 }
        materialDisclosure: { type: string, nullable: true, maxLength: 500, description: Required when suggesting an S999 Silver Clay workshop for a saved S925 design; no saved material changes automatically }
        advisory: { type: boolean, const: true }
        rulesVersion: { type: string, minLength: 1, maxLength: 64 }
    ValidationResult:
      type: object
      required: [valid, reasons]
      properties:
        valid: { type: boolean }
        reasons:
          type: array
          items: { type: string }
    EvaluationResult:
      type: object
      required: [rulesVersion]
      properties:
        estimatedPrice:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\\.[0-9]+)?$'
          nullable: true
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        difficultyScore:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\\.[0-9]+)?$'
          nullable: true
        difficultyLevel:
          type: string
          enum: [EASY, MEDIUM, HARD, VERY_HARD, TOO_RISKY]
          nullable: true
          description: Server-derived from the same immutable policy version as difficultyScore; absent for unreconstructible legacy evaluations.
        estimatedWeightGrams:
          type: string
          nullable: true
        baseWeightLimitGrams:
          type: string
          nullable: true
        materialCost:
          type: string
          nullable: true
        excessMaterialCost:
          type: string
          nullable: true
        engravingCost:
          type: string
          nullable: true
        customImageCount:
          type: integer
          nullable: true
        warnings:
          type: array
          items: { type: string }
        rulesVersion: { type: string, minLength: 1, maxLength: 64 }
        advisory: { type: boolean, const: true }
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Existing contract error code or one of GEMSTONE_TOTAL_LIMIT_EXCEEDED, TEXT_ENGRAVING_LIMIT_EXCEEDED, SYMBOL_ENGRAVING_LIMIT_EXCEEDED, IMAGE_ENGRAVING_LIMIT_EXCEEDED, IMAGE_PREPROCESSING_INVALID, ENGRAVING_PREVIEW_UNAVAILABLE.
        message: { type: string }
        correlationId: { type: string }
        details: { type: array, items: { type: string } }
  responses:
    InvalidInput:
      description: Invalid transport or field input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid active Member identity
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    AccessDenied:
      description: Ownership or permission denied
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Safe not-found response
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Stale, duplicate or idempotency conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BusinessInvalid:
      description: Package or option business validation failure
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RulesUnavailable:
      description: Rules/catalogue dependency unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
