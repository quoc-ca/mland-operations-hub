openapi: 3.0.3
info:
  title: Retail Order and Fulfillment API
  version: 1.0.0-draft
  description: >-
    FE-08 contract for Member retail checkout, order visibility, Staff
    fulfilment operations, and the inbound GHTK status callback. Provider
    credentials and raw provider payloads never cross the client boundary.
servers:
  - url: /api/v1
paths:
  /members/me/ready-ring-cart:
    get:
      summary: Read the authenticated Member's branch-bound retail cart
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Current cart; product facts remain FE-02 projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailCartView'
  /members/me/ready-ring-cart/lines:
    post:
      summary: Add an FE-02-eligible variant to the authenticated Member's cart
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartLineRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailCartView'
        '409':
          $ref: '#/components/responses/Conflict'
  /members/me/ready-ring-cart/lines/{lineId}:
    patch:
      summary: Change quantity of one owned cart line
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/CartLineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartLineRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailCartView'
    delete:
      summary: Remove one owned cart line
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/CartLineId'
      responses:
        '204':
          description: Cart line removed
  /ready-ring-orders:
    post:
      summary: Create or return an idempotent grouped retail checkout
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupedCheckoutRequest'
      responses:
        '201':
          description: Grouped checkout accepted for one payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupedCheckoutView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /ready-ring-benefit-previews:
    post:
      summary: Preview FE-06-approved promotion and loyalty benefits for the current cart
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitPreviewRequest'
      responses:
        '200':
          description: Server-priced benefit preview; shipping is excluded from benefit calculations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitPreviewView'
        '409':
          $ref: '#/components/responses/Conflict'
  /ready-ring-checkouts/{checkoutId}/cancellations:
    post:
      summary: Cancel an accepted unpaid checkout before VNPay payment initiation
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Checkout cancelled; holds released and cart restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupedCheckoutView'
        '409':
          $ref: '#/components/responses/Conflict'
  /ready-ring-checkouts/{checkoutId}/payment:
    post:
      summary: Initiate one VNPay payment for a grouped checkout
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/CheckoutId'
      responses:
        '200':
          description: One payment initiation for all branch orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRedirectView'
        '409':
          $ref: '#/components/responses/Conflict'
  /ready-ring-fulfilment-options:
    get:
      summary: Read available fulfilment methods for a branch
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/LocationIdQuery'
      responses:
        '200':
          description: Branch fulfilment capability without provider secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfilmentAvailabilityView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /ready-ring-shipping-quotes:
    post:
      summary: Quote GHTK delivery from current cart and branch before order creation
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingQuoteRequest'
      responses:
        '200':
          description: Accepted quote projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuoteView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedDestination'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /members/me/ready-ring-orders:
    get:
      summary: List the authenticated Member's retail orders
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Own order projections only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetailOrderView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/ready-ring-orders/{orderId}:
    get:
      summary: Read one own retail order
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Own order detail with latest normalized shipment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailOrderView'
        '404':
          $ref: '#/components/responses/NotFound'
  /ready-ring-orders/{orderId}/preparation:
    post:
      summary: Record authorized Staff preparation
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Updated operational order projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailOrderView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /ready-ring-orders/{orderId}/pickup-confirmations:
    post:
      summary: Record authenticated Member pickup
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pickup recorded once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailOrderView'
        '409':
          $ref: '#/components/responses/Conflict'
  /ready-ring-orders/{orderId}/carrier-handoffs:
    post:
      summary: Record physical GHTK handoff
      security:
        - firebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Carrier custody recorded once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailOrderView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /integrations/ghtk/webhooks:
    post:
      summary: Receive a GHTK shipment status update
      description: >-
        Provider-authenticated inbound callback. It is not a Firebase client
        endpoint. The exact provider callback authentication/hash contract is a
        go-live gate and must be configured before production exposure.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GhtkWebhookRequest'
      responses:
        '200':
          description: Valid update accepted or safe duplicate acknowledged
        '400':
          description: Invalid callback fields
        '401':
          description: Provider authentication failed
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase-ID-Token
  parameters:
    LocationIdQuery:
      name: locationId
      in: query
      required: true
      description: Active processing location selected for the catalogue journey.
      schema:
        type: integer
        format: int64
    CartLineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
  schemas:
    RetailCartView:
      type: object
      required: [lines, version]
      properties:
        version:
          type: integer
          minimum: 0
        lines:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartLineView'
    CartLineView:
      type: object
      required: [id, variantId, locationId, quantity]
      properties:
        id:
          type: string
        variantId:
          type: integer
          format: int64
          minimum: 1
        locationId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    AddCartLineRequest:
      type: object
      required: [variantId, locationId, quantity]
      properties:
        variantId:
          type: integer
          format: int64
          minimum: 1
        locationId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    UpdateCartLineRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
    CreateGroupedCheckoutRequest:
      type: object
      required: [branchOrders, benefitPreviewId, benefitSelection, benefitTermsAccepted]
      properties:
        branchOrders:
          type: array
          minItems: 1
          description: Fulfilment choices keyed by the branch recorded on cart lines.
          items:
            $ref: '#/components/schemas/BranchOrderCheckoutInput'
        benefitPreviewId:
          type: string
          description: Server-issued benefit preview for the current cart and selected benefits.
        benefitSelection:
          $ref: '#/components/schemas/BenefitSelection'
        benefitTermsAccepted:
          type: boolean
          description: Must be true for the server-priced benefit preview being accepted.
    BranchOrderCheckoutInput:
      type: object
      required: [locationId, fulfilment]
      properties:
        locationId:
          type: integer
          format: int64
        fulfilment:
          $ref: '#/components/schemas/FulfilmentChoiceRequest'
    FulfilmentChoiceRequest:
      oneOf:
        - $ref: '#/components/schemas/PickupFulfilmentChoice'
        - $ref: '#/components/schemas/GhtkFulfilmentChoice'
      discriminator:
        propertyName: method
        mapping:
          PICKUP: '#/components/schemas/PickupFulfilmentChoice'
          GHTK: '#/components/schemas/GhtkFulfilmentChoice'
    PickupFulfilmentChoice:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [PICKUP]
    GhtkFulfilmentChoice:
      type: object
      required: [method, shippingQuoteId, recipient]
      properties:
        method:
          type: string
          enum: [GHTK]
        shippingQuoteId:
          type: string
          description: Server-issued quote to revalidate at checkout acceptance.
        recipient:
          $ref: '#/components/schemas/Recipient'
    BenefitPreviewRequest:
      type: object
      required: [selection]
      properties:
        selection:
          $ref: '#/components/schemas/BenefitSelection'
    BenefitSelection:
      oneOf:
        - $ref: '#/components/schemas/NoBenefitSelection'
        - $ref: '#/components/schemas/AutoBenefitSelection'
        - $ref: '#/components/schemas/VoucherBenefitSelection'
      discriminator:
        propertyName: choice
        mapping:
          NONE: '#/components/schemas/NoBenefitSelection'
          AUTO: '#/components/schemas/AutoBenefitSelection'
          VOUCHER: '#/components/schemas/VoucherBenefitSelection'
    NoBenefitSelection:
      type: object
      required: [choice, requestedPoints]
      properties:
        choice:
          type: string
          enum: [NONE]
        requestedPoints:
          $ref: '#/components/schemas/DecimalString'
    AutoBenefitSelection:
      type: object
      required: [choice, requestedPoints]
      properties:
        choice:
          type: string
          enum: [AUTO]
        requestedPoints:
          $ref: '#/components/schemas/DecimalString'
    VoucherBenefitSelection:
      type: object
      required: [choice, voucherCode, requestedPoints]
      properties:
        choice:
          type: string
          enum: [VOUCHER]
        voucherCode:
          type: string
          minLength: 1
          maxLength: 128
        requestedPoints:
          $ref: '#/components/schemas/DecimalString'
    DecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Non-negative base-10 integer string. Used for VND amounts and loyalty points to avoid JavaScript precision loss.
    BenefitPreviewView:
      type: object
      required: [previewId, currency, merchandiseSubtotal, shippingExcluded, discountAmount, pointsDiscountAmount, payableAmount, expiresAt]
      properties:
        previewId:
          type: string
        currency:
          type: string
        merchandiseSubtotal:
          $ref: '#/components/schemas/DecimalString'
        shippingExcluded:
          type: boolean
          enum: [true]
        discountAmount:
          $ref: '#/components/schemas/DecimalString'
        pointsDiscountAmount:
          $ref: '#/components/schemas/DecimalString'
        payableAmount:
          $ref: '#/components/schemas/DecimalString'
        projectedEarnedPoints:
          $ref: '#/components/schemas/DecimalString'
        expiresAt:
          type: string
          format: date-time
    ShippingQuoteRequest:
      type: object
      required: [locationId, recipient]
      properties:
        locationId:
          type: integer
          format: int64
        recipient:
          $ref: '#/components/schemas/Recipient'
    Recipient:
      type: object
      required: [name, phone, province, ward, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: '^(0[0-9]{9}|\+84[0-9]{9})$'
        province:
          type: string
        district:
          type: string
        ward:
          type: string
        address:
          type: string
          minLength: 10
          maxLength: 500
        note:
          type: string
          maxLength: 500
    FulfilmentAvailabilityView:
      type: object
      required: [locationId, availableMethods, contactStaffRequired]
      properties:
        locationId:
          type: integer
          format: int64
        availableMethods:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [PICKUP, GHTK]
        contactStaffRequired:
          type: boolean
        guidanceCode:
          type: string
          nullable: true
    ShippingQuoteView:
      type: object
      required: [quoteId, locationId, currency, deliveryFee, totalCharge, expiresAt]
      properties:
        quoteId:
          type: string
          description: Opaque server-issued identifier; shipping amounts submitted by clients are never trusted.
        locationId:
          type: integer
          format: int64
        currency:
          type: string
        deliveryFee:
          $ref: '#/components/schemas/DecimalString'
        approvedMandatorySurcharge:
          $ref: '#/components/schemas/DecimalString'
        totalCharge:
          $ref: '#/components/schemas/DecimalString'
        expiresAt:
          type: string
          format: date-time
    RetailOrderView:
      type: object
      required: [id, locationId, paymentState, fulfilmentState, subtotal, shippingCharge, payableAmount]
      properties:
        id:
          type: string
        locationId:
          type: integer
          format: int64
        subtotal:
          $ref: '#/components/schemas/DecimalString'
        shippingCharge:
          $ref: '#/components/schemas/DecimalString'
        payableAmount:
          $ref: '#/components/schemas/DecimalString'
        paymentState:
          $ref: '#/components/schemas/PaymentLifecycleState'
        fulfilmentState:
          type: string
          enum: [NOT_SELECTED, PREPARING, READY_FOR_PICKUP, CREATING_SHIPMENT, SHIPMENT_PENDING, SHIPMENT_CREATED, HANDED_TO_CARRIER, PICKED_UP]
        shipmentStatus:
          type: string
          nullable: true
        shipmentLastUpdatedAt:
          type: string
          format: date-time
          nullable: true
        estimatedDeliveryDate:
          type: string
          format: date
          nullable: true
    GroupedCheckoutView:
      type: object
      required: [id, branchOrders, combinedSubtotal, combinedShippingCharge, combinedPayableAmount, paymentState]
      properties:
        id:
          type: string
        branchOrders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RetailOrderView'
        combinedSubtotal:
          $ref: '#/components/schemas/DecimalString'
        combinedShippingCharge:
          $ref: '#/components/schemas/DecimalString'
        combinedPayableAmount:
          $ref: '#/components/schemas/DecimalString'
        paymentState:
          $ref: '#/components/schemas/PaymentLifecycleState'
        paymentInitiatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null only while self-cancellation remains permitted.
    PaymentLifecycleState:
      type: string
      enum: [ACCEPTED_UNPAID, PAYMENT_INITIATED, PAID, FAILED, EXPIRED, CANCELLED, EXCEPTION]
    PaymentRedirectView:
      type: object
      required: [checkoutId, paymentUrl, expiresAt]
      properties:
        checkoutId:
          type: string
        paymentUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    GhtkWebhookRequest:
      type: object
      required: [partner_id, label_id, status_id, action_time]
      properties:
        partner_id:
          type: string
        label_id:
          type: string
        status_id:
          type: integer
        action_time:
          type: string
          format: date-time
        reason_code:
          type: string
        reason:
          type: string
        weight:
          type: number
        fee:
          type: integer
        return_part_package:
          type: integer
    ErrorResponse:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Firebase identity
    Forbidden:
      description: Actor lacks the required Mland authority or scope
    Conflict:
      description: Stale, duplicate, expired, or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is not visible to the actor
    UnsupportedDestination:
      description: GHTK cannot quote the recipient destination
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: GHTK is disabled, unavailable, or timed out; no payment attempt is created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

