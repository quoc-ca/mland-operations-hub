spring.application.name=ppswbs_backend

# Database & JPA settings
spring.datasource.url=${JDBC_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${JDBC_USER}
spring.datasource.password=${JDBC_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Locale & Messages
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.web.locale=vi

# Firebase Configuration
firebase.client.api-key=${FIREBASE_API_KEY}
firebase.client.auth-domain=${FIREBASE_AUTH_DOMAIN}
firebase.client.project-id=${FIREBASE_PROJECT_ID}
firebase.client.app-id=${FIREBASE_APP_ID}
firebase.admin.credentials-path=${FIREBASE_ADMIN_CREDENTIALS_PATH:}
firebase.admin.service-account-json=${FIREBASE_ADMIN_SERVICE_ACCOUNT:}
firebase.emulator.host=${FIREBASE_AUTH_EMULATOR_HOST:}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Server
server.port=${SERVER_PORT:8080}

# App Mail Adapter
app.mail.adapter=${APP_MAIL_ADAPTER:captured}

# Member Auth Entitlement
member-auth.allowed-origins=${MEMBER_AUTH_ALLOWED_ORIGINS:http://localhost:8000,http://localhost:8080}

# VNPay Payment Gateway
vnpay.tmn-code=${VNPAY_TMN_CODE:F61WYCBQ}
vnpay.hash-secret=${VNPAY_HASH_SECRET:IGMYLQHKCLFUVCRGWKPMRGEYEYBPXXPR}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/workshop-bookings/lookup}

# Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:mock}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# Workshop Operations Security
workshop.operations.auth.allow-test-tokens=false

# Workshop Operations Idempotency Ledger
workshop.operations.idempotency.lease-duration=${WORKSHOP_OPERATIONS_IDEMPOTENCY_LEASE_DURATION}
workshop.operations.idempotency.retention-duration=${WORKSHOP_OPERATIONS_IDEMPOTENCY_RETENTION_DURATION:PT24H}
