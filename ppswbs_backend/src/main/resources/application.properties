spring.application.name=ppswbs_backend

# Database & JPA settings
spring.datasource.url=${JDBC_URL:jdbc:h2:mem:ppswbsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${JDBC_DRIVER:org.h2.Driver}
spring.datasource.username=${JDBC_USER:sa}
spring.datasource.password=${JDBC_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Locale & Messages
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.web.locale=vi

# Firebase Configuration
firebase.client.api-key=${FIREBASE_API_KEY:mock-api-key}
firebase.client.auth-domain=${FIREBASE_AUTH_DOMAIN:mock-project.firebaseapp.com}
firebase.client.project-id=${FIREBASE_PROJECT_ID:mock-project}
firebase.client.app-id=${FIREBASE_APP_ID:1:123456789:web:abcdef}
firebase.admin.credentials-path=${FIREBASE_ADMIN_CREDENTIALS_PATH:}
firebase.admin.service-account-json=${FIREBASE_ADMIN_SERVICE_ACCOUNT:}
firebase.emulator.host=${FIREBASE_AUTH_EMULATOR_HOST:}

# App Mail Adapter
app.mail.adapter=${APP_MAIL_ADAPTER:captured}

# Member Auth Entitlement
member-auth.allowed-origins=${MEMBER_AUTH_ALLOWED_ORIGINS:http://localhost:8000,http://localhost:8080}

