spring.application.name=ppswbs_backend

# Database & JPA settings
spring.datasource.url=${JDBC_URL:jdbc:mysql://localhost:3306/ppswbs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${JDBC_USER:root}
spring.datasource.password=${JDBC_PASSWORD:sa123123}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Firebase Configuration
firebase.client.api-key=${FIREBASE_API_KEY:mock-api-key}
firebase.client.auth-domain=${FIREBASE_AUTH_DOMAIN:mock-project.firebaseapp.com}
firebase.client.project-id=${FIREBASE_PROJECT_ID:mock-project}
firebase.client.app-id=${FIREBASE_APP_ID:1:123456789:web:abcdef}
firebase.admin.credentials-path=${FIREBASE_ADMIN_CREDENTIALS_PATH:}
firebase.admin.service-account-json=${FIREBASE_ADMIN_SERVICE_ACCOUNT:}
firebase.emulator.host=${FIREBASE_AUTH_EMULATOR_HOST:}

# Server
server.port=${SERVER_PORT:8080}
