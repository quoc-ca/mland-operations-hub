<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Workshop Packages</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Available Workshops</h1>
        <a href="/workshop-bookings/lookup" class="btn btn-outline-primary fw-semibold">🔍 Tra cứu Booking (Lookup)</a>
    </div>
    <div class="row">
        <div class="col-md-4" th:each="pkg : ${packages}">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${pkg.name}">Package Name</h5>
                    <p class="card-text" th:text="${pkg.description}">Description</p>
                    <p class="card-text">
                        <strong>Price: </strong><span th:text="${pkg.price}"></span> <span th:text="${pkg.currency}"></span>
                    </p>
                    <a th:href="@{/workshop-bookings/packages/detail(id=${pkg.id})}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
