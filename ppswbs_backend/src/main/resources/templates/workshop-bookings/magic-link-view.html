<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Booking Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Booking Details</h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title" th:text="${booking.bookingCode}">Booking Code</h5>
            <p><strong>Package:</strong> <span th:text="${booking.packageNameSnapshot}"></span></p>
            <p><strong>Participants:</strong> <span th:text="${booking.participantCount}"></span></p>
            <p><strong>Status:</strong> <span class="badge bg-info" th:text="${booking.bookingStatus}"></span></p>
            <p><strong>Payment Status:</strong> <span class="badge bg-success" th:text="${booking.paymentStatus}"></span></p>
            
            <div th:if="${ticket != null}" class="mt-4 p-3 bg-light rounded">
                <h4>🎟️ E-Ticket</h4>
                <p><strong>QR Reference:</strong> <span th:text="${ticket.qrValue}"></span></p>
                <p><strong>Valid Until:</strong> <span th:text="${ticket.validUntil}"></span></p>
                <img th:src="@{/images/qr-placeholder.png}" alt="QR Code" width="150" />
            </div>
        </div>
    </div>
</div>
</body>
</html>
