spring.application.name=ppswbs_backend-test

spring.datasource.url=${JDBC_URL:${TEST_JDBC_URL:jdbc:mysql://localhost:3307/ppswbs_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}
spring.datasource.driver-class-name=${TEST_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${JDBC_USER:${TEST_JDBC_USER:root}}
spring.datasource.password=${JDBC_PASSWORD:${TEST_JDBC_PASSWORD:sa123456}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

firebase.client.api-key=test-api-key
firebase.client.auth-domain=test-project.firebaseapp.com
firebase.client.project-id=test-project
firebase.client.app-id=1:12345:web:test

# Workshop Operations Test Profile
workshop.operations.auth.allow-test-tokens=true
workshop.operations.idempotency.lease-duration=PT30S
workshop.operations.idempotency.retention-duration=PT24H
firebase.admin.credentials-path=
firebase.admin.service-account-json=
firebase.emulator.host=

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
