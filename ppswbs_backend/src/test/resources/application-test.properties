spring.application.name=ppswbs_backend-test

spring.datasource.url=${TEST_JDBC_URL:jdbc:h2:mem:ppswbstestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${TEST_JDBC_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_JDBC_USER:sa}
spring.datasource.password=${TEST_JDBC_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${TEST_SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

firebase.client.api-key=test-api-key
firebase.client.auth-domain=test-project.firebaseapp.com
firebase.client.project-id=test-project
firebase.client.app-id=1:12345:web:test

# Workshop Operations Test Profile
workshop.operations.auth.allow-test-tokens=true
workshop.operations.idempotency.lease-duration=PT30S
workshop.operations.idempotency.retention-duration=PT24H
firebase.admin.credentials-path=
firebase.admin.service-account-json=
firebase.emulator.host=

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
