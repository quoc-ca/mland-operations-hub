spring.application.name=ppswbs_backend-test

spring.datasource.url=${TEST_JDBC_URL:jdbc:mysql://localhost:3307/ppswbs_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=${TEST_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${TEST_JDBC_USER:root}
spring.datasource.password=${TEST_JDBC_PASSWORD:sa123123}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

firebase.client.api-key=test-api-key
firebase.client.auth-domain=test-project.firebaseapp.com
firebase.client.project-id=test-project
firebase.client.app-id=1:12345:web:test
