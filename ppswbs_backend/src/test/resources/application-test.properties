spring.application.name=ppswbs_backend-test

spring.datasource.url=jdbc:h2:mem:ppswbstestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

firebase.client.api-key=test-api-key
firebase.client.auth-domain=test-project.firebaseapp.com
firebase.client.project-id=test-project
firebase.client.app-id=1:12345:web:test

app.mail.adapter=captured
