# Profile "productmanagement-mysql-test" (T018): external, disposable MySQL 8.4 database only.
# Values come from the environment. PM_TEST_JDBC_* override the developer's JDBC_*; there is no
# hard-coded URL, user or password, so a missing value fails fast instead of using H2 or a default.
spring.datasource.url=${PM_TEST_JDBC_URL:${JDBC_URL}}
spring.datasource.username=${PM_TEST_JDBC_USER:${JDBC_USER}}
spring.datasource.password=${PM_TEST_JDBC_PASSWORD:${JDBC_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The background jobs (T047, T100) are called directly by the tests, not on a schedule.
catalogue.scheduling.enabled=false

# Required by other modules that now share the application context (merged from develop 2026-10-27).
# Non-secret test placeholders, same values as application-test.properties.
firebase.client.api-key=test-api-key
firebase.client.auth-domain=test-project.firebaseapp.com
firebase.client.project-id=test-project
firebase.client.app-id=1:12345:web:test
firebase.admin.credentials-path=
firebase.admin.service-account-json=
firebase.emulator.host=
workshop.operations.idempotency.lease-duration=PT30S
workshop.operations.idempotency.retention-duration=PT24H
