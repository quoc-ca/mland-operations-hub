# Profile "productmanagement-mysql-test" (T018): external, disposable MySQL 8.4 database only.
# Values come from the environment. PM_TEST_JDBC_* override the developer's JDBC_*; there is no
# hard-coded URL, user or password, so a missing value fails fast instead of using H2 or a default.
spring.datasource.url=${PM_TEST_JDBC_URL:${JDBC_URL}}
spring.datasource.username=${PM_TEST_JDBC_USER:${JDBC_USER}}
spring.datasource.password=${PM_TEST_JDBC_PASSWORD:${JDBC_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The background jobs (T047, T100) are called directly by the tests, not on a schedule.
catalogue.scheduling.enabled=false
