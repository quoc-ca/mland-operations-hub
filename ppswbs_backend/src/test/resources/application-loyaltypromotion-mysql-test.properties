# Profile "loyaltypromotion-mysql-test" (T005): external, disposable MySQL 8.4 database only.
# Values come from the environment; there is no hard-coded URL, user or password and no H2 fallback,
# so a missing value fails fast. The URL MUST come from LOYALTY_TEST_JDBC_URL only (2026-11-14):
# falling back to the developer's JDBC_URL wrote ~290 test programmes into the dev database ppswbs_dev.
# User/password may still come from JDBC_USER/JDBC_PASSWORD (same server credentials).
spring.datasource.url=${LOYALTY_TEST_JDBC_URL}
spring.datasource.username=${LOYALTY_TEST_JDBC_USER:${JDBC_USER}}
spring.datasource.password=${LOYALTY_TEST_JDBC_PASSWORD:${JDBC_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
# Prevent application-test.properties or a command-line test default from making
# Hibernate create/drop the shared MySQL schema. Flyway is the only schema owner.
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.open-in-view=false

# Keep cached integration-test contexts small and do not run unrelated background jobs.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
app.scheduling.enabled=false
spring.modulith.moments.enabled=false

# Required by other modules that now share the application context (merged from develop 2026-10-27).
# Non-secret test placeholders, same values as application-test.properties.
firebase.client.api-key=test-api-key
firebase.client.auth-domain=test-project.firebaseapp.com
firebase.client.project-id=test-project
firebase.client.app-id=1:12345:web:test
firebase.admin.credentials-path=
firebase.admin.service-account-json=
firebase.emulator.host=
workshop.operations.idempotency.lease-duration=PT30S
workshop.operations.idempotency.retention-duration=PT24H

# Catalogue background jobs (002) are called directly by tests, not on a schedule.

# Tests never send real email, even when .env sets APP_MAIL_ADAPTER=smtp.
app.mail.adapter=captured
