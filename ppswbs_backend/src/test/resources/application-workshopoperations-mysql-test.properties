spring.datasource.url=${WORKSHOP_OPERATIONS_TEST_JDBC_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${WORKSHOP_OPERATIONS_TEST_JDBC_USER}
spring.datasource.password=${WORKSHOP_OPERATIONS_TEST_JDBC_PASSWORD}

# This profile must only target an explicitly supplied, already-migrated test database.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
