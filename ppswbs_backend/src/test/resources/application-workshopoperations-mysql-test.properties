spring.datasource.url=${WORKSHOP_OPERATIONS_TEST_JDBC_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${WORKSHOP_OPERATIONS_TEST_JDBC_USER}
spring.datasource.password=${WORKSHOP_OPERATIONS_TEST_JDBC_PASSWORD}

# This profile must only target an explicitly supplied, disposable test database.
# Flyway is the only schema owner; Hibernate must never create or drop this schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.flyway.enabled=true

# Keep cached integration-test contexts small and do not run unrelated background jobs.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
app.scheduling.enabled=false
spring.modulith.moments.enabled=false

# Tests never send real email, even when .env sets APP_MAIL_ADAPTER=smtp.
app.mail.adapter=captured
