services:
  mysql:
    image: mysql:8.0
    container_name: ppswbs-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MYSQL_DATABASE: ppswbs_dev
      MYSQL_USER: sa
      MYSQL_PASSWORD: "123"
    ports:
      - "3306:3306"
    volumes:
      - ppswbs_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u sa -p123 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ppswbs-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: sa
      PMA_PASSWORD: "123"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  ppswbs_mysql_data:
    name: ppswbs_mysql_data

